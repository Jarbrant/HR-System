<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Inbjudningar</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .layout{ display:grid; grid-template-columns: 1fr; gap:12px; align-items:start; }
    .panel{ border: 1px solid var(--line); transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; }
    .panel:hover{ transform: translateY(-1px); box-shadow: var(--shadow-soft); filter: brightness(1.01); }
    .panel.list{ background: rgba(191,219,254,.18); }
    .item{ border:1px solid var(--line); border-radius: var(--r14); padding: 12px; background:#fff; transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; display:flex; gap:10px; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; margin-top:10px; }
    .item:hover{ transform: var(--lift); box-shadow: var(--shadow-soft); filter: brightness(1.02); }
    .item-title{ font-weight: 950; margin:0; }
    .meta{ color: var(--muted); font-size:.9rem; display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
    .empty{ padding:18px; border:1px dashed var(--line); border-radius: var(--r14); color: var(--muted); background:#fff; text-align:center; margin-top:10px; }
    .guardbox{ margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r14); background: #fff; color: var(--muted); }
    .guardbox.err{ border-color: rgba(239,68,68,.35); background: rgba(254,226,226,.55); color: #7f1d1d; }
    .smallnote{ font-size:.9rem; color: var(--muted); margin-top:8px; }
    code{ font-size:.95em; }
    .pill.bad{ border-color: rgba(239,68,68,.35); background: rgba(254,226,226,.55); color:#7f1d1d; }
    .pill.ok{ border-color: rgba(34,197,94,.25); background: rgba(220,252,231,.65); color:#14532d; }
  </style>
</head>

<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Inbjudningar</span>
  </div>

  <nav class="nav" aria-label="Meny">
    <a href="./shell.html">System Shell</a>
    <a href="./health.html">Systemstatus</a>
    <a href="./roles.html">Rollmallar</a>
    <a href="./modules.html">Moduler</a>
    <a href="./integrations.html">Integrationer</a>
    <a href="./policies.html">Policys</a>
    <a href="./invitations.html" aria-current="page">Inbjudningar</a>
    <a href="#" id="navLogout" style="margin-left:auto;">Logga ut</a>
  </nav>
</header>

<main class="container">
  <h1 class="tight">Inbjudningar</h1>
  <p class="muted">Skapa och skicka inbjudningar med roll och scope.</p>

  <section class="card">
    <div id="guardPanel" class="guardbox" style="display:none;"></div>

    <div class="layout">
      <section class="panel list" aria-label="Skapa Inbjudning">
        <div class="panel-title">Skapa en inbjudan</div>

        <div class="toolbar" aria-label="Filter och åtgärder">
          <div class="left">
            <label style="margin:0; min-width:220px;">
              Roll
              <select id="role">
                <option value="EMPLOYEE">Anställd</option>
                <option value="MANAGER">Chef</option>
                <option value="ADMIN">Admin</option>
              </select>
            </label>

            <label style="margin:0; min-width:220px;">
              Scope
              <input id="scope" type="text" placeholder="t.ex. IT-avdelning" />
            </label>

            <label style="margin:0; min-width:220px;">
              Expiry (timmar)
              <input id="expiry" type="number" min="1" value="24" />
            </label>
          </div>

          <div class="right">
            <button id="btnSendInvite" type="button" class="secondary">Skicka Inbjudan</button>
          </div>
        </div>

        <p id="msg" class="message" aria-live="polite" style="margin: 0 0 10px;"></p>

        <div id="list"></div>

        <div class="smallnote">
          Inbjudningarna är simulerade och skickas inte faktiskt via e-post.
        </div>
      </section>
    </div>
  </section>
</main>

<script>
(function() {
  "use strict";

  const SESSION_KEY = "AO-001_LOGIN_V1";
  const ROLE_ASSIGNMENTS_KEY = "AO-020_ROLE_ASSIGNMENTS_V2";
  const ORG_KEY = "AO-020_ORG_V1";
  const INVITATIONS_KEY = "AO-019_INVITATIONS_V1";

  const $ = (s) => document.querySelector(s);

  function redirectLogin() {
    window.location.replace("../UI/UI-01-SKELETON.html");
  }

  function readRawSession() {
    const s1 = sessionStorage.getItem(SESSION_KEY);
    if (s1) return s1;
    const s2 = localStorage.getItem(SESSION_KEY);
    if (s2) return s2;
    return null;
  }

  function safeParseStorage(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      const v = JSON.parse(raw);
      return (v === null || v === undefined) ? fallback : v;
    } catch {
      return fallback;
    }
  }

  function escapeHtml(s) {
    return String(s ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function normalizeRole(r) {
    return String(r || "").trim().toLowerCase();
  }

  function readAuth() {
    try {
      const raw = readRawSession();
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data?.auth?.isAuthed) return null;

      const role = normalizeRole(data.auth.role);
      if (role !== "system_admin") return null;

      if (data.auth.expiresAt && data.auth.expiresAt < Date.now()) return null;

      return data.auth;
    } catch {
      return null;
    }
  }

  function setGuard(kind, text) {
    const box = $("#guardPanel");
    if (!text) {
      box.style.display = "none";
      box.className = "guardbox";
      box.textContent = "";
      return;
    }
    box.style.display = "block";
    box.className = "guardbox" + (kind ? " " + kind : "");
    box.textContent = text;
  }

  function setMsg(kind, text) {
    const m = $("#msg");
    m.className = "message" + (kind ? " " + kind : "");
    m.textContent = text || "";
  }

  const auth = readAuth();
  if (!auth) {
    redirectLogin();
    return;
  }

  $("#whoName").textContent = auth.displayName || "SYSTEM_ADMIN";

  function sendInvite() {
    const role = $("#role").value;
    const scope = $("#scope").value;
    const expiry = parseInt($("#expiry").value, 10) * 3600 * 1000; // Convert to ms

    if (!scope || !role || !expiry) {
      setMsg("err", "Alla fält måste fyllas i.");
      return;
    }

    const inviteLink = `${window.location.origin}/invite?role=${role}&scope=${scope}&expiry=${Date.now() + expiry}`;

    const invitation = {
      inviteLink,
      expiry: Date.now() + expiry,
      role,
      scopeId: scope,
      generatedBy: auth.empNo,
      createdAt: Date.now(),
      active: true
    };

    let invitations = safeParseStorage(INVITATIONS_KEY, []);
    invitations.push(invitation);
    localStorage.setItem(INVITATIONS_KEY, JSON.stringify(invitations));

    setMsg("ok", `Inbjudan skapad. Länk: ${escapeHtml(inviteLink)}`);

    render();
  }

  $("#btnSendInvite").addEventListener("click", sendInvite);

  function render() {
    const list = $("#list");
    list.innerHTML = "";

    const invitations = safeParseStorage(INVITATIONS_KEY, []);
    if (invitations.length === 0) {
      list.innerHTML = `<div class="empty">Inga inbjudningar skapade.</div>`;
      return;
    }

    invitations.forEach(invite => {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <div style="flex:1;">
          <p class="item-title">${escapeHtml(invite.role)} - ${escapeHtml(invite.scopeId)}</p>
          <div class="meta">
            <span><strong>Länk:</strong> <a href="${escapeHtml(invite.inviteLink)}" target="_blank">Visa länk</a></span>
            <span><strong>Expiry:</strong> ${new Date(invite.expiry).toLocaleString()}</span>
          </div>
        </div>
      `;
      list.appendChild(item);
    });
  }

  render();
})();
</script>

</body>
</html>
