<!-- ============================================================
AO-SYS-COMPANY-CREATE-PLACEHOLDER-404FIX-01 (HOTFIX) | FIL-ID: system/company-create.html
Projekt: HR-System (GitHub Pages / localStorage-first)
Syfte: Ta bort 404 från dashboard-länken genom att skapa en minimal, fail-closed placeholder-sida för company-create.
Obs: Detta är ENBART en placeholder. Ingen org-write, ingen konto-logik, ingen ny datamodell.

POLICY (LÅST):
- UI-only • Ingen backend
- SYSTEM_ADMIN-only • Fail-closed via HRApp.requireAuth
- Inga nya storage-keys/datamodell
- Ingen write till AO-020_ORG_V1, inga konton, inga assignments
- XSS-safe rendering (textContent)
- Hel-filsleverans: skapa exakt filen på exakt sökväg: /system/company-create.html

SCOPE (LÅST):
- Skapa NY fil: system/company-create.html
- Innehåll får endast vara:
  A) Standard HTML-head + länk till ../UI/UI-02-STYLES.css
  B) Topbar med samma semantik som andra system-sidor (Min sida neutral, Logga ut röd-tonad)
  C) Main med rubrik “Skapa bolag” och text “Sidan byggs nu (DEMO).”
  D) En knapp tillbaka till dashboard och en knapp till org-karta
  E) Auth-guard: om core/auth saknas -> redirect till UI-01-SKELETON.html?err=core
  F) Logout-knapp kopplad till HRApp.logout()

KRAV (EXAKTA LÄNKAR):
- “Systemstart” -> ./dashboard.html
- “Org-karta” -> ./org.html
- “Roller” -> ./assignments.html (om ni har den i topbar)
- Min sida -> ./dashboard.html

FAIL-CLOSED (MÅSTE):
- Om window.HRApp saknas eller HRApp.requireAuth saknas:
  - redirect till ../UI/UI-01-SKELETON.html?err=core
- Om användaren inte är SYSTEM_ADMIN:
  - redirect till ../UI/UI-01-SKELETON.html?err=forbidden

ACCEPTANCE CRITERIA (MÅSTE):
1) https://jarbrant.github.io/HR-System/system/company-create.html ger INTE 404 efter push
2) SYSTEM_ADMIN kan öppna sidan och se placeholder-text
3) Icke-SYSTEM_ADMIN blockeras (redirect)
4) Inga writes sker till localStorage (org/assignments/users)

TEST (MINST):
- Öppna länken direkt -> sidan laddar utan 404
- Klick “Systemstart” -> tillbaka till dashboard
- Klick “Org-karta” -> går till org.html
- Klick “Logga ut” -> logout fungerar och redirect sker

KONTROLLFRÅGA TILL FORGE (MÅSTE BESVARAS):
- Bekräfta exakt sökväg i repo: /system/company-create.html och att filen är committad/pushad till GitHub Pages-branch.
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HR-System – System • Skapa bolag</title>
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css">
</head>

<body>
  <!-- Topbar (semantik enligt system-sidor) -->
  <header class="topbar" role="banner">
    <nav class="topbar__nav" aria-label="Systemnavigation">
      <a class="topbar__link" href="./dashboard.html">Systemstart</a>
      <a class="topbar__link" href="./org.html">Org-karta</a>
      <a class="topbar__link" href="./assignments.html">Roller</a>
    </nav>

    <div class="topbar__right" aria-label="Session">
      <a class="topbar__link" href="./dashboard.html" aria-label="Min sida">Min sida</a>
      <button id="btnLogout" type="button" class="btn btn-danger" aria-label="Logga ut">
        Logga ut
      </button>
    </div>
  </header>

  <main class="container" role="main">
    <h1>Skapa bolag</h1>
    <p id="placeholderText">Sidan byggs nu (DEMO).</p>

    <div class="actions" role="group" aria-label="Navigation">
      <a class="btn" href="./dashboard.html">Tillbaka till dashboard</a>
      <a class="btn" href="./org.html">Till org-karta</a>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      // FAIL-CLOSED: core/auth saknas => redirect
      if (!window.HRApp || typeof window.HRApp.requireAuth !== "function") {
        window.location.href = "../UI/UI-01-SKELETON.html?err=core";
        return;
      }

      // Auth-guard: måste vara SYSTEM_ADMIN (fail-closed)
      let session = null;
      try {
        session = window.HRApp.requireAuth() || null;
      } catch (e) {
        window.location.href = "../UI/UI-01-SKELETON.html?err=core";
        return;
      }

      // Om requireAuth inte returnerar session, försök läsa den utan writes (tolerant)
      if (!session) {
        try {
          if (typeof window.HRApp.mustGetSession === "function") session = window.HRApp.mustGetSession();
          else if (typeof window.HRApp.getSession === "function") session = window.HRApp.getSession();
        } catch (e2) {
          window.location.href = "../UI/UI-01-SKELETON.html?err=core";
          return;
        }
      }

      const role = (session && (session.roleId || session.role)) ? String(session.roleId || session.role) : "";
      if (role !== "SYSTEM_ADMIN") {
        window.location.href = "../UI/UI-01-SKELETON.html?err=forbidden";
        return;
      }

      // Logout (LÅST): HRApp.logout()
      const btn = document.getElementById("btnLogout");
      if (btn) {
        btn.addEventListener("click", function () {
          try {
            if (window.HRApp && typeof window.HRApp.logout === "function") {
              window.HRApp.logout();
              return;
            }
          } finally {
            // Om logout inte redirectar själv, landa säkert.
            window.location.href = "../UI/UI-01-SKELETON.html?err=logout";
          }
        });
      }
    })();
  </script>

  <!--
  KONTROLLFRÅGA (MÅSTE BESVARAS):
  - Bekräftat mål: Filen ska ligga på exakt sökväg i repo: /system/company-create.html
    och vara committad + pushad till den branch som GitHub Pages publicerar.
  -->
</body>
</html>
