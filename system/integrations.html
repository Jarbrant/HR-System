<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Integrationer</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }

    .panel:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.01);
    }

    .panel.list {
      background: rgba(191, 219, 254, .18);
    }

    .item {
      border: 1px solid var(--line);
      border-radius: var(--r14);
      padding: 12px;
      background: #fff;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .item:hover {
      transform: var(--lift);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.02);
    }

    .item-title {
      font-weight: 950;
      margin: 0;
    }

    .meta {
      color: var(--muted);
      font-size: .9rem;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .empty {
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: var(--r14);
      color: var(--muted);
      background: #fff;
      text-align: center;
    }

    .guardbox {
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--r14);
      background: #fff;
      color: var(--muted);
    }

    .guardbox.err {
      border-color: rgba(239, 68, 68, .35);
      background: rgba(254, 226, 226, .55);
      color: #7f1d1d;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .toolbar .left {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
      flex: 1 1 520px;
    }

    .toolbar .right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      flex: 0 0 auto;
    }

    .smallnote {
      font-size: .9rem;
      color: var(--muted);
      margin-top: 8px;
    }

    code {
      font-size: .95em;
    }

    .pill.warn {
      border-color: rgba(244, 63, 94, .35);
      background: rgba(244, 63, 94, .10);
    }
  </style>
</head>

<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Integrationer</span>
  </div>

  <nav class="nav" aria-label="Meny">
    <a href="./home.html">Hem</a>
    <a href="./tasks.html">Uppgifter</a>
    <a href="./questions.html">Frågor</a>
    <a href="./reports.html">Felrapporter</a>
    <a href="./answers.html">Svar</a>
    <a href="./integrations.html" aria-current="page">Integrationer</a>
    <a href="#" id="navLogout" style="margin-left:auto;">Logga ut</a>
  </nav>
</header>

<main class="container">
  <h1 class="tight">Integrationer</h1>
  <p class="muted">Hantera externa API-integrationer och deras status.</p>

  <section class="card">
    <div id="guardPanel" class="guardbox" style="display:none;"></div>

    <div class="layout">
      <section class="panel list" aria-label="Lista externa integrationer">
        <div class="panel-title">Integrationer</div>

        <div class="toolbar" aria-label="Filter och åtgärder">
          <div class="left">
            <label style="margin:0; min-width:220px;">
              Visa
              <select id="filter">
                <option value="all" selected>Alla integrationer</option>
                <option value="enabled">Aktiverade integrationer</option>
                <option value="disabled">Inaktiverade integrationer</option>
              </select>
            </label>

            <label style="margin:0; min-width:260px; flex: 1 1 260px;">
              Sök (integrationens namn)
              <input id="search" type="text" placeholder="t.ex. Riksarkivet API" />
            </label>
          </div>

          <div class="right">
            <button id="btnEnable" type="button" class="secondary">Aktivera integration</button>
            <button id="btnDisable" type="button" class="secondary">Inaktivera integration</button>
          </div>
        </div>

        <div id="msg" class="message" aria-live="polite" style="margin: 0 0 10px;"></div>

        <div id="list"></div>

        <div class="smallnote">
          Integrationer styr åtkomst till externa tjänster. Aktivering påverkar systemets tillgång till dessa.
        </div>
      </section>
    </div>
  </section>

</main>

<script>
(function() {
  "use strict";

  const SESSION_KEY = "AO-001_LOGIN_V1";
  const INTEGRATIONS_KEY = "AO-015_INTEGRATIONS_V1";

  const $ = (s) => document.querySelector(s);

  function redirectLogin() {
    window.location.replace("../UI/UI-01-SKELETON.html");
  }

  function readRawSession() {
    const s1 = sessionStorage.getItem(SESSION_KEY);
    if (s1) return s1;
    const s2 = localStorage.getItem(SESSION_KEY);
    if (s2) return s2;
    return null;
  }

  function normalizeRole(r) {
    return String(r || "").trim().toLowerCase();
  }

  function readAuth() {
    try {
      const raw = readRawSession();
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data?.auth?.isAuthed) return null;

      const role = normalizeRole(data.auth.role);
      if (role !== "system_admin") return null;

      if (data.auth.expiresAt && data.auth.expiresAt < Date.now()) return null;

      const empNo = data.auth.empNo ?? "";
      return { ...data.auth, role, empNo };
    } catch {
      return null;
    }
  }

  function setGuard(kind, text) {
    const box = $("#guardPanel");
    if (!text) {
      box.style.display = "none";
      box.className = "guardbox";
      box.textContent = "";
      return;
    }
    box.style.display = "block";
    box.className = "guardbox" + (kind ? " " + kind : "");
    box.textContent = text;
  }

  const auth = readAuth();
  if (!auth) {
    redirectLogin();
    return;
  }

  if (auth.role !== "system_admin") {
    setGuard("err", "Åtkomst nekad: Endast SYSTEM_ADMIN kan nå denna sida.");
    return;
  }

  function loadIntegrations() {
    const integrations = JSON.parse(localStorage.getItem(INTEGRATIONS_KEY) || "[]");
    return Array.isArray(integrations) ? integrations : [];
  }

  function saveIntegrations(integrations) {
    localStorage.setItem(INTEGRATIONS_KEY, JSON.stringify(integrations));
  }

  function renderIntegrations() {
    const integrations = loadIntegrations();
    const list = $("#list");
    list.innerHTML = "";

    const filter = $("#filter").value;
    const query = $("#search").value.toLowerCase();

    const filteredIntegrations = integrations
      .filter(integration => (filter === "all" || (filter === "enabled" && integration.status === "enabled") || (filter === "disabled" && integration.status === "disabled")))
      .filter(integration => integration.name.toLowerCase().includes(query));

    if (filteredIntegrations.length === 0) {
      list.innerHTML = `<div class="empty">Inga integrationer matchar sökningen.</div>`;
      return;
    }

    filteredIntegrations.forEach(integration => {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <div style="flex:1;">
          <p class="item-title">${integration.name}</p>
          <div class="meta">
            <span>${integration.description}</span>
            <span class="pill">${integration.status === "enabled" ? "Aktiverad" : "Inaktiverad"}</span>
          </div>
        </div>
        <div class="row" style="gap:8px;">
          <button type="button" class="secondary" data-enable="${integration.id}">Aktivera</button>
          <button type="button" class="secondary" data-disable="${integration.id}">Inaktivera</button>
        </div>
      `;
      list.appendChild(item);

      item.querySelector(`[data-enable="${integration.id}"]`).addEventListener("click", () => {
        integration.status = "enabled";
        saveIntegrations(integrations);
        renderIntegrations();
      });

      item.querySelector(`[data-disable="${integration.id}"]`).addEventListener("click", () => {
        integration.status = "disabled";
        saveIntegrations(integrations);
        renderIntegrations();
      });
    });
  }

  renderIntegrations();
})();
</script>

</body>
</html>
