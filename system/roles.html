<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Rollmallar</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .panel:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.01);
    }
    .panel.list {
      background: rgba(191, 219, 254, .18);
    }

    .item {
      border: 1px solid var(--line);
      border-radius: var(--r14);
      padding: 12px;
      background: #fff;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .item:hover {
      transform: var(--lift);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.02);
    }

    .item-title {
      font-weight: 950;
      margin: 0;
    }

    .meta {
      color: var(--muted);
      font-size: .9rem;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .empty {
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: var(--r14);
      color: var(--muted);
      background: #fff;
      text-align: center;
    }

    .guardbox {
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--r14);
      background: #fff;
      color: var(--muted);
    }
    .guardbox.err {
      border-color: rgba(239, 68, 68, .35);
      background: rgba(254, 226, 226, .55);
      color: #7f1d1d;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .toolbar .left {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
      flex: 1 1 520px;
    }

    .toolbar .right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      flex: 0 0 auto;
    }

    .smallnote {
      font-size: .9rem;
      color: var(--muted);
      margin-top: 8px;
    }

    code {
      font-size: .95em;
    }

    .pill.warn {
      border-color: rgba(244, 63, 94, .35);
      background: rgba(244, 63, 94, .10);
    }
  </style>
</head>

<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Rollmallar</span>
  </div>

  <nav class="nav" aria-label="Meny">
    <a href="./home.html">Hem</a>
    <a href="./tasks.html">Uppgifter</a>
    <a href="./questions.html">Frågor</a>
    <a href="./reports.html">Felrapporter</a>
    <a href="./answers.html">Svar</a>
    <a href="./integrations.html">Integrationer</a>
    <a href="#" id="navLogout" style="margin-left:auto;">Logga ut</a>
  </nav>
</header>

<main class="container">
  <h1 class="tight">Rollmallar</h1>
  <p class="muted">Skapa, uppdatera och ta bort rollmallar för systemet.</p>

  <section class="card">
    <div id="guardPanel" class="guardbox" style="display:none;"></div>

    <div class="layout">
      <section class="panel list" aria-label="Lista rollmallar">
        <div class="panel-title">Rollmallar</div>

        <div class="toolbar" aria-label="Filter och åtgärder">
          <div class="left">
            <label style="margin:0; min-width:220px;">
              Visa
              <select id="filter">
                <option value="all" selected>Alla mallar</option>
                <option value="active">Aktiva mallar</option>
                <option value="inactive">Inaktiva mallar</option>
              </select>
            </label>

            <label style="margin:0; min-width:260px; flex: 1 1 260px;">
              Sök (mallnamn)
              <input id="search" type="text" placeholder="t.ex. ADMIN" />
            </label>
          </div>

          <div class="right">
            <button id="btnCreate" type="button" class="secondary">Skapa ny mall</button>
          </div>
        </div>

        <div id="msg" class="message" aria-live="polite" style="margin: 0 0 10px;"></div>

        <div id="list"></div>

        <div class="smallnote">
          Mallarna är definierade och hanteras av SYSTEM_ADMIN.
        </div>
      </section>
    </div>
  </section>

  <div id="modalCreate" style="display:none;">
    <div class="panel">
      <div class="panel-title">Skapa Rollmall</div>
      <form id="createForm">
        <label>
          Mallnamn:
          <input type="text" id="name" required />
        </label>
        <label>
          Beskrivning:
          <input type="text" id="description" required />
        </label>
        <label>
          Aktiverad:
          <input type="checkbox" id="active" checked />
        </label>

        <button type="submit">Skapa Mall</button>
        <button type="button" id="btnCancel">Avbryt</button>
      </form>
    </div>
  </div>
</main>

<script>
(function(){
  "use strict";

  const SESSION_KEY = "AO-001_LOGIN_V1";
  const ROLES_KEY = "AO-014_ROLES_V1";
  const ASSIGNMENTS_KEY = "AO-020_ROLE_ASSIGNMENTS_V2";

  const $ = (s) => document.querySelector(s);

  function redirectLogin() {
    window.location.replace("../UI/UI-01-SKELETON.html");
  }

  function readRawSession() {
    const s1 = sessionStorage.getItem(SESSION_KEY);
    if (s1) return s1;
    const s2 = localStorage.getItem(SESSION_KEY);
    if (s2) return s2;
    return null;
  }

  function normalizeRole(r) {
    return String(r || "").trim().toLowerCase();
  }

  function readAuth() {
    try {
      const raw = readRawSession();
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data?.auth?.isAuthed) return null;

      const role = normalizeRole(data.auth.role);
      if (role !== "system_admin") return null;

      if (data.auth.expiresAt && data.auth.expiresAt < Date.now()) return null;

      const empNo = data.auth.empNo ?? "";
      return { ...data.auth, role, empNo };
    } catch {
      return null;
    }
  }

  function setGuard(kind, text) {
    const box = $("#guardPanel");
    if (!text) {
      box.style.display = "none";
      box.className = "guardbox";
      box.textContent = "";
      return;
    }
    box.style.display = "block";
    box.className = "guardbox" + (kind ? " " + kind : "");
    box.textContent = text;
  }

  const auth = readAuth();
  if (!auth) {
    redirectLogin();
    return;
  }

  if (auth.role !== "system_admin") {
    setGuard("err", "Åtkomst nekad: Endast SYSTEM_ADMIN kan nå denna sida.");
    return;
  }

  function loadRoles() {
    const roles = JSON.parse(localStorage.getItem(ROLES_KEY) || "[]");
    return Array.isArray(roles) ? roles : [];
  }

  function saveRoles(roles) {
    localStorage.setItem(ROLES_KEY, JSON.stringify(roles));
  }

  function renderRoles() {
    const roles = loadRoles();
    const list = $("#list");
    list.innerHTML = "";

    const filter = $("#filter").value;
    const query = $("#search").value.toLowerCase();

    const filteredRoles = roles
      .filter(role => (filter === "all" || (filter === "active" && role.active) || (filter === "inactive" && !role.active)))
      .filter(role => role.name.toLowerCase().includes(query));

    if (filteredRoles.length === 0) {
      list.innerHTML = `<div class="empty">Inga mallar matchar sökningen.</div>`; 
      return;
    }

    filteredRoles.forEach(role => {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <div style="flex:1;">
          <p class="item-title">${role.name}</p>
          <div class="meta">
            <span>${role.description}</span>
            <span class="pill">${role.active ? "Aktiv" : "Inaktiv"}</span>
          </div>
        </div>
        <div class="row" style="gap:8px;">
          <button type="button" class="secondary" data-edit="${role.id}">Redigera</button>
          <button type="button" class="secondary" data-delete="${role.id}">Ta bort</button>
        </div>
      `;
      list.appendChild(item);

      item.querySelector(`[data-edit="${role.id}"]`).addEventListener("click", () => {
        // Redigera funktion här
      });

      item.querySelector(`[data-delete="${role.id}"]`).addEventListener("click", () => {
        const confirmed = confirm("Vill du verkligen ta bort denna mall?");
        if (confirmed) {
          const updatedRoles = roles.filter(r => r.id !== role.id);
          saveRoles(updatedRoles);
          renderRoles();
        }
      });
    });
  }

  $("#btnCreate").addEventListener("click", () => {
    $("#modalCreate").style.display = "block";
  });

  $("#btnCancel").addEventListener("click", () => {
    $("#modalCreate").style.display = "none";
  });

  $("#createForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("#name").value.trim();
    const description = $("#description").value.trim();
    const active = $("#active").checked;

    const newRole = {
      id: Date.now().toString(),
      name,
      description,
      permissions: [],
      createdAt: Date.now(),
      createdBy: auth.empNo,
      active
    };

    const roles = loadRoles();
    roles.push(newRole);
    saveRoles(roles);
    $("#modalCreate").style.display = "none";
    renderRoles();
  });

  renderRoles();
})();
</script>

</body>
</html>
