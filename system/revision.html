<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Revision</title>
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    /* Styling for layout and elements */
    .layout{ display:grid; grid-template-columns: 1fr; gap:12px; align-items:start; }
    .panel{ border: 1px solid var(--line); transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; }
    .panel:hover{ transform: translateY(-1px); box-shadow: var(--shadow-soft); filter: brightness(1.01); }
    .panel.list{ background: rgba(191,219,254,.18); }

    .item{ border:1px solid var(--line); border-radius: var(--r14); padding: 12px; background:#fff; transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; display:flex; gap:10px; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; margin-top:10px; }
    .item:hover{ transform: var(--lift); box-shadow: var(--shadow-soft); filter: brightness(1.02); }

    .item-title{ font-weight: 950; margin:0; }
    .meta{ color: var(--muted); font-size:.9rem; display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
    .empty{ padding:18px; border:1px dashed var(--line); border-radius: var(--r14); color: var(--muted); background:#fff; text-align:center; margin-top:10px; }

    .guardbox{ margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r14); background: #fff; color: var(--muted); }
    .guardbox.err{ border-color: rgba(239,68,68,.35); background: rgba(254,226,226,.55); color: #7f1d1d; }

    .smallnote{ font-size:.9rem; color: var(--muted); margin-top:8px; }
    code{ font-size:.95em; }

    .pill.bad{ border-color: rgba(239,68,68,.35); background: rgba(254,226,226,.55); color:#7f1d1d; }
    .pill.ok{ border-color: rgba(34,197,94,.25); background: rgba(220,252,231,.65); color:#14532d; }
  </style>

  <script>
    // ==============================
    // GLOBAL SCRIPTS
    // ==============================

    // Function to escape XSS
    function escapeHtml(str) {
      var div = document.createElement('div');
      if (str) {
        div.innerText = str;
        div.textContent = str;
      }
      return div.innerHTML;
    }

    // Check authentication and role
    function checkAuth() {
      const session = JSON.parse(localStorage.getItem('AO-001_LOGIN_V1')) || null;
      const role = session ? session.role : null;
      if (!session || role !== 'SYSTEM_ADMIN') {
        document.body.innerHTML = '<div class="fail-closed">Access Denied: SYSTEM_ADMIN only</div>';
        return false;
      }
      return true;
    }

    // Function to fetch audit logs from localStorage
    function getAuditLogs() {
      const auditLogs = JSON.parse(localStorage.getItem('AO-018_AUDIT_LOGS_V1')) || [];
      const orgTree = JSON.parse(localStorage.getItem('AO-020_ORG_V1')) || {};
      const roleAssignments = JSON.parse(localStorage.getItem('AO-020_ROLE_ASSIGNMENTS_V2')) || {};

      // Check if logs exist
      if (!auditLogs.length) {
        document.getElementById('logs-container').innerHTML = '<p>No logs found.</p>';
        return;
      }

      const filterEmpNo = document.getElementById('filter-empNo').value;
      const filterScope = document.getElementById('filter-scope').value;
      const filterEntity = document.getElementById('filter-entity').value;

      // Filter logs based on parameters
      const filteredLogs = auditLogs.filter(log => {
        return (!filterEmpNo || log.changedBy === filterEmpNo) &&
               (!filterScope || log.scopeId === filterScope) &&
               (!filterEntity || log.entity === filterEntity);
      });

      displayLogs(filteredLogs);
    }

    // Function to display logs
    function displayLogs(logs) {
      const container = document.getElementById('logs-container');
      container.innerHTML = '';

      if (logs.length === 0) {
        container.innerHTML = '<p>No matching logs found.</p>';
        return;
      }

      logs.forEach(log => {
        const logItem = document.createElement('div');
        logItem.classList.add('log-item');

        logItem.innerHTML = `
          <p><strong>Action:</strong> ${escapeHtml(log.action)}</p>
          <p><strong>Entity:</strong> ${escapeHtml(log.entity)}</p>
          <p><strong>Details:</strong> ${escapeHtml(log.details)}</p>
          <p><strong>Changed by:</strong> ${escapeHtml(log.changedBy)}</p>
          <p><strong>When:</strong> ${new Date(log.timestamp).toLocaleString()}</p>
          <p><strong>Scope ID:</strong> ${escapeHtml(log.scopeId)}</p>
        `;
        container.appendChild(logItem);
      });
    }

    // Initialize
    window.onload = function() {
      if (checkAuth()) {
        getAuditLogs();
      }
    }
  </script>
</head>

<body>
  <!-- Fail-Closed Panel for Unauthorized Access -->
  <div class="fail-closed" id="fail-closed" style="display:none;">
    <p>Access Denied: SYSTEM_ADMIN only</p>
  </div>

  <!-- Filter Section -->
  <div id="filter-panel">
    <h2>Filter Logs</h2>
    <label for="filter-empNo">Employee Number:</label>
    <input type="text" id="filter-empNo" placeholder="Filter by empNo">
    <label for="filter-scope">Scope:</label>
    <input type="text" id="filter-scope" placeholder="Filter by Scope ID">
    <label for="filter-entity">Entity:</label>
    <input type="text" id="filter-entity" placeholder="Filter by Entity">
    <button onclick="getAuditLogs()">Filter</button>
  </div>

  <!-- Logs Display Section -->
  <div id="logs-container"></div>
</body>
</html>
