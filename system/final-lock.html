<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Export</title>
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .layout{ display:grid; grid-template-columns: 1fr; gap:12px; align-items:start; }
    .panel{ border: 1px solid var(--line); transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; }
    .panel:hover{ transform: translateY(-1px); box-shadow: var(--shadow-soft); filter: brightness(1.01); }
    .panel.list{ background: rgba(191,219,254,.18); }

    .item{ border:1px solid var(--line); border-radius: var(--r14); padding: 12px; background:#fff; transition: transform .15s ease, box-shadow .15s ease, filter .15s ease; display:flex; gap:10px; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; margin-top:10px; }
    .item:hover{ transform: var(--lift); box-shadow: var(--shadow-soft); filter: brightness(1.02); }

    .item-title{ font-weight: 950; margin:0; }
    .meta{ color: var(--muted); font-size:.9rem; display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
    .empty{ padding:18px; border:1px dashed var(--line); border-radius: var(--r14); color: var(--muted); background:#fff; text-align:center; margin-top:10px; }

    .guardbox{ margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r14); background: #fff; color: var(--muted); }
    .guardbox.err{ border-color: rgba(239,68,68,.35); background: rgba(254,226,226,.55); color: #7f1d1d; }

    .smallnote{ font-size:.9rem; color: var(--muted); margin-top:8px; }
    code{ font-size:.95em; }
  </style>

  <script>
    // ==============================
    // GLOBAL SCRIPTS
    // ==============================

    // Function to escape XSS
    function escapeHtml(str) {
      var div = document.createElement('div');
      if (str) {
        div.innerText = str;
        div.textContent = str;
      }
      return div.innerHTML;
    }

    // Check authentication and role
    function checkAuth() {
      const session = JSON.parse(localStorage.getItem('AO-001_LOGIN_V1')) || null;
      const role = session ? session.role : null;

      // Kontrollera om sessionen saknas eller om rollen inte är SYSTEM_ADMIN
      if (!session || role !== 'SYSTEM_ADMIN') {
        // Visa ett meddelande istället för en alert och omdirigera användaren
        document.body.innerHTML = '<div class="fail-closed">Access Denied: SYSTEM_ADMIN only</div>';
        return false;
      }
      return true;
    }

    // Function to fetch exportable data from localStorage
    function getExportData() {
      const users = JSON.parse(localStorage.getItem('AO-020_USERS_V2')) || [];
      const roles = JSON.parse(localStorage.getItem('AO-020_ROLES_V2')) || [];

      const activeUsers = users.filter(user => user.status === 'active');
      const activeRoles = roles.filter(role => role.status === 'active');

      const exportData = {
        users: activeUsers.map(user => ({
          empNo: user.empNo,
          role: user.role,
          scope: user.scope,
          status: user.status
        })),
        roles: activeRoles.map(role => ({
          role: role.role,
          permissions: role.permissions
        }))
      };

      return exportData;
    }

    // Function to export data as JSON
    function exportData() {
      if (!checkAuth()) return;  // Check auth before proceeding

      // Show loading message
      setExportStatus("Exporting data...");

      // Get exportable data
      const exportDataObj = getExportData();

      // Validate the export data
      if (!validateExportData(exportDataObj)) {
        alert('Export data validation failed! Ensure there are active users and roles.');
        return;
      }

      // Convert data to JSON format
      const exportJson = JSON.stringify(exportDataObj, null, 2);

      // Trigger download of JSON file
      downloadJson(exportJson);
    }

    // Validate the export data
    function validateExportData(data) {
      if (!data.users || data.users.length === 0 || !data.roles || data.roles.length === 0) {
        return false;
      }
      return true;
    }

    // Function to trigger the download of the JSON file
    function downloadJson(jsonData) {
      const blob = new Blob([jsonData], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'system_export.json';
      link.click();
      URL.revokeObjectURL(url);

      // Show success message
      setExportStatus("Export complete!");
    }

    // Function to set the export status message
    function setExportStatus(message) {
      const statusMessage = document.getElementById('export-status');
      statusMessage.textContent = message;
    }

    // Initialize page
    window.onload = function() {
      if (!checkAuth()) return;  // Ensure SYSTEM_ADMIN is authenticated
    }
  </script>
</head>
<body>
  <div class="fail-closed" id="fail-closed" style="display:none;">
    <p>Access Denied: SYSTEM_ADMIN only</p>
  </div>

  <!-- Export Button Section -->
  <div id="export-section">
    <h2>Export Data</h2>
    <p>Only SYSTEM_ADMIN can export data to JSON format. This will export active users and roles, with no sensitive personal data.</p>
    
    <button onclick="exportData()">Export Data as JSON</button>

    <p id="export-status" class="muted" style="margin-top: 10px;">No export in progress.</p>
  </div>

</body>
</html>
