<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Policys</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }

    .panel:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.01);
    }

    .panel.list {
      background: rgba(191, 219, 254, .18);
    }

    .item {
      border: 1px solid var(--line);
      border-radius: var(--r14);
      padding: 12px;
      background: #fff;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .item:hover {
      transform: var(--lift);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.02);
    }

    .item-title {
      font-weight: 950;
      margin: 0;
    }

    .meta {
      color: var(--muted);
      font-size: .9rem;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .empty {
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: var(--r14);
      color: var(--muted);
      background: #fff;
      text-align: center;
    }

    .guardbox {
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--r14);
      background: #fff;
      color: var(--muted);
    }

    .guardbox.err {
      border-color: rgba(239, 68, 68, .35);
      background: rgba(254, 226, 226, .55);
      color: #7f1d1d;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .toolbar .left {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: flex-end;
      flex: 1 1 520px;
    }

    .toolbar .right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      flex: 0 0 auto;
    }

    .smallnote {
      font-size: .9rem;
      color: var(--muted);
      margin-top: 8px;
    }

    code {
      font-size: .95em;
    }

    .pill.warn {
      border-color: rgba(244, 63, 94, .35);
      background: rgba(244, 63, 94, .10);
    }
  </style>
</head>

<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Policys</span>
  </div>

  <nav class="nav" aria-label="Meny">
    <a href="./home.html">Hem</a>
    <a href="./tasks.html">Uppgifter</a>
    <a href="./questions.html">Frågor</a>
    <a href="./reports.html">Felrapporter</a>
    <a href="./answers.html">Svar</a>
    <a href="./integrations.html">Integrationer</a>
    <a href="./policies.html" aria-current="page">Policys</a>
    <a href="#" id="navLogout" style="margin-left:auto;">Logga ut</a>
  </nav>
</header>

<main class="container">
  <h1 class="tight">Policys</h1>
  <p class="muted">Hantera systempolicys och deras status.</p>

  <section class="card">
    <div id="guardPanel" class="guardbox" style="display:none;"></div>

    <div class="layout">
      <section class="panel list" aria-label="Lista systempolicys">
        <div class="panel-title">Systempolicys</div>

        <div class="toolbar" aria-label="Filter och åtgärder">
          <div class="left">
            <label style="margin:0; min-width:220px;">
              Visa
              <select id="filter">
                <option value="all" selected>Alla policys</option>
                <option value="active">Aktiva policys</option>
                <option value="inactive">Inaktiva policys</option>
              </select>
            </label>

            <label style="margin:0; min-width:260px; flex: 1 1 260px;">
              Sök (policynamn)
              <input id="search" type="text" placeholder="t.ex. session TTL" />
            </label>
          </div>

          <div class="right">
            <button id="btnUpdate" type="button" class="secondary">Uppdatera policy</button>
            <button id="btnDelete" type="button" class="secondary">Ta bort policy</button>
          </div>
        </div>

        <div id="msg" class="message" aria-live="polite" style="margin: 0 0 10px;"></div>

        <div id="list"></div>

        <div class="smallnote">
          Systempolicys styr olika systeminställningar som session TTL och exportregler.
        </div>
      </section>
    </div>
  </section>

</main>

<script>
(function() {
  "use strict";

  const SESSION_KEY = "AO-001_LOGIN_V1";
  const POLICIES_KEY = "AO-016_POLICIES_V1";

  const $ = (s) => document.querySelector(s);

  function redirectLogin() {
    window.location.replace("../UI/UI-01-SKELETON.html");
  }

  function readRawSession() {
    const s1 = sessionStorage.getItem(SESSION_KEY);
    if (s1) return s1;
    const s2 = localStorage.getItem(SESSION_KEY);
    if (s2) return s2;
    return null;
  }

  function normalizeRole(r) {
    return String(r || "").trim().toLowerCase();
  }

  function readAuth() {
    try {
      const raw = readRawSession();
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data?.auth?.isAuthed) return null;

      const role = normalizeRole(data.auth.role);
      if (role !== "system_admin") return null;

      if (data.auth.expiresAt && data.auth.expiresAt < Date.now()) return null;

      const empNo = data.auth.empNo ?? "";
      return { ...data.auth, role, empNo };
    } catch {
      return null;
    }
  }

  function setGuard(kind, text) {
    const box = $("#guardPanel");
    if (!text) {
      box.style.display = "none";
      box.className = "guardbox";
      box.textContent = "";
      return;
    }
    box.style.display = "block";
    box.className = "guardbox" + (kind ? " " + kind : "");
    box.textContent = text;
  }

  const auth = readAuth();
  if (!auth) {
    redirectLogin();
    return;
  }

  if (auth.role !== "system_admin") {
    setGuard("err", "Åtkomst nekad: Endast SYSTEM_ADMIN kan nå denna sida.");
    return;
  }

  function loadPolicies() {
    const policies = JSON.parse(localStorage.getItem(POLICIES_KEY) || "[]");
    return Array.isArray(policies) ? policies : [];
  }

  function savePolicies(policies) {
    localStorage.setItem(POLICIES_KEY, JSON.stringify(policies));
  }

  function renderPolicies() {
    const policies = loadPolicies();
    const list = $("#list");
    list.innerHTML = "";

    const filter = $("#filter").value;
    const query = $("#search").value.toLowerCase();

    const filteredPolicies = policies
      .filter(policy => (filter === "all" || (filter === "active" && policy.active) || (filter === "inactive" && !policy.active)))
      .filter(policy => policy.name.toLowerCase().includes(query));

    if (filteredPolicies.length === 0) {
      list.innerHTML = `<div class="empty">Inga policys matchar sökningen.</div>`;
      return;
    }

    filteredPolicies.forEach(policy => {
      const item = document.createElement("div");
      item.className = "item";
      item.innerHTML = `
        <div style="flex:1;">
          <p class="item-title">${policy.name}</p>
          <div class="meta">
            <span>${policy.description}</span>
            <span class="pill">${policy.active ? "Aktiv" : "Inaktiv"}</span>
          </div>
        </div>
        <div class="row" style="gap:8px;">
          <button type="button" class="secondary" data-update="${policy.id}">Uppdatera</button>
          <button type="button" class="secondary" data-delete="${policy.id}">Ta bort</button>
        </div>
      `;
      list.appendChild(item);

      item.querySelector(`[data-update="${policy.id}"]`).addEventListener("click", () => {
        policy.active = !policy.active;
        savePolicies(policies);
        renderPolicies();
      });

      item.querySelector(`[data-delete="${policy.id}"]`).addEventListener("click", () => {
        const index = policies.findIndex(p => p.id === policy.id);
        if (index !== -1) {
          policies.splice(index, 1);
          savePolicies(policies);
          renderPolicies();
        }
      });
    });
  }

  renderPolicies();
})();
</script>

</body>
</html>
