name = "hrsystem"
main = "worker/index.js"
compatibility_date = "2026-01-15"

[vars]
ALLOWED_ORIGIN = "https://jarbrant.github.io"
REQUIRE_AUTH = "true"
AI_ENABLED = "true"
RULES_BASE_URL = "https://jarbrant.github.io/HR-System"

[ai]
binding = "AI"

[env.production]
vars = { REQUIRE_AUTH = "true", AI_ENABLED = "true" }

[env.dev]
vars = { REQUIRE_AUTH = "false", AI_ENABLED = "true" }
