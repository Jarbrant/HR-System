name = "hr-system"
main = "worker/index.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGIN = "https://jarbrant.github.io"
REQUIRE_AUTH = "true"
AI_ENABLED = "true"
RULES_BASE_URL = "https://jarbrant.github.io/HR-System"

[ai]
binding = "AI"

[env.production]
vars = { ENVIRONMENT = "production", REQUIRE_AUTH = "true", AI_ENABLED = "true" }

[env.dev]
vars = { ENVIRONMENT = "development", REQUIRE_AUTH = "false", AI_ENABLED = "true", ALLOWED_ORIGIN = "*" }
