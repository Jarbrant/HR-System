<!-- ============================================================
AO-003 | FIL-ID: UI/UI-01-SKELETON.html
Projekt: HR-System
Syfte: Minimalt login-steg (stam) + routing via kärnan (AO-002)
Nivå: UI-only (GitHub Pages) | localStorage-first
Policy (LÅST):
- Ingen backend
- Ingen ny auth-logik (använd AO-002: getAuth/routeAfterLogin/requireAuth)
- Ingen RBAC/scope/redirect-logik i sidan (endast routeAfterLogin)
- Fail-closed: ogiltig input eller okänd roll => stanna kvar
- Inga nya storage-keys/datamodell utan AO (AO-003: återanvänder AO-001_LOGIN_V1)
- Ingen känslig persondata (endast empNo)
- URL-parametrar (?err=...) får visas som text men påverkar inte logik
Senaste sanning: 2025-12-30 (AO-003 v1.2 PATCH-ORDER från PRC)
Ändringslogg:
- v1.2: strict login-target match + writeSession boolean + empNo digits-only fail + TTL 8h fast (optional override via config)
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Login</title>
  <meta name="description" content="Stam-login. Router deterministiskt via kärnans routeAfterLogin." />
  <link rel="stylesheet" href="./UI-02-STYLES.css" />
</head>
<body>

<main class="container" style="max-width:720px;">
  <section class="card">
    <h1 class="tight">Logga in</h1>

    <!-- URL-parametrar får bara VISAS som text (ingen logik kopplad) -->
    <p id="errText" class="muted small" style="margin-top:6px;"></p>

    <form id="loginForm" novalidate>
      <label for="empNo">
        Anställningsnummer (empNo)
      </label>
      <input
        id="empNo"
        name="empNo"
        type="text"
        inputmode="numeric"
        autocomplete="username"
        required
        maxlength="20"
        aria-describedby="msg"
      />

      <label for="role" style="margin-top:10px;">
        Roll
      </label>
      <select id="role" name="role" required aria-describedby="msg">
        <option value="">Välj…</option>
        <option value="EMPLOYEE">EMPLOYEE</option>
        <option value="MANAGER">MANAGER</option>
        <option value="ADMIN">ADMIN</option>
        <option value="SYSTEM_ADMIN">SYSTEM_ADMIN</option>
      </select>

      <div style="display:flex; gap:10px; margin-top:12px;">
        <button id="btnLogin" type="submit">Logga in</button>
        <button id="btnClear" class="secondary" type="button">Rensa</button>
      </div>

      <p id="msg" class="message" aria-live="polite" style="margin-top:12px;"></p>
    </form>
  </section>
</main>

<!-- AO-002 beroenden (LÅSTA): config måste laddas före app -->
<script src="./UI-04-CONFIG.js"></script>
<script src="./UI-03-APP.js"></script>

<script>
/* ============================================================
AO-003 v1.2 | FIL-ID: UI/UI-01-SKELETON.html (inline JS)
Patch-order (PRC):
- isLoginTarget() => strikt path-jämförelse (ingen includes)
- writeSession() => return boolean; blockera redirect vid false
- empNo => faila om icke-siffror (t.ex. 12-34)
- TTL: 8h fast, optional override via config
============================================================ */
(function () {
  "use strict";

  // STORAGE: återanvänd befintlig nyckel (ingen ny key)
  const SESSION_KEY = "AO-001_LOGIN_V1";

  // EMPNO: strikt siffror-only, fail-closed
  const EMPNO_MAXLEN = 20;
  const EMPNO_RE = /^[0-9]{1,20}$/;

  // TTL: 8h fast, optional override via config (om HR_CONFIG.SESSION_TTL_MS finns)
  const DEFAULT_TTL_MS = 8 * 60 * 60 * 1000;

  const $ = (s) => document.querySelector(s);

  function setMsg(kind, text) {
    const el = $("#msg");
    if (!el) return;
    el.className = "message" + (kind ? " " + kind : "");
    el.textContent = text || "";
  }

  function showUrlErrText() {
    const el = $("#errText");
    if (!el) return;

    const u = new URL(window.location.href);
    const err = u.searchParams.get("err");

    if (err) el.textContent = "Info: " + String(err);
    else el.textContent = "";
  }

  function initOrFail() {
    const form = $("#loginForm");
    const btnClear = $("#btnClear");
    const emp = $("#empNo");
    const role = $("#role");

    if (!form || !btnClear || !emp || !role) {
      setMsg("err", "Systemfel: UI-mall saknar element.");
      return null;
    }

    if (!window.HR_CONFIG) {
      setMsg("err", "Systemfel: config saknas (HR_CONFIG).");
      return null;
    }
    if (!window.HRApp || typeof window.HRApp.routeAfterLogin !== "function") {
      setMsg("err", "Systemfel: kärnan saknas (HRApp).");
      return null;
    }

    return { form, btnClear, emp, role };
  }

  function getAllowedRoles() {
    const cfg = window.HR_CONFIG;
    if (!cfg || !cfg.ROLES) return [];
    return Object.keys(cfg.ROLES).map((k) => cfg.ROLES[k]);
  }

  function isValidRole(role, allowed) {
    const r = String(role || "").trim();
    return allowed.includes(r);
  }

  function normalizeEmpNo(raw) {
    // PRC: empNo ska faila om icke-siffror => vi "sanerar" inte, vi validerar strikt
    const s = String(raw || "").trim();
    return s.length > EMPNO_MAXLEN ? s.slice(0, EMPNO_MAXLEN) : s;
  }

  function validateEmpNo(empNo) {
    return EMPNO_RE.test(String(empNo || ""));
  }

  function getSessionTtlMs() {
    // TTL: 8h fast, optional override via config
    const cfg = window.HR_CONFIG;
    const ttl = cfg && typeof cfg.SESSION_TTL_MS === "number" ? cfg.SESSION_TTL_MS : null;
    // GUARD: rimlig override (annars default 8h)
    if (ttl && ttl > 60 * 1000 && ttl < 30 * 24 * 60 * 60 * 1000) return ttl;
    return DEFAULT_TTL_MS;
  }

  function buildSession(empNo, role) {
    const now = Date.now();
    const ttl = getSessionTtlMs();
    return {
      auth: {
        isAuthed: true,
        role: String(role || "").trim(),
        scopeId: "",
        empNo: String(empNo || "").trim(),
        issuedAt: now,
        expiresAt: now + ttl
      }
    };
  }

  function safePathFromUrlString(urlStr) {
    // Returnerar pathname utan query/hash, defensivt
    try {
      const u = new URL(String(urlStr || ""), window.location.origin);
      return String(u.pathname || "");
    } catch {
      return "";
    }
  }

  function getLoginPathnameStrict() {
    // Vi jämför strikt mot "login-sidans pathname" i nuvarande app.
    // Byggt från aktuell location, men med filnamnet fast.
    try {
      const u = new URL(window.location.href);
      const p = String(u.pathname || "/");
      // Ersätt sista segmentet med UI/UI-01-SKELETON.html om vi kan, annars använd app-root + /UI/...
      const idx = p.lastIndexOf("/UI/");
      if (idx >= 0) return p.slice(0, idx) + "/UI/UI-01-SKELETON.html";
      // fallback: anta att vi ligger under /UI/ redan
      const lastSlash = p.lastIndexOf("/");
      const base = lastSlash >= 0 ? p.slice(0, lastSlash) : "";
      return base + "/UI-01-SKELETON.html";
    } catch {
      return "/UI/UI-01-SKELETON.html";
    }
  }

  function isLoginTarget(targetUrl) {
    // PRC: strikt path-jämförelse (ingen includes).
    // - target kan ha ?x#y => vi jämför endast pathname.
    const targetPath = safePathFromUrlString(targetUrl);
    if (!targetPath) return false;
    const loginPath = getLoginPathnameStrict();
    return targetPath === loginPath;
  }

  function computeTargetOrFail(sessionObj) {
    const target = window.HRApp.routeAfterLogin(sessionObj);
    if (!target || typeof target !== "string") {
      setMsg("err", "Inloggning misslyckades (ingen giltig route).");
      return "";
    }
    return target;
  }

  function writeSession(sessionObj) {
    // PRC: return boolean; blockera redirect vid false
    const raw = JSON.stringify(sessionObj);

    // Primär: sessionStorage
    try {
      sessionStorage.setItem(SESSION_KEY, raw);
      return true;
    } catch {}

    // Fallback: localStorage
    try {
      localStorage.setItem(SESSION_KEY, raw);
      return true;
    } catch {}

    return false;
  }

  // ---- init ----
  showUrlErrText();

  const dom = initOrFail();
  if (!dom) return;

  const allowedRoles = getAllowedRoles();
  if (!allowedRoles.length) {
    setMsg("err", "Systemfel: roller saknas i config.");
    return;
  }

  dom.btnClear.addEventListener("click", function () {
    dom.emp.value = "";
    dom.role.value = "";
    setMsg("", "");
  });

  dom.form.addEventListener("submit", function (e) {
    e.preventDefault();
    setMsg("", "");

    const empNo = normalizeEmpNo(dom.emp.value);
    const role = String(dom.role.value || "").trim();

    if (!empNo) {
      setMsg("err", "Fyll i anställningsnummer.");
      return;
    }
    // PRC: empNo ska faila om icke-siffror (t.ex. 12-34)
    if (!validateEmpNo(empNo)) {
      setMsg("err", "Ogiltigt anställningsnummer (endast siffror).");
      return;
    }
    if (!role) {
      setMsg("err", "Välj roll.");
      return;
    }
    if (!isValidRole(role, allowedRoles)) {
      setMsg("err", "Ogiltig roll.");
      return;
    }

    // Beräkna target först (fail-closed)
    const sessionObj = buildSession(empNo, role);
    const target = computeTargetOrFail(sessionObj);
    if (!target) return;

    // Om kärnan skickar tillbaka till login -> skriv inte session
    if (isLoginTarget(target)) {
      setMsg("err", "Inloggning nekad (ogiltig route).");
      return;
    }

    // Skriv session; om misslyckas -> visa fel och stoppa redirect
    const ok = writeSession(sessionObj);
    if (!ok) {
      setMsg("err", "Systemfel: kan inte spara session (storage blockerat).");
      return;
    }

    window.location.replace(target);
  });

})();
</script>

</body>
</html>
