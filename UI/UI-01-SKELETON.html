Projekt: HR-System
Syfte: Stam-login (gemensam ingång för alla roller)
Policy:
- Ingen backend
- Ingen PIN i v1
- Ingen rollstyrning här (sker i JS)
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Logga in</title>

  <link rel="stylesheet" href="./UI-02-STYLES.css" />
</head>
<body>

  <main class="login-wrap">

    <section class="login-card" id="view-login">
      <h1>Logga in</h1>

      <form id="loginForm" novalidate>
        <label>
          Namn
          <input id="inpName" type="text" autocomplete="name" />
        </label>

        <label>
          Anställningsnummer
          <input id="inpEmpNo" type="text" inputmode="numeric" />
        </label>

        <label>
          Lösenord
          <input id="inpPassword" type="password" />
        </label>

        <div class="actions">
          <button id="btnLogin" type="submit">Logga in</button>
          <button id="btnReset" type="button" class="secondary">Rensa</button>
        </div>

        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>

      <p class="muted small">
        Problem med inlogg? Kontakta administratör.
      </p>
    </section>

    <!-- Admin-vy (minimal placeholder i v1) -->
    <section id="view-admin" hidden>
      <h1>Admin</h1>
      <p>Inloggad som <strong id="adminWho">—</strong></p>
      <p>Roll: <span id="adminRole">—</span></p>
      <button id="btnLogoutAdmin" class="secondary">Logga ut</button>
    </section>

    <!-- Employee placeholder (ska inte visas, redirect sker) -->
    <section id="view-employee" hidden>
      <p>Redirectar…</p>
    </section>

  </main>

  <!-- AO-001 | FIL-ID: UI/UI-03-APP.js -->
  <script src="./UI-03-APP.js"></script>
</body>
</html>
