<!-- ============================================================
AO-001 | FIL-ID: UI/UI-01-SKELETON.html
Projekt: HR-System
Syfte: Stammens login + roll-routing (admin/employee) – UI-only v1
Fix (stabilitet):
- Sparar session i sessionStorage (primär) + localStorage (fallback) med samma nyckel
- Förhindrar "klick => logout" när någon sida råkar läsa från fel storage
Policy/lås:
- Roller v1: admin, employee
- PIN implementeras inte (hook: pinRequired=false + TODO)
- Inga känsliga data lagras
- Rate-limit i klient (cooldown)
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Login</title>
  <meta name="description" content="Stammens login. Routar till rätt vy baserat på roll." />

  <link rel="stylesheet" href="./UI-02-STYLES.css" />
</head>
<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Login</span>
  </div>
</header>

<main class="container">
  <section class="card">
    <h1 class="tight">Logga in</h1>
    <p class="muted">Gemensam ingång för alla roller (v1).</p>

    <form id="loginForm" novalidate>
      <div class="row wrap">
        <label style="flex:1; min-width:240px;">
          Namn
          <input id="name" name="name" type="text" autocomplete="name" placeholder="t.ex. Anders" />
        </label>

        <label style="flex:1; min-width:240px;">
          Anställningsnummer
          <input id="empNo" name="empNo" type="text" inputmode="numeric" autocomplete="username" placeholder="t.ex. 1234" />
        </label>
      </div>

      <label style="margin-top:10px;">
        Lösenord
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </label>

      <div class="row-actions" style="margin-top:12px;">
        <button id="btnLogin" type="submit">Logga in</button>
        <button id="btnClear" class="secondary" type="button">Rensa</button>
      </div>

      <p id="msg" class="message" aria-live="polite"></p>
      <p id="cooldownMsg" class="muted small" style="margin-top:8px; display:none;"></p>

      <p class="muted small" style="margin-top:12px;">
        v1: Ingen “glömt lösen”. Kontakta admin vid problem.
      </p>
    </form>
  </section>
</main>

<script>
/* ============================================================
AO-001 | FIL-ID: UI/UI-01-SKELETON.html (inline JS)
============================================================ */
(function(){
  "use strict";

  // ---- Storage keys (låsta) ----
  const SESSION_KEY   = "AO-001_LOGIN_V1";
  const COOLDOWN_KEY  = "AO-001_COOLDOWN_V1";

  // ---- Rate-limit / cooldown (light) ----
  const MAX_FAILS = 5;
  const COOLDOWN_MS = 30 * 1000;

  const $ = (s) => document.querySelector(s);

  function setMsg(kind, text){
    const m = $("#msg");
    m.className = "message" + (kind ? " " + kind : "");
    m.textContent = text || "";
  }

  function setCooldownUI(untilTs){
    const el = $("#cooldownMsg");
    if(!untilTs || untilTs <= Date.now()){
      el.style.display = "none";
      el.textContent = "";
      return;
    }
    const left = Math.max(0, untilTs - Date.now());
    const sec = Math.ceil(left / 1000);
    el.style.display = "block";
    el.textContent = `För många försök. Vänta ${sec} sek.`;
  }

  function readCooldown(){
    try{
      const raw = localStorage.getItem(COOLDOWN_KEY);
      if(!raw) return { fails: 0, until: 0 };
      const v = JSON.parse(raw);
      return {
        fails: Number(v?.fails || 0),
        until: Number(v?.until || 0)
      };
    }catch{
      return { fails: 0, until: 0 };
    }
  }

  function writeCooldown(obj){
    localStorage.setItem(COOLDOWN_KEY, JSON.stringify(obj));
  }

  function resetCooldown(){
    writeCooldown({ fails: 0, until: 0 });
    setCooldownUI(0);
  }

  // ---- Auth demo (v1 utan backend) ----
  // OBS: Dessa credentials är demo. Byt när du vill, men håll rollerna låsta (admin/employee).
  function checkCredentials(name, empNo, password){
    const n = String(name||"").trim().toLowerCase();
    const e = String(empNo||"").trim();
    const p = String(password||"").trim();

    // Admin: lösenord "admin" (enkelt demo)
    if(p === "admin"){
      return { role: "admin", displayName: name || "Admin", empNo: e || "—" };
    }

    // Employee: lösenord "employee" (enkelt demo)
    if(p === "employee"){
      return { role: "employee", displayName: name || "Medarbetare", empNo: e || "—" };
    }

    return null;
  }

  function routeByRole(role){
    // PIN hook (inte implementerat)
    const pinRequired = false;
    // TODO (AO-001): Om pinRequired==true, routa till pin-vy (inte i v1)

    if(role === "admin") return "../admin/home.html";
    return "../employee/home.html";
  }

  // ---- Session write: primär + fallback ----
  function writeSession(auth){
    const payload = {
      auth: {
        isAuthed: true,
        role: auth.role,
        displayName: auth.displayName || "",
        empNo: auth.empNo || "",
        issuedAt: Date.now(),
        expiresAt: Date.now() + (8 * 60 * 60 * 1000) // 8h
      }
    };

    const raw = JSON.stringify(payload);

    // Primär
    sessionStorage.setItem(SESSION_KEY, raw);

    // Fallback: vissa sidor/buggar kan råka läsa localStorage
    localStorage.setItem(SESSION_KEY, raw);
  }

  function applyUrlParams(){
    // Stöd för URL-parametrar (enkel)
    const u = new URL(window.location.href);
    const name = u.searchParams.get("name");
    const empNo = u.searchParams.get("empNo");
    const password = u.searchParams.get("password");

    if(name !== null) $("#name").value = name;
    if(empNo !== null) $("#empNo").value = empNo;
    if(password !== null) $("#password").value = password;
  }

  // ---- init ----
  applyUrlParams();

  // cooldown ticker
  setInterval(() => {
    const cd = readCooldown();
    setCooldownUI(cd.until);
  }, 300);

  $("#btnClear").addEventListener("click", () => {
    $("#name").value = "";
    $("#empNo").value = "";
    $("#password").value = "";
    setMsg("", "");
  });

  $("#loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    setMsg("", "");

    const cd = readCooldown();
    if(cd.until && cd.until > Date.now()){
      setMsg("err", "För många försök. Vänta en stund och försök igen.");
      setCooldownUI(cd.until);
      return;
    }

    const name = $("#name").value;
    const empNo = $("#empNo").value;
    const password = $("#password").value;

    const auth = checkCredentials(name, empNo, password);
    if(!auth){
      // generiskt fel (läcker inte)
      const nextFails = (cd.fails || 0) + 1;
      if(nextFails >= MAX_FAILS){
        const until = Date.now() + COOLDOWN_MS;
        writeCooldown({ fails: nextFails, until });
        setMsg("err", "Fel inloggning. För många försök.");
        setCooldownUI(until);
      }else{
        writeCooldown({ fails: nextFails, until: 0 });
        setMsg("err", "Fel inloggning.");
      }
      return;
    }

    // success
    resetCooldown();
    writeSession(auth);
    const target = routeByRole(auth.role);
    window.location.replace(target);
  });

})();
</script>

</body>
</html>
