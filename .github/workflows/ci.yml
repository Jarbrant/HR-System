name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Validate worker JavaScript syntax
        run: node --check worker/index.js
      
      - name: Validate JSON files in ai-rules directory
        run: |
          echo "Validating JSON files in ai-rules directory..."
          find ai-rules -name "*.json" -type f | while read -r file; do
            # Skip empty or nearly empty files (< 3 bytes)
            if [ $(wc -c < "$file") -lt 3 ]; then
              echo "Skipping empty file: $file"
              continue
            fi
            echo "Checking $file"
            node -e "JSON.parse(require('fs').readFileSync('$file', 'utf8'))"
          done
          echo "All non-empty JSON files are valid!"
