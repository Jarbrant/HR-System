name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate worker/index.js syntax
        run: node --check worker/index.js

      - name: Validate JSON files in ai-rules/
        run: |
          echo "Validating JSON files..."
          errors=0
          for f in $(find ai-rules -name '*.json' -type f); do
            if [ ! -s "$f" ]; then
              echo "SKIP (empty): $f"
              continue
            fi
            if ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "FAIL: $f"
              errors=$((errors + 1))
            else
              echo "OK: $f"
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "$errors JSON file(s) failed validation"
            exit 1
          fi
          echo "All JSON files valid!"
