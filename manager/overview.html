<!-- ============================================================
AO-XXX | FIL-ID: manager/overview.html
Projekt: HR-System
Syfte: Manager – Overview (stam) – UI-only v1
Policy (LÅST):
- Ingen backend
- Fail-closed (requireAuth)
- Inga nya storage-keys/datamodell
- Ingen känslig persondata (endast empNo, men vi renderar inte empNo)
- XSS-escape på rendering från storage (via HRApp.escapeHtml)
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Manager</title>
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />
</head>

<body>
  <main class="page">
    <header class="page-header">
      <h1>Manager – Översikt</h1>
      <div class="page-actions">
        <button id="btnLogout" class="btn" type="button">Logga ut</button>
      </div>
    </header>

    <section class="grid">
      <div class="card">
        <h2>Åtkomst</h2>
        <p id="accessInfo">Laddar…</p>
      </div>

      <div class="card">
        <h2>Snabbstatus</h2>
        <p>Här kommer senare: avvikelser, team-load och prioriteringar (scope-styrt).</p>
      </div>

      <div class="card">
        <h2>Notis</h2>
        <p>Det här är en stabil stam-sida. Inga genvägar, ingen stress.</p>
      </div>
    </section>
  </main>

  <!-- Viktigt: config före core -->
  <script src="../UI/UI-04-CONFIG.js"></script>
  <script src="../UI/UI-03-APP.js"></script>

  <script>
    (function () {
      "use strict";

      function byId(id) { return document.getElementById(id); }

      // Fail-closed: kräver Manager-roll
      var session = (window.HRApp && window.HRApp.requireAuth)
        ? window.HRApp.requireAuth({ allowRoles: [window.HR_CONFIG && window.HR_CONFIG.ROLES ? window.HR_CONFIG.ROLES.MANAGER : "MANAGER"] })
        : null;

      var infoEl = byId("accessInfo");
      var btn = byId("btnLogout");

      if (!session || !window.HRApp) {
        if (infoEl) infoEl.textContent = "Saknar session eller core. Logga in igen.";
        return;
      }

      var auth = window.HRApp.getAuth(session);
      if (!auth || !auth.isAuthed) {
        if (infoEl) infoEl.textContent = "Ej autentiserad. Logga in igen.";
        return;
      }

      var safe = window.HRApp.escapeHtml;
      var role = safe(auth.role || "");
      var scope = safe(auth.scopeId || "");

      // Rendera INTE empNo (minimering)
      if (infoEl) {
        infoEl.innerHTML = "Roll: <b>" + role + "</b><br>Scope: <b>" + (scope || "saknas") + "</b>";
      }

      if (btn) {
        btn.addEventListener("click", function () {
          window.HRApp.logout();
        });
      }
    })();
  </script>
</body>
</html>
