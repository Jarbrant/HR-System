<!-- ============================================================
AO-015 | FIL-ID: employee/questions.html
Projekt: HR-System
Syfte: Medarbetare – Frågor & Svar (ta emot + svara) – UI-only v1
Mål:
- Visa frågor tilldelade medarbetaren
- Medarbetaren kan svara + markera "Svarat"
- Ingen skapa-funktion för employee
Policy:
- Ingen backend
- Ingen känslig data lagras
- Guard + logout (employee)
Lagring:
- AO-015_QA_V1 (localStorage) – UI-only frågor/svar (demo)
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Medarbetare • Frågor</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .layout{
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 12px;
      align-items:start;
    }
    @media (max-width: 980px){
      .layout{ grid-template-columns: 1fr; }
    }
    .item{
      border:1px solid var(--line);
      border-radius: var(--r14);
      padding: 12px;
      background:#fff;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
      cursor:pointer;
    }
    .item:hover{
      transform: var(--lift);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.02);
    }
    .item.active{
      outline: 3px solid rgba(17,17,17,0.10);
      outline-offset: 2px;
    }
    .item-title{ font-weight: 900; margin:0; }
    .item-meta{ margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:.9rem; }
    .empty{
      padding:18px;
      border:1px dashed var(--line);
      border-radius: var(--r14);
      color: var(--muted);
      background:#fff;
      text-align:center;
    }
  </style>
</head>

<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Medarbetare • Frågor</span>
  </div>

  <nav class="nav" aria-label="Meny">
    <a href="./home.html">Hem</a>
    <a href="./tasks.html">Uppgifter</a>
    <a href="./questions.html" aria-current="page">Frågor</a>
    <a href="./schedule.html">Schema</a>
    <a href="./docs.html">Dokument</a>
    <a href="./report.html">Rapportera fel</a>
  </nav>

  <div class="row-actions" style="margin-left:auto;">
    <button id="btnLogout" class="secondary" type="button">Logga ut</button>
  </div>
</header>

<main class="container">
  <h1 class="tight">Frågor & svar</h1>
  <p class="muted">Svar skickas (i framtiden) till Enhetschef + Admin. I v1 sparas svar lokalt.</p>

  <section class="card">
    <div class="layout">

      <!-- Lista -->
      <section class="panel" aria-label="Lista">
        <div class="row space-between wrap">
          <div class="panel-title">Tilldelade frågor <span class="tag">v1</span></div>
          <div class="row wrap">
            <label style="margin:0; font-weight:700;">
              Filter
              <select id="filter" style="margin-top:6px; width:auto;">
                <option value="all">Alla</option>
                <option value="needs">Svar krävs</option>
                <option value="answered">Svarat</option>
              </select>
            </label>
          </div>
        </div>

        <div id="list"></div>
        <p class="muted small" style="margin-top:10px;">
          Tips: Klicka på en fråga för att svara.
        </p>
      </section>

      <!-- Detalj -->
      <section class="panel" aria-label="Detaljer">
        <div class="panel-title">Detaljer</div>

        <div id="detailEmpty" class="empty">Välj en fråga i listan.</div>

        <div id="detail" style="display:none;">
          <h2 id="dTitle" class="tight" style="margin-top:0;">—</h2>
          <p id="dQuestion" class="muted">—</p>

          <div class="row wrap" style="margin: 8px 0 10px;">
            <span class="pill" id="dStatus">—</span>
            <span class="pill" id="dFrom">Från: —</span>
          </div>

          <label>
            Ditt svar
            <textarea id="inpAnswer" placeholder="Skriv ditt svar…"></textarea>
          </label>

          <div class="row-actions" style="margin-top:10px;">
            <button id="btnSave" type="button">Spara svar</button>
            <button id="btnMarkNeeds" class="secondary" type="button">Markera “Svar krävs”</button>
          </div>

          <p id="msg" class="message" aria-live="polite"></p>
        </div>
      </section>

    </div>
  </section>
</main>

<script>
/* ============================================================
AO-015 | FIL-ID: employee/questions.html (inline JS)
Syfte: Guard + receive questions + answer (UI-only)
============================================================ */
(function(){
  "use strict";

  const SESSION_KEY = "AO-001_LOGIN_V1";
  const QA_KEY      = "AO-015_QA_V1";

  const $ = (s) => document.querySelector(s);

  function redirectLogin(){
    window.location.replace("../UI/UI-01-SKELETON.html");
  }

  function readAuth(){
    try{
      const raw = sessionStorage.getItem(SESSION_KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data?.auth?.isAuthed) return null;
      if(data.auth.role !== "employee") return null;
      if(!data.auth.expiresAt || data.auth.expiresAt < Date.now()) return null;
      return data.auth;
    }catch{ return null; }
  }

  const auth = readAuth();
  if(!auth){ redirectLogin(); return; }

  $("#btnLogout").addEventListener("click", () => {
    sessionStorage.removeItem(SESSION_KEY);
    redirectLogin();
  });

  function uid(){
    return "q_" + Math.random().toString(36).slice(2,10) + "_" + Date.now().toString(36);
  }

  function loadQA(){
    try{
      const arr = JSON.parse(localStorage.getItem(QA_KEY) || "[]");
      return Array.isArray(arr) ? arr : [];
    }catch{
      return [];
    }
  }

  function saveQA(arr){
    localStorage.setItem(QA_KEY, JSON.stringify(arr));
  }

  function seedIfEmpty(arr){
    if(arr.length) return arr;

    const empNo = auth.empNo || "1234";
    const seeded = [
      {
        id: uid(),
        empNo,
        title: "Hur gick första veckan?",
        question: "Svara kort: Vad har fungerat bra? Vad behöver du hjälp med?",
        fromRole: "manager",
        status: "needs",   // needs|answered
        answer: "",
        createdAt: Date.now()
      },
      {
        id: uid(),
        empNo,
        title: "Har du rätt verktyg?",
        question: "Har du fått inlogg, nycklar, uniform och rätt instruktioner?",
        fromRole: "admin",
        status: "needs",
        answer: "",
        createdAt: Date.now()
      }
    ];

    saveQA(seeded);
    return seeded;
  }

  function statusLabel(s){
    return s === "answered" ? "Svarat" : "Svar krävs";
  }

  let qa = seedIfEmpty(loadQA());
  let selectedId = null;

  function myQuestions(){
    const empNo = auth.empNo || "";
    return qa.filter(x => (x.empNo || "") === empNo);
  }

  function renderList(){
    const listEl = $("#list");
    const filter = $("#filter").value;

    const arr = myQuestions().slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    const shown = filter === "all"
      ? arr
      : arr.filter(x => (filter === "needs" ? x.status !== "answered" : x.status === "answered"));

    listEl.innerHTML = "";

    if(!shown.length){
      listEl.innerHTML = `<div class="empty">Inga frågor för valt filter.</div>`;
      return;
    }

    shown.forEach(q => {
      const el = document.createElement("div");
      el.className = "item" + (q.id === selectedId ? " active" : "");
      el.innerHTML = `
        <p class="item-title">${q.title}</p>
        <div class="item-meta">
          <span class="pill">${statusLabel(q.status)}</span>
          <span class="pill">Från: ${q.fromRole || "—"}</span>
        </div>
      `;

      el.addEventListener("click", () => {
        selectedId = q.id;
        renderList();
        openDetail(q.id);
      });

      listEl.appendChild(el);
    });
  }

  function setMsg(kind, text){
    const m = $("#msg");
    m.className = "message" + (kind ? " " + kind : "");
    m.textContent = text || "";
  }

  function openDetail(id){
    const q = qa.find(x => x.id === id) || null;
    if(!q){
      $("#detail").style.display = "none";
      $("#detailEmpty").style.display = "block";
      return;
    }

    $("#detailEmpty").style.display = "none";
    $("#detail").style.display = "block";

    $("#dTitle").textContent = q.title || "—";
    $("#dQuestion").textContent = q.question || "—";
    $("#dStatus").textContent = statusLabel(q.status);
    $("#dFrom").textContent = "Från: " + (q.fromRole || "—");

    $("#inpAnswer").value = q.answer || "";
    setMsg("", "");
  }

  function saveAnswer(){
    if(!selectedId){
      setMsg("err", "Välj en fråga först.");
      return;
    }
    const q = qa.find(x => x.id === selectedId);
    if(!q){
      setMsg("err", "Frågan hittades inte.");
      return;
    }

    const ans = String($("#inpAnswer").value || "").trim();
    if(!ans){
      setMsg("err", "Skriv ett svar innan du sparar.");
      return;
    }

    q.answer = ans;
    q.status = "answered";
    q.answeredAt = Date.now();

    saveQA(qa);
    setMsg("ok", "Sparat. (I v1 sparas lokalt.)");
    renderList();
    openDetail(selectedId);
  }

  function markNeeds(){
    if(!selectedId){
      setMsg("err", "Välj en fråga först.");
      return;
    }
    const q = qa.find(x => x.id === selectedId);
    if(!q){
      setMsg("err", "Frågan hittades inte.");
      return;
    }

    q.status = "needs";
    saveQA(qa);
    setMsg("warn", "Markerad som “Svar krävs”.");
    renderList();
    openDetail(selectedId);
  }

  $("#filter").addEventListener("change", renderList);
  $("#btnSave").addEventListener("click", saveAnswer);
  $("#btnMarkNeeds").addEventListener("click", markNeeds);

  renderList();

})();
</script>

</body>
</html>
