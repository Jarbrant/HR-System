<!-- ============================================================
AO-052 | FIL-ID: employee/questions.html
Projekt: HR-System
Syfte: Employee – Frågor (tilldelade) + svara – UI-only v1 (nivå 3)
Krav:
- Employee kan bara se tilldelade frågor och svara
- Admin skapar frågor (på admin/questions.html)
- Anonymt svar: endast om admin markerat allowAnonymous=true på frågan
- Svaren ska INTE blandas med frågor i admin: visas på admin/answers.html
Policy:
- Ingen backend
- Ingen känslig data lagras
- Robust guard: sessionStorage först, fallback localStorage
Lagring:
- AO-001_LOGIN_V1 (sessionStorage/localStorage) – session
- AO-015_QUESTIONS_V1 (localStorage) – frågor (tilldelning + allowAnonymous)
- AO-016_ANSWERS_V1 (localStorage) – svar (append-only)
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Medarbetare • Frågor</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .panel{
      border: 1px solid var(--line);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .panel:hover{
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.01);
    }
    .panel.list{ background: rgba(191,219,254,.18); }

    .item{
      border:1px solid var(--line);
      border-radius: var(--r14);
      padding: 12px;
      background:#fff;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:flex-start;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .item:hover{
      transform: var(--lift);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.02);
    }

    .item-title{ font-weight: 950; margin:0; }
    .meta{ color: var(--muted); font-size:.9rem; display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
    .empty{
      padding:18px;
      border:1px dashed var(--line);
      border-radius: var(--r14);
      color: var(--muted);
      background:#fff;
      text-align:center;
      margin-top:10px;
    }

    .row2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 760px){
      .row2{ grid-template-columns: 1fr; }
    }

    textarea{ min-height: 92px; }
    .smallnote{ font-size:.9rem; color: var(--muted); margin-top:8px; }
    code{ font-size:.95em; }
  </style>
</head>

<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Medarbetare • Frågor</span>
  </div>

  <nav class="nav" aria-label="Meny">
    <a href="./home.html">Hem</a>
    <a href="./tasks.html">Uppgifter</a>
    <a href="./questions.html" aria-current="page">Frågor</a>
    <a href="./schedule.html">Schema</a>
    <a href="./docs.html">Dokument</a>
    <a href="./report.html">Rapportera fel</a>
    <a href="#" id="navLogout" style="margin-left:auto;">Logga ut</a>
  </nav>
</header>

<main class="container">
  <h1 class="tight">Frågor</h1>
  <p class="muted">Här svarar du på frågor från admin/chef. Skapande sker inte här.</p>

  <section class="card panel list" aria-label="Frågor och svar">
    <div class="row space-between wrap" style="margin-bottom:10px;">
      <div class="muted">
        Inloggad: <strong id="whoName">—</strong> • Anst.nr <span id="whoEmpNo">—</span> • Roll <span>employee</span>
      </div>
      <div class="row wrap">
        <button id="btnRefresh" type="button" class="secondary">Uppdatera</button>
      </div>
    </div>

    <div class="row2" aria-label="Filter">
      <label>
        Visa
        <select id="filter">
          <option value="open" selected>Obesvarade</option>
          <option value="answered">Besvarade</option>
          <option value="all">Alla</option>
        </select>
      </label>

      <label>
        Sök (text)
        <input id="search" type="text" placeholder="t.ex. introduktion" />
      </label>
    </div>

    <div id="list"></div>

    <div class="smallnote">
      Svar sparas till <code>AO-016_ANSWERS_V1</code> och visas för admin på <code>admin/answers.html</code>.
    </div>
  </section>
</main>

<script>
/* ============================================================
AO-052 | FIL-ID: employee/questions.html (inline JS)
============================================================ */
(function(){
  "use strict";

  const SESSION_KEY   = "AO-001_LOGIN_V1";
  const QUESTIONS_KEY = "AO-015_QUESTIONS_V1";
  const ANSWERS_KEY   = "AO-016_ANSWERS_V1";

  const $ = (s) => document.querySelector(s);

  function redirectLogin(){ window.location.replace("../UI/UI-01-SKELETON.html"); }

  function readRawSession(){
    const s1 = sessionStorage.getItem(SESSION_KEY);
    if (s1) return s1;
    const s2 = localStorage.getItem(SESSION_KEY);
    if (s2) return s2;
    return null;
  }

  function readAuth(){
    try{
      const raw = readRawSession();
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data?.auth?.isAuthed) return null;
      if(data.auth.role !== "employee") return null;
      if (data.auth.expiresAt && data.auth.expiresAt < Date.now()) return null;
      return data.auth;
    }catch{
      return null;
    }
  }

  function safeParse(key, fallback){
    try{
      const v = JSON.parse(localStorage.getItem(key) || "null");
      return (v === null || v === undefined) ? fallback : v;
    }catch{ return fallback; }
  }
  function save(key, value){ localStorage.setItem(key, JSON.stringify(value)); }

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmtTime(ts){
    const t = Number(ts);
    if(!Number.isFinite(t)) return "—";
    const d = new Date(t);
    if(String(d) === "Invalid Date") return "—";
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return `${y}-${m}-${day} ${hh}:${mm}`;
  }

  function normalizeEmpNo(v){
    const s = String(v || "").trim();
    const digits = s.replace(/[^\d]/g, "");
    return digits;
  }

  function genId(prefix){
    return (prefix || "id") + "_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
  }

  // --- Guard ---
  const auth = readAuth();
  if(!auth){ redirectLogin(); return; }

  $("#whoName").textContent = auth.displayName || "—";
  $("#whoEmpNo").textContent = auth.empNo || "—";

  function doLogout(){
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SESSION_KEY);
    redirectLogin();
  }
  $("#navLogout").addEventListener("click", (e) => { e.preventDefault(); doLogout(); });

  // --- Data ---
  function loadQuestions(){
    const arr = safeParse(QUESTIONS_KEY, []);
    return Array.isArray(arr) ? arr : [];
  }
  function loadAnswers(){
    const arr = safeParse(ANSWERS_KEY, []);
    return Array.isArray(arr) ? arr : [];
  }

  function isTargetedToMe(q){
    // Förväntad question-struktur (admin skapar):
    // q.targets = { mode:"one"|"all"|"group", empNo?: "1234", groupId?: "...", empNos?:[] }
    // För UI-only håller vi enkel: mode all => alla, mode one => match empNo, annars empNos-lista.
    const my = normalizeEmpNo(auth.empNo);
    const t = q?.targets || null;
    if(!t) return false;

    if(t.mode === "all") return true;

    if(t.mode === "one"){
      return normalizeEmpNo(t.empNo) === my;
    }

    if(t.mode === "list" && Array.isArray(t.empNos)){
      return t.empNos.map(normalizeEmpNo).includes(my);
    }

    // legacy: q.empNo direkt
    if(q.empNo){
      return normalizeEmpNo(q.empNo) === my;
    }

    return false;
  }

  function hasAnswered(questionId){
    const my = normalizeEmpNo(auth.empNo);
    return loadAnswers().some(a => String(a.questionId) === String(questionId) && (a.empNo ? normalizeEmpNo(a.empNo) === my : false));
  }

  function render(){
    const list = $("#list");
    list.innerHTML = "";

    const filter = $("#filter").value;
    const q = String($("#search").value || "").trim().toLowerCase();

    const questions = loadQuestions()
      .filter(isTargetedToMe)
      .slice()
      .sort((a,b) => (b.createdAt||0) - (a.createdAt||0));

    const rows = questions.map(x => {
      const answered = hasAnswered(x.id);
      return { q: x, answered };
    });

    let shown = rows;
    if(filter === "open") shown = shown.filter(r => !r.answered);
    if(filter === "answered") shown = shown.filter(r => r.answered);

    if(q){
      shown = shown.filter(r => {
        const blob = `${r.q.title||""} ${r.q.prompt||""}`.toLowerCase();
        return blob.includes(q);
      });
    }

    if(shown.length === 0){
      list.innerHTML = `<div class="empty">Inga frågor matchar filtret.</div>`;
      return;
    }

    shown.forEach(r => {
      const x = r.q;
      const allowAnon = (x.allowAnonymous === true);
      const answered = r.answered;

      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `
        <div style="min-width:260px; flex: 1 1 520px;">
          <p class="item-title">${escapeHtml(x.title || "Fråga")}</p>
          <div class="meta">
            <span class="pill">${answered ? "Besvarad" : "Obesvarad"}</span>
            ${allowAnon ? `<span class="pill">Anonymt tillåtet</span>` : ``}
            <span><strong>Skapad:</strong> ${escapeHtml(fmtTime(x.createdAt))}</span>
          </div>
          <div class="meta"><span><strong>Fråga:</strong> ${escapeHtml(x.prompt || "—")}</span></div>

          ${answered
            ? `<div class="meta"><span>Du har redan svarat. (Se admin/answers.html)</span></div>`
            : `
              <div style="margin-top:10px;">
                <label style="margin-top:0;">
                  Svar
                  <textarea data-a="answer" placeholder="Skriv ditt svar..."></textarea>
                </label>

                <div class="row space-between wrap" style="margin-top:8px;">
                  <label style="margin:0; display:flex; gap:10px; align-items:center;">
                    <input data-a="anon" type="checkbox" ${allowAnon ? "" : "disabled"} />
                    Svara anonymt
                  </label>

                  <div class="row wrap" style="gap:8px;">
                    <button type="button" class="secondary" data-a="clear">Rensa</button>
                    <button type="button" data-a="send">Skicka svar</button>
                  </div>
                </div>

                ${allowAnon ? `<div class="smallnote">Om du svarar anonymt sparas inte ditt anst.nr i svaret.</div>`
                            : `<div class="smallnote">Anonyma svar är inte tillåtna för denna fråga.</div>`}
              </div>
            `
          }
        </div>
      `;

      list.appendChild(el);

      if(!answered){
        const txt = el.querySelector("textarea[data-a='answer']");
        const cb  = el.querySelector("input[data-a='anon']");
        const btnSend = el.querySelector("button[data-a='send']");
        const btnClear= el.querySelector("button[data-a='clear']");

        btnClear.addEventListener("click", () => { txt.value = ""; if(cb && !cb.disabled) cb.checked = false; });

        btnSend.addEventListener("click", () => {
          const answer = String(txt.value || "").trim();
          if(!answer){
            alert("Skriv ett svar först.");
            return;
          }

          const wantsAnon = !!(cb && cb.checked);
          if(wantsAnon && !allowAnon){
            alert("Anonyma svar är inte tillåtna för denna fråga.");
            return;
          }

          const now = Date.now();
          const all = loadAnswers();

          // append-only svar
          all.push({
            id: genId("a"),
            questionId: String(x.id),
            // om anonymt: spara inte empNo alls
            empNo: wantsAnon ? "" : normalizeEmpNo(auth.empNo),
            anonymous: wantsAnon,
            answer,
            createdAt: now
          });

          save(ANSWERS_KEY, all);

          // markera UI som besvarad (re-render)
          render();
        });
      }
    });
  }

  $("#filter").addEventListener("change", render);
  $("#search").addEventListener("input", render);
  $("#btnRefresh").addEventListener("click", render);

  render();

})();
</script>

</body>
</html>
