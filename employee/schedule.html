<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Medarbetare • Schema</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .panel{
      border: 1px solid var(--line);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .panel:hover{
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.01);
    }
    .panel.schedule{ background: rgba(191,219,254,.18); }

    .shift{
      border:1px solid var(--line);
      border-radius: var(--r14);
      padding: 12px;
      background:#fff;
      display:flex;
      gap: 12px;
      justify-content:space-between;
      align-items:flex-start;
      flex-wrap:wrap;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .shift:hover{
      transform: var(--lift);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.02);
    }
    .when{
      font-weight: 950;
      margin: 0;
    }
    .meta{
      color: var(--muted);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 6px;
      font-size: .9rem;
    }
    .empty{
      padding:18px;
      border:1px dashed var(--line);
      border-radius: var(--r14);
      color: var(--muted);
      background:#fff;
      text-align:center;
    }
  </style>
</head>

<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Medarbetare • Schema</span>
  </div>

  <nav class="nav" aria-label="Meny">
    <a href="./home.html">Hem</a>
    <a href="./tasks.html">Uppgifter</a>
    <a href="./questions.html">Frågor</a>
    <a href="./schedule.html" aria-current="page">Schema</a>
    <a href="./docs.html">Dokument</a>
    <a href="./report.html">Rapportera fel</a>
    <a href="./profile.html">Min sida</a>
    <a href="#" id="navLogout" style="margin-left:auto;">Logga ut</a>
  </nav>
</header>

<main class="container">
  <h1 class="tight">Schema</h1>
  <p class="muted">Read-only v1. Senare kan detta fyllas via Integrationer (t.ex. Personalkollen).</p>

  <section class="card">
    <div class="row space-between wrap" style="margin-bottom:10px;">
      <div class="muted">
        Inloggad: <strong id="whoName">—</strong> • Anst.nr <span id="whoEmpNo">—</span>
      </div>

      <div class="row wrap">
        <button id="btnReload" class="secondary" type="button">Uppdatera</button>
      </div>
    </div>

    <section class="panel schedule">
      <div class="panel-title">Kommande pass</div>
      <div id="list" style="display:grid; gap:10px;"></div>
      <div class="muted small" style="margin-top:8px;">
        Källa v1: localStorage (<code>AO-016_SCHEDULE_V1</code>) eller demo.
      </div>
    </section>
  </section>
</main>

<script>
/* ============================================================
AO-043 | FIL-ID: employee/schedule.html (inline JS)
============================================================ */
(function(){
  "use strict";

  const SESSION_KEY  = "AO-001_LOGIN_V1";
  const SCHEDULE_KEY = "AO-016_SCHEDULE_V1";

  const $ = (s) => document.querySelector(s);

  function redirectLogin(){ window.location.replace("../UI/UI-01-SKELETON.html"); }

  function readRawSession(){
    const s1 = sessionStorage.getItem(SESSION_KEY);
    if (s1) return s1;
    const s2 = localStorage.getItem(SESSION_KEY);
    if (s2) return s2;
    return null;
  }

  function readAuth(){
    try{
      const raw = readRawSession();
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data?.auth?.isAuthed) return null;
      if(data.auth.role !== "employee") return null;
      if (data.auth.expiresAt && data.auth.expiresAt < Date.now()) return null;
      return data.auth;
    }catch{
      return null;
    }
  }

  function safeParse(key, fallback){
    try{
      const v = JSON.parse(localStorage.getItem(key) || "null");
      return (v === null || v === undefined) ? fallback : v;
    }catch{
      return fallback;
    }
  }

  function escapeHtml(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmt(ts){
    try{
      const d = new Date(ts);
      if(Number.isNaN(d.getTime())) return "—";
      return d.toLocaleString("sv-SE", { weekday:"short", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
    }catch{
      return "—";
    }
  }

  function demo(empNo){
    const base = Date.now();
    const day = 24*60*60*1000;
    return [
      { id:"s1", empNo, start: base + day*1 + 7*60*60*1000, end: base + day*1 + 15*60*60*1000, location:"Butik", note:"Demo-pass" },
      { id:"s2", empNo, start: base + day*3 + 12*60*60*1000, end: base + day*3 + 20*60*60*1000, location:"Butik", note:"Demo-pass" },
      { id:"s3", empNo, start: base + day*5 + 6*60*60*1000, end: base + day*5 + 14*60*60*1000, location:"Butik", note:"Demo-pass" },
    ];
  }

  const auth = readAuth();
  if(!auth){ redirectLogin(); return; }

  $("#whoName").textContent = auth.displayName || "—";
  $("#whoEmpNo").textContent = auth.empNo || "—";

  function doLogout(){
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SESSION_KEY);
    redirectLogin();
  }
  $("#navLogout").addEventListener("click", (e) => { e.preventDefault(); doLogout(); });

  function loadMyShifts(){
    const all = safeParse(SCHEDULE_KEY, []);
    const empNo = String(auth.empNo || "").trim();

    const arr = Array.isArray(all) ? all.filter(s => String(s.empNo||"").trim() === empNo) : [];
    if(arr.length) return arr;

    return demo(empNo);
  }

  function render(){
    const list = $("#list");
    list.innerHTML = "";

    const shifts = loadMyShifts()
      .slice()
      .sort((a,b) => (a.start||0) - (b.start||0))
      .slice(0, 12);

    if(!shifts.length){
      list.innerHTML = `<div class="empty">Inga pass ännu.</div>`;
      return;
    }

    shifts.forEach(s => {
      const el = document.createElement("div");
      el.className = "shift";
      el.innerHTML = `
        <div>
          <p class="when">${escapeHtml(fmt(s.start))} – ${escapeHtml(fmt(s.end))}</p>
          <div class="meta">
            <span><strong>Plats:</strong> ${escapeHtml(s.location || "—")}</span>
            <span><strong>Notis:</strong> ${escapeHtml(s.note || "—")}</span>
          </div>
        </div>
        <div>
          <span class="pill">Read-only</span>
        </div>
      `;
      list.appendChild(el);
    });
  }

  $("#btnReload").addEventListener("click", render);
  render();

})();
</script>

</body>
</html>
