- Visa kommande pass (demo) + enkel vy för vecka
- Ingen redigering i v1
Policy:

- Guard + logout (employee)

<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Medarbetare • Schema</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .layout{
      display:grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 12px;
      align-items:start;
    }
    @media (max-width: 980px){
      .layout{ grid-template-columns: 1fr; }
    }
    .shift{
      border:1px solid var(--line);
      border-radius: var(--r14);
      padding: 12px;
      background:#fff;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .shift:hover{
      transform: var(--lift);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.02);
    }
    .shift-title{ font-weight: 900; margin:0; }
    .shift-meta{ margin-top:6px; display:flex; gap:10px; flex-wrap:wrap; color:var(--muted); font-size:.9rem; }
    .cal{
      display:grid;
      grid-template-columns: repeat(7, minmax(0,1fr));
      gap: 8px;
      margin-top: 10px;
    }
    @media (max-width: 980px){
      .cal{ grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
    .day{
      border:1px solid var(--line);
      border-radius: var(--r14);
      padding: 10px;
      background:#fff;
      min-height: 92px;
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }
    .day:hover{
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
      filter: brightness(1.01);
    }
    .day h3{ margin:0 0 6px; font-size: .95rem; }
    .slot{
      font-size: .88rem;
      color: var(--muted);
      padding: 6px 8px;
      border-radius: 10px;
      background: rgba(0,0,0,0.03);
      margin-top: 6px;
    }
    .empty{
      padding:18px;
      border:1px dashed var(--line);
      border-radius: var(--r14);
      color: var(--muted);
      background:#fff;
      text-align:center;
    }
  </style>
</head>

<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Medarbetare • Schema</span>
  </div>

  <nav class="nav" aria-label="Meny">
    <a href="./home.html">Hem</a>
    <a href="./tasks.html">Uppgifter</a>
    <a href="./questions.html">Frågor</a>
    <a href="./schedule.html" aria-current="page">Schema</a>
    <a href="./docs.html">Dokument</a>
    <a href="./report.html">Rapportera fel</a>
  </nav>

  <div class="row-actions" style="margin-left:auto;">
    <button id="btnLogout" class="secondary" type="button">Logga ut</button>
  </div>
</header>

<main class="container">
  <h1 class="tight">Schema</h1>
  <p class="muted">Read-only i v1. (Senare: byten, passbekräftelse, frånvaro.)</p>

  <section class="card">
    <div class="layout">
      <section class="panel" aria-label="Kommande pass">
        <div class="panel-title">Kommande pass <span class="tag">demo</span></div>
        <div id="upcoming"></div>
      </section>

      <section class="panel" aria-label="Veckovy">
        <div class="row space-between wrap">
          <div class="panel-title">Vecka <span id="weekNo" class="tag">—</span></div>
          <button id="btnReset" class="secondary" type="button">Återställ demo</button>
        </div>
        <div id="week" class="cal"></div>
        <p class="muted small" style="margin-top:10px;">
          v1: endast visning. Planering kommer senare.
        </p>
      </section>
    </div>
  </section>
</main>

<script>
/* ============================================================
AO-016 | FIL-ID: employee/schedule.html (inline JS)
Syfte: Guard + read-only schedule demo
============================================================ */
(function(){
  "use strict";

  const SESSION_KEY  = "AO-001_LOGIN_V1";
  const SCHEDULE_KEY = "AO-016_SCHEDULE_V1";

  const $ = (s) => document.querySelector(s);

  function redirectLogin(){
    window.location.replace("../UI/UI-01-SKELETON.html");
  }

  function readAuth(){
    try{
      const raw = sessionStorage.getItem(SESSION_KEY);
      if(!raw) return null;
      const data = JSON.parse(raw);
      if(!data?.auth?.isAuthed) return null;
      if(data.auth.role !== "employee") return null;
      if(!data.auth.expiresAt || data.auth.expiresAt < Date.now()) return null;
      return data.auth;
    }catch{ return null; }
  }

  const auth = readAuth();
  if(!auth){ redirectLogin(); return; }

  $("#btnLogout").addEventListener("click", () => {
    sessionStorage.removeItem(SESSION_KEY);
    redirectLogin();
  });

  function load(){
    try{
      const obj = JSON.parse(localStorage.getItem(SCHEDULE_KEY) || "null");
      return obj && typeof obj === "object" ? obj : null;
    }catch{ return null; }
  }

  function save(obj){
    localStorage.setItem(SCHEDULE_KEY, JSON.stringify(obj));
  }

  function isoDate(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const da = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${da}`;
  }

  function mondayOfThisWeek(now){
    const d = new Date(now);
    const day = d.getDay(); // 0 Sun .. 6 Sat
    const diff = (day === 0 ? -6 : 1) - day; // move to Monday
    d.setDate(d.getDate() + diff);
    d.setHours(0,0,0,0);
    return d;
  }

  function weekNumber(d){
    // ISO week number
    const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dayNum = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
    const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
    return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  }

  function seed(){
    const empNo = auth.empNo || "1234";
    const start = mondayOfThisWeek(Date.now());
    const days = ["Mån","Tis","Ons","Tor","Fre","Lör","Sön"];

    const slots = [
      { day:0, time:"07:00–15:00", role:"Pass", place:"Butik" },
      { day:1, time:"09:00–17:00", role:"Pass", place:"Butik" },
      { day:3, time:"12:00–20:00", role:"Pass", place:"Butik" },
      { day:5, time:"10:00–14:00", role:"Kort pass", place:"Butik" }
    ];

    const week = [];
    for(let i=0;i<7;i++){
      const d = new Date(start);
      d.setDate(d.getDate()+i);
      week.push({
        date: isoDate(d),
        label: days[i],
        items: slots.filter(s => s.day === i).map(s => ({
          time: s.time,
          title: s.role,
          place: s.place
        }))
      });
    }

    const all = {
      empNo,
      weekStart: isoDate(start),
      weekNo: weekNumber(start),
      week
    };

    save(all);
    return all;
  }

  function fmtUpcomingDate(iso){
    try{
      const [y,m,d] = iso.split("-").map(n => parseInt(n,10));
      const dt = new Date(y, (m-1), d);
      return dt.toLocaleDateString("sv-SE", { weekday:"short", year:"numeric", month:"2-digit", day:"2-digit" });
    }catch{
      return iso;
    }
  }

  function render(){
    const data = load() || seed();

    $("#weekNo").textContent = String(data.weekNo || "—");

    // Week grid
    const weekEl = $("#week");
    weekEl.innerHTML = "";
    data.week.forEach(day => {
      const box = document.createElement("div");
      box.className = "day";
      box.innerHTML = `<h3>${day.label} <span class="muted">${day.date}</span></h3>`;
      if(day.items && day.items.length){
        day.items.forEach(it => {
          const s = document.createElement("div");
          s.className = "slot";
          s.textContent = `${it.time} • ${it.title}${it.place ? " • " + it.place : ""}`;
          box.appendChild(s);
        });
      }else{
        const s = document.createElement("div");
        s.className = "slot";
        s.textContent = "—";
        box.appendChild(s);
      }
      weekEl.appendChild(box);
    });

    // Upcoming list (flatten)
    const upcoming = [];
    data.week.forEach(day => {
      (day.items || []).forEach(it => upcoming.push({ date: day.date, ...it }));
    });

    const upEl = $("#upcoming");
    upEl.innerHTML = "";

    if(!upcoming.length){
      upEl.innerHTML = `<div class="empty">Inga pass denna vecka.</div>`;
      return;
    }

    upcoming.slice(0,6).forEach(u => {
      const div = document.createElement("div");
      div.className = "shift";
      div.innerHTML = `
        <p class="shift-title">${u.time} • ${u.title}</p>
        <div class="shift-meta">
          <span class="pill">${fmtUpcomingDate(u.date)}</span>
          ${u.place ? `<span class="pill">${u.place}</span>` : ``}
          <span class="pill">Read-only</span>
        </div>
      `;
      upEl.appendChild(div);
    });
  }

  $("#btnReset").addEventListener("click", () => {
    localStorage.removeItem(SCHEDULE_KEY);
    render();
  });

  render();

})();
</script>

</body>
</html>
