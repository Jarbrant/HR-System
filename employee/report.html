<!-- ============================================================
AO-002 | FIL-ID: employee/report.html
Projekt: HR-System
Syfte: Rapportera fel (v1) – UI-only, kopierbar rapport
Policy:
- Ingen backend
- Ingen känslig data lagras
- Samlar teknisk info + fri text
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Rapportera fel</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .top{ align-items:center; }
    .top-actions{
      margin-left:auto;
      display:flex;
      align-items:center;
      gap:10px;
      white-space:nowrap;
    }
    .btn-logout{ opacity:0.85; }
    .btn-logout:hover{ opacity:1; }

    textarea{ min-height: 120px; resize: vertical; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .outbox{
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Medarbetare</span>
  </div>

  <nav class="nav" aria-label="Meny">
    <a href="./home.html">Hem</a>
    <a href="./report.html" aria-current="page">Rapportera fel</a>
  </nav>

  <div class="top-actions">
    <button id="btnLogout" class="secondary btn-logout" type="button">Logga ut</button>
  </div>
</header>

<main class="container">

  <section class="card">
    <h1 class="tight">Rapportera fel</h1>
    <p class="muted">
      Skriv vad som blev fel. Den här v1-versionen skickar inget (ingen backend) –
      du får en rapport som du kan kopiera och skicka till admin.
    </p>

    <div class="dashgrid" style="margin-top:12px;">
      <section class="panel">
        <div class="panel-title">Din information</div>

        <label>
          Namn
          <input id="whoName" type="text" disabled />
        </label>

        <label>
          Anställningsnummer
          <input id="whoEmpNo" type="text" disabled />
        </label>

        <label>
          Roll
          <input id="whoRole" type="text" disabled />
        </label>
      </section>

      <section class="panel">
        <div class="panel-title">Felbeskrivning</div>

        <label>
          Vad hände?
          <textarea id="inpMessage" placeholder="Beskriv kort vad du gjorde och vad som blev fel…"></textarea>
        </label>

        <div class="actions" style="margin-top:10px;">
          <button id="btnBuild" type="button">Skapa rapport</button>
          <button id="btnCopy" type="button" class="secondary">Kopiera</button>
          <a class="btn secondary" href="./home.html">Tillbaka</a>
        </div>

        <p id="msg" class="message" aria-live="polite"></p>
      </section>
    </div>

    <section class="panel" style="margin-top:12px;">
      <div class="panel-title">Rapport (kopiera)</div>
      <div id="out" class="outbox mono" aria-label="Rapport-utdata">—</div>
    </section>
  </section>

</main>

<script>
/* ============================================================
AO-002 | FIL-ID: employee/report.html (inline JS)
Syfte: Guard + rapportbyggare + kopiera
============================================================ */
(function () {
  "use strict";

  const STORAGE_KEY = "AO-001_LOGIN_V1";

  const $ = (sel) => document.querySelector(sel);

  function redirectToLogin() {
    window.location.replace("../UI/UI-01-SKELETON.html#login");
  }

  function readSession() {
    try {
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      if (!data?.auth?.isAuthed) return null;
      if (data.auth.role !== "employee") return null;
      if (!data.auth.expiresAt || data.auth.expiresAt < Date.now()) return null;
      return data.auth;
    } catch {
      return null;
    }
  }

  function setMsg(kind, text) {
    const el = $("#msg");
    if (!el) return;
    el.className = "message" + (kind ? " " + kind : "");
    el.textContent = text || "";
  }

  function buildReport(auth) {
    const message = String($("#inpMessage")?.value || "").trim();

    // minimikrav: text
    if (!message) {
      setMsg("err", "Skriv en kort felbeskrivning först.");
      return null;
    }

    const report = {
      v: 1,
      createdAt: new Date().toISOString(),
      role: auth.role,
      empNo: auth.empNo,
      displayName: auth.displayName,
      pageUrl: window.location.href,
      pagePath: window.location.pathname,
      language: document.documentElement.lang || "sv",
      tech: {
        userAgent: navigator.userAgent,
        viewport: { w: window.innerWidth, h: window.innerHeight },
        platform: navigator.platform || "",
        timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone || ""
      },
      message
    };

    return report;
  }

  function init() {
    const auth = readSession();
    if (!auth) { redirectToLogin(); return; }

    // Fill identity
    $("#whoName").value = auth.displayName || "";
    $("#whoEmpNo").value = auth.empNo || "";
    $("#whoRole").value = auth.role || "employee";

    // Logout
    $("#btnLogout").addEventListener("click", () => {
      sessionStorage.removeItem(STORAGE_KEY);
      redirectToLogin();
    });

    // Build
    $("#btnBuild").addEventListener("click", () => {
      setMsg("", "");
      const rep = buildReport(auth);
      if (!rep) return;
      $("#out").textContent = JSON.stringify(rep, null, 2);
      setMsg("warn", "Rapport skapad (demo). Kopiera och skicka till admin.");
    });

    // Copy
    $("#btnCopy").addEventListener("click", async () => {
      const text = $("#out").textContent || "";
      if (!text || text === "—") { setMsg("err", "Skapa rapport först."); return; }
      try {
        await navigator.clipboard.writeText(text);
        setMsg("", "Kopierad.");
      } catch {
        setMsg("err", "Kunde inte kopiera automatiskt. Markera texten och kopiera manuellt.");
      }
    });
  }

  init();
})();
</script>

</body>
</html>
