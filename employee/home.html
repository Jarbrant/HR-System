<!-- ============================================================
AO-053 (PATCH v1.1) | FIL-ID: employee/home.html
Projekt: HR-System
Syfte: Employee – Tolka aktiva HR-paket till görbara post-its (utan att visa “paket” i UI)

BAS: AO-048 (PATCH v1.2) – Dagskalender + Post-its + knöggla & kasta

AO-053 (LÅST):
- UI-only • Fail-closed
- Inga nya storage-keys
- Ingen exekvering / ingen schemamotor / ingen historik
- Employee ser endast “kort/post-its” (rubrik=blocktitel, subtext=källa + intervalltext)
- Klar-logik (fail-closed):
  * info: alltid klar (men visas)
  * task: klar när uppgift är klar i AO-014_TASKS_V1
  * question: klar när svar finns i AO-013_ANSWERS_V1 (match via questionId eller titel)
  * both: båda måste vara klara
- Question-kort leder till employee/questions.html (read-only navigering)
- Behåll knöggla/kasta

Keys (LÅST):
- AO-001_LOGIN_V1 (sessionStorage/localStorage) – session (auth)
- AO-020_ROLE_ASSIGNMENTS_V2 (localStorage) – empNo→scopeId (läs/ev. resolva)
- AO-014_TASKS_V1 (localStorage) – uppgifter (läser/skriver)
- AO-050_PACKAGES_V1 (localStorage) – paketdefinitioner (läs endast)
- AO-012_QUESTIONS_V1 (localStorage) – frågor (läs endast)
- AO-013_ANSWERS_V1 (localStorage) – svar (läs endast)
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Medarbetare</title>
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#0f172a;
      --muted:#64748b;
      --line:rgba(15,23,42,.12);

      --cal1:rgba(238,242,255,.85);
      --cal2:rgba(236,254,255,.75);

      --note1:#fff7c2;
      --note2:#ffd6a5;
      --note3:#cdeaff;
      --note4:#d9f7d6;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Top nav */
    .topbar{
      position: sticky;
      top:0;
      z-index:10;
      background: rgba(246,247,251,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
    }
    .nav{
      max-width:1100px;
      margin:0 auto;
      padding:10px 16px;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .nav a{
      text-decoration:none;
      color:var(--ink);
      font-size:14px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid transparent;
    }
    .nav a:hover{ border-color:var(--line); background:#fff; }
    .nav .spacer{ flex:1; }
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--line);
      background:#fff;
      padding:6px 10px;
      border-radius:999px;
      white-space:nowrap;
    }

    .wrap{
      max-width:1100px;
      margin:16px auto 28px;
      padding:0 16px;
    }

    .guard{
      border:1px solid rgba(239,68,68,.25);
      background:rgba(254,242,242,.9);
      color:#7f1d1d;
      padding:12px 14px;
      border-radius:14px;
      margin:14px 0;
      display:none;
    }

    /* Header card */
    .header{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      margin-bottom:14px;
    }
    .header h1{
      margin:0 0 6px;
      font-size:16px;
      font-weight:900;
    }
    .header p{
      margin:0;
      font-size:13px;
      color:var(--muted);
      line-height:1.4;
    }
    .voice{
      margin-top:10px;
      padding:14px;
      border-radius:16px;
      border:1px dashed rgba(15,23,42,.22);
      background: linear-gradient(135deg, rgba(238,242,255,.95), rgba(236,254,255,.95));
      font-weight:900;
      font-size:16px;
    }

    .grid{
      display:grid;
      grid-template-columns: 340px 1fr;
      gap:16px;
      align-items:start;
    }
    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
    }

    /* Calendar */
    .cal{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
    }
    .calHead{
      padding:14px 14px 10px;
      border-bottom:1px solid var(--line);
      background: linear-gradient(180deg, var(--cal1), #fff);
    }
    .calHeadTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .calHead h2{
      margin:0;
      font-size:14px;
      font-weight:900;
    }
    .controls{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .btn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:8px 10px;
      font-size:13px;
      cursor:pointer;
      user-select:none;
    }
    .btn:hover{ background:#fafafa; }
    .btn:active{ transform:translateY(1px); }

    .dateRow{
      margin-top:10px;
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:10px;
    }
    .dateBig{
      font-size:18px;
      font-weight:950;
      letter-spacing:.2px;
    }
    .dateSmall{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }
    .badge{
      font-size:12px;
      border-radius:999px;
      padding:6px 10px;
      border:1px solid rgba(15,23,42,.10);
      background: rgba(236,254,255,.70);
      white-space:nowrap;
    }
    .badge.done{
      background: rgba(217,247,214,.85);
      border-color: rgba(16,185,129,.25);
    }

    .calBody{ padding:12px 14px 14px; }
    .block{
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      background: rgba(238,242,255,.55);
      margin-bottom:10px;
    }
    .block.alt{ background: rgba(236,254,255,.55); }
    .block h3{
      margin:0 0 8px;
      font-size:13px;
      font-weight:900;
    }
    .list{
      list-style:none;
      margin:0;
      padding:0;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .item{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      padding:10px 10px;
      border-radius:14px;
      border:1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,.92);
    }
    .name{
      font-size:13px;
      font-weight:800;
      line-height:1.25;
    }
    .meta{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }

    /* Board */
    .board{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      position:relative;
      min-height:520px;
    }
    .boardHead{
      padding:14px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background: linear-gradient(180deg, #fff, #fafafa);
      flex-wrap:wrap;
    }
    .boardHead h2{
      margin:0;
      font-size:14px;
      font-weight:950;
    }
    .hint{
      font-size:12px;
      color:var(--muted);
    }
    .boardPills{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
      margin-left:auto;
    }
    .pill2{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--line);
      background:#fff;
      padding:6px 10px;
      border-radius:999px;
      white-space:nowrap;
    }

    .notes{
      padding:14px;
      display:grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap:14px;
      align-items:start;
    }
    @media (max-width: 980px){
      .notes{ grid-template-columns: 1fr; }
    }

    .note{
      border-radius:16px;
      border:1px solid rgba(15,23,42,.12);
      box-shadow: 0 10px 20px rgba(15,23,42,.06);
      padding:12px;
      position:relative;
      transform: rotate(var(--tilt, -1deg));
      transition: transform .2s ease, box-shadow .2s ease;
      will-change: transform, opacity, filter;
      transform-origin: 30% 20%;
    }
    .note:hover{
      transform: rotate(var(--tilt, -1deg)) translateY(-2px);
      box-shadow: 0 14px 24px rgba(15,23,42,.10);
    }
    .note .t{
      font-weight:950;
      font-size:14px;
      margin:0 0 6px;
      line-height:1.25;
    }
    .note .s{
      font-size:12px;
      color: rgba(15,23,42,.72);
      margin:0 0 10px;
      line-height:1.35;
    }
    .row{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .mini{
      font-size:12px;
      color:var(--muted);
    }
    .doneBtn{
      border:1px solid rgba(15,23,42,.12);
      background: rgba(255,255,255,.75);
      border-radius:12px;
      padding:8px 10px;
      cursor:pointer;
      font-size:13px;
      font-weight:900;
    }
    .doneBtn:hover{ background: rgba(255,255,255,.95); }
    .doneBtn:active{ transform: translateY(1px); }

    .linkBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(15,23,42,.12);
      background: rgba(255,255,255,.75);
      border-radius:12px;
      padding:8px 10px;
      cursor:pointer;
      font-size:13px;
      font-weight:900;
      color:inherit;
      text-decoration:none;
      white-space:nowrap;
    }
    .linkBtn:hover{ background: rgba(255,255,255,.95); }

    .okPill{
      font-size:12px;
      border-radius:999px;
      padding:6px 10px;
      border:1px solid rgba(16,185,129,.25);
      background: rgba(217,247,214,.85);
      color:#064e3b;
      white-space:nowrap;
    }

    /* Trash */
    .trash{
      position:absolute;
      right:14px;
      bottom:14px;
      width:170px;
      height:120px;
      border-radius:16px;
      border:1px dashed rgba(15,23,42,.18);
      background: rgba(15,23,42,.03);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:6px;
      pointer-events:none;
    }
    .trash .icon{ font-size:22px; opacity:.85; }
    .trash .txt{ font-size:12px; color:var(--muted); text-align:center; padding:0 10px; }

    /* === Filmisk “knöggla & kasta” === */
    .note.is-crumpling{ animation: crumple 520ms ease forwards; }
    @keyframes crumple{
      0%   { transform: rotate(var(--tilt, -1deg)) scale(1); filter: blur(0px); }
      35%  { transform: rotate(8deg) scale(.94) skewX(2deg); filter: blur(.2px); }
      65%  { transform: rotate(-12deg) scale(.82) skewX(-3deg); filter: blur(.6px); }
      100% { transform: rotate(18deg) scale(.62); filter: blur(.9px); }
    }

    .note.is-throwing{ animation: throw 420ms cubic-bezier(.2,.9,.15,1) forwards; }
    @keyframes throw{
      0%   { opacity: 1; }
      55%  { opacity: .9; }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce){
      .note.is-crumpling, .note.is-throwing{ animation: none !important; opacity: 0 !important; }
    }
  </style>
</head>

  <!-- AO-002 beroenden (LÅSTA): config måste laddas före app -->
  <script src="../UI/UI-04-CONFIG.js"></script>
  <script src="../UI/UI-03-APP.js"></script>

  <script>
    "use strict";

    /* ===========================
       Keys (LÅST)
    ============================ */
    const KEY_SESSION      = "AO-001_LOGIN_V1";
    const KEY_TASKS        = "AO-014_TASKS_V1";
    const KEY_ASSIGNMENTS  = "AO-020_ROLE_ASSIGNMENTS_V2";
    // AO-053 (READ ONLY)
    const KEY_PACKAGES     = "AO-050_PACKAGES_V1";
    const KEY_QUESTIONS    = "AO-012_QUESTIONS_V1";
    const KEY_ANSWERS      = "AO-013_ANSWERS_V1";

    /* ===========================
       DOM
    ============================ */
    const guardBox  = document.getElementById("guardBox");
    const whoPill   = document.getElementById("whoPill");
    const helloLine = document.getElementById("helloLine");
    const voiceLine = document.getElementById("voiceLine");

    const dateBig   = document.getElementById("dateBig");
    const dateSmall = document.getElementById("dateSmall");
    const dayBadge  = document.getElementById("dayBadge");

    const doneList  = document.getElementById("doneList");
    const todoList  = document.getElementById("todoList");
    const notesGrid = document.getElementById("notesGrid");
    const boardPill = document.getElementById("boardPill");

    const prevDayBtn = document.getElementById("prevDayBtn");
    const nextDayBtn = document.getElementById("nextDayBtn");
    const todayBtn   = document.getElementById("todayBtn");

    const logoutLink = document.getElementById("logoutLink");
    const trashBox   = document.getElementById("trashBox");

    /* ===========================
       Fail-closed guard + XSS
    ============================ */
    function showGuard(msg){ guardBox.style.display = "block"; guardBox.textContent = String(msg || ""); }
    function hideGuard(){ guardBox.style.display = "none"; guardBox.textContent = ""; }

    function escapeHtml(input){
      if (window.HRApp && typeof window.HRApp.escapeHtml === "function") return window.HRApp.escapeHtml(input);
      const s = String(input ?? "");
      return s
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function safeJsonParse(str){ try { return JSON.parse(str); } catch { return null; } }

    function readAnyStorage(key){
      // fail-closed läsning: sessionStorage först, fallback localStorage
      try {
        const s1 = sessionStorage.getItem(key);
        if (s1) return s1;
      } catch {}
      try {
        const s2 = localStorage.getItem(key);
        if (s2) return s2;
      } catch {}
      return null;
    }

    function writeSessionPreferred(sessionObj){
      // Skriver ENDAST befintlig key (KEY_SESSION). Ingen ny key.
      const raw = JSON.stringify(sessionObj);
      try { sessionStorage.setItem(KEY_SESSION, raw); return true; } catch {}
      try { localStorage.setItem(KEY_SESSION, raw); return true; } catch {}
      return false;
    }

    /* ===========================
       AO-002 AUTH (kopplat)
       - RBAC via requireAuth
       - scopeId-repair via assignments (PATCH v1.2)
    ============================ */
    function mustAuthOrStop(){
      if (!window.HRApp || typeof window.HRApp.requireAuth !== "function") {
        showGuard("Systemfel: HRApp saknas. (UI-03-APP.js)");
        return null;
      }
      if (!window.HR_CONFIG || !window.HR_CONFIG.ROLES) {
        showGuard("Systemfel: HR_CONFIG saknas. (UI-04-CONFIG.js)");
        return null;
      }

      // EMPLOYEE-sida: tillåt endast EMPLOYEE (fail-closed)
      const sess = window.HRApp.requireAuth({ allowRoles: [ window.HR_CONFIG.ROLES.EMPLOYEE ] });
      if (!sess) return null;

      let auth = window.HRApp.getAuth(sess);
      if (!auth || auth.isAuthed !== true) {
        showGuard("Fail-closed: saknar giltig session. Logga in igen.");
        return null;
      }

      // PATCH v1.2: om scopeId saknas -> försök resolva via assignments och skriv tillbaka till session.
      if (!String(auth.scopeId || "").trim()) {
        const empNo = String(auth.empNo || "").trim();
        const role  = String(auth.role || "").trim();
        const scopeId = resolveScopeIdFromAssignments(empNo, role);

        if (scopeId) {
          const patched = patchSessionScope(sess, scopeId);
          if (patched) {
            auth = window.HRApp.getAuth(patched) || auth;
            // Vi fortsätter även om write misslyckas, men visar varning.
          } else {
            showGuard("Fail-closed: kunde inte uppdatera session med scopeId (korrupt session). Logga in igen.");
            return null;
          }
        }
      }

      return { sess, auth };
    }

    function readAssignments(){
      const raw = readAnyStorage(KEY_ASSIGNMENTS);
      if (!raw) return [];
      const data = safeJsonParse(raw);
      if (Array.isArray(data)) return data;
      if (data && typeof data === "object" && Array.isArray(data.assignments)) return data.assignments;
      return [];
    }

    function normalizeEmpNo(x){ return String(x ?? "").trim(); }
    function normalizeRole(x){ return String(x ?? "").trim(); }

    function resolveScopeIdFromAssignments(empNo, role){
      const me = normalizeEmpNo(empNo);
      const r  = normalizeRole(role);
      if (!me || !r) return "";

      const list = readAssignments();
      if (!Array.isArray(list) || list.length === 0) return "";

      for (const a of list) {
        if (!a || typeof a !== "object") continue;

        const aEmp = normalizeEmpNo(a.empNo ?? a.employeeNo ?? a.id ?? "");
        if (aEmp !== me) continue;

        const aRole = normalizeRole(a.role ?? a.roleId ?? "");
        if (aRole && aRole !== r) continue;

        const scope = String(a.scopeId ?? a.scope ?? "").trim();
        if (scope) return scope;
      }

      return "";
    }

    function patchSessionScope(sessionObj, scopeId){
      const sid = String(scopeId || "").trim();
      if (!sessionObj || typeof sessionObj !== "object" || !sid) return null;

      const out = sessionObj;

      if (out.auth && typeof out.auth === "object") {
        out.auth.scopeId = sid;
      } else {
        out.scopeId = sid;
      }

      writeSessionPreferred(out);
      return out;
    }

    /* ===========================
       Tasks IO (LÅST)
    ============================ */
    function readTasksArray(){
      const raw = localStorage.getItem(KEY_TASKS);
      const data = safeJsonParse(raw || "");
      if(!Array.isArray(data)) return [];
      return data;
    }

    function writeTasksArray(arr){
      if(!Array.isArray(arr)) return false;
      try {
        localStorage.setItem(KEY_TASKS, JSON.stringify(arr));
        return true;
      } catch {
        return false;
      }
    }

    /* ===========================
       AO-053 READ helpers (NO WRITES)
    ============================ */
    function readLocalArray(key){
      try{
        const raw = localStorage.getItem(key);
        const data = safeJsonParse(raw || "");
        return Array.isArray(data) ? data : [];
      }catch{
        return [];
      }
    }

    function normStr(s){
      return String(s ?? "").trim();
    }

    function normKey(s){
      return normStr(s).toLowerCase().replace(/\s+/g," ").trim();
    }

    /* ===========================
       Date
    ============================ */
    const WEEKDAYS = ["Söndag","Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag"];
    const MONTHS   = ["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];

    function toISODate(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    }
    function fmtBig(d){ return WEEKDAYS[d.getDay()]; }
    function fmtSmall(d){ return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }

    let selectedDate = new Date();
    selectedDate.setHours(12,0,0,0);

    /* ===========================
       Task normalization (tolerant)
       + FAIL-CLOSED FILTRERING:
       - visa inte tasks utan scopeId
       - visa inte tasks som inte är riktade till empNo (eller ALL)
    ============================ */
    function getTaskId(t, idx){
      const raw = (t && (t.id || t.taskId || t.uuid)) ?? `task_${idx}`;
      return String(raw);
    }
    function getTaskTitle(t){ return String(t?.title ?? t?.name ?? t?.text ?? "Uppgift"); }
    function getTaskDesc(t){ return String(t?.description ?? t?.desc ?? ""); }

    function isDone(t){
      const s = String(t?.status ?? t?.state ?? "").toLowerCase();
      if(t?.done === true) return true;
      if(t?.isDone === true) return true;
      if(s === "done" || s === "klar" || s === "completed" || s === "complete") return true;
      return false;
    }
    function setDone(t){
      if("done" in t) t.done = true;
      else if("isDone" in t) t.isDone = true;
      else t.done = true;
      if("status" in t) t.status = "done";
      return t;
    }

    function getTaskDateISO(t){
      const candidates = [t?.dueDate, t?.date, t?.day, t?.scheduledDate, t?.startDate, t?.startsAt];
      for(const c of candidates){
        if(!c) continue;
        if(typeof c === "string"){
          if(/^\d{4}-\d{2}-\d{2}$/.test(c)) return c;
          const d = new Date(c);
          if(!isNaN(d.getTime())) return toISODate(d);
        } else if(typeof c === "number"){
          const d = new Date(c);
          if(!isNaN(d.getTime())) return toISODate(d);
        }
      }
      return null;
    }

    function taskBelongsToDay(t, dayISO){
      const iso = getTaskDateISO(t);
      if(!iso) return (dayISO === toISODate(new Date())); // saknar datum => behandla som idag
      return iso === dayISO;
    }

    function getAssignedTo(t){
      return t?.assignedTo ?? t?.assignee ?? t?.toEmpNo ?? t?.empNo ?? t?.targetEmpNo ?? null;
    }

    function isAssignedToMe(t, empNo){
      const a = getAssignedTo(t);
      if (a == null) return false;

      const me = String(empNo || "").trim();
      if (!me) return false;

      if (typeof a === "string" || typeof a === "number") {
        const s = String(a).trim();
        if (s === "ALL" || s === "*") return true;
        return s === me;
      }
      if (Array.isArray(a)) {
        return a.map(x => String(x).trim()).includes(me);
      }
      return false;
    }

    function hasValidScopeMatch(t, myScopeId){
      const scope = String(t?.scopeId ?? "").trim();
      const mine  = String(myScopeId ?? "").trim();
      if (!scope || !mine) return false;

      // Employee: exakt scope (inte subtree)
      if (window.HRApp && typeof window.HRApp.sameOrMissingScope === "function") {
        return window.HRApp.sameOrMissingScope(scope, mine);
      }
      return scope === mine;
    }

    function visibleTasksForMe(allTasks, empNo, scopeId){
      return (Array.isArray(allTasks) ? allTasks : []).filter(t => {
        if (!hasValidScopeMatch(t, scopeId)) return false;
        if (!isAssignedToMe(t, empNo)) return false;
        return true;
      });
    }

    /* ===========================
       AO-053: Schedule text (display-only, no engine)
       - Supports legacy schedule.interval and MASTER schedule.intervalUnit
    ============================ */
    function isISODate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"")); }
    function isHHMM(s){ return /^([01]\d|2[0-3]):[0-5]\d$/.test(String(s||"")); }

    function swUnit(unit, every){
      const u = String(unit || "").trim();
      const n = Number(every || 1);
      if (u === "day") return (n === 1 ? "dag" : "dagar");
      if (u === "week") return (n === 1 ? "vecka" : "veckor");
      if (u === "month") return (n === 1 ? "månad" : "månader");
      return "period";
    }

    function weekdayLabel(id){
      const m = { mon:"Mån", tue:"Tis", wed:"Ons", thu:"Tor", fri:"Fre", sat:"Lör", sun:"Sön" };
      return m[String(id||"").trim()] || "";
    }

    function scheduleTextForCard(schedule){
      const s = (schedule && typeof schedule === "object") ? schedule : {};
      const mode = String(s.mode || "once");

      const start = isISODate(s.startDate) ? s.startDate : "";
      if(mode !== "recurring"){
        return start ? `Start ${start}` : "Engång";
      }

      // Legacy support:
      const unitRaw = (s.intervalUnit || s.interval);
      const unit = (unitRaw === "day" || unitRaw === "week" || unitRaw === "month") ? unitRaw : "week";
      const every = Number.isFinite(Number(s.intervalEvery)) ? Math.max(1, Math.min(52, Math.trunc(Number(s.intervalEvery)))) : 1;

      const parts = [];

      parts.push(`Varje ${every} ${swUnit(unit, every)}`);

      // Weekdays (only metadata)
      if(unit === "week" && Array.isArray(s.byWeekdays) && s.byWeekdays.length){
        const w = s.byWeekdays.map(weekdayLabel).filter(Boolean);
        if(w.length) parts.push(w.join(", "));
      }

      // Month day (only metadata)
      if(unit === "month" && String(s.byMonthDay || "").trim()){
        const md = String(s.byMonthDay).trim();
        parts.push(`Dag ${md}`);
      }

      // time (only metadata)
      if(isHHMM(s.time)) parts.push(`Kl ${s.time}`);

      if(start) parts.push(`Start ${start}`);

      const until = (String(s.endMode||"") === "until" && isISODate(s.endDate)) ? `Till ${s.endDate}` : "Tillsvidare";
      parts.push(until);

      return parts.filter(Boolean).join(" • ");
    }

    /* ===========================
       AO-053: Questions/Answers matching (tolerant)
       - If answer has empNo, require it matches current empNo (fail-closed for cross-user)
       - Backcompat: missing empNo => accept
    ============================ */
    function readQuestions(){ return readLocalArray(KEY_QUESTIONS); }
    function readAnswers(){ return readLocalArray(KEY_ANSWERS); }

    function getQuestionId(q){
      return String(q?.id ?? q?.questionId ?? q?.qid ?? "");
    }
    function getQuestionTitle(q){
      return String(q?.title ?? q?.name ?? q?.text ?? "");
    }

    function answerEmpNo(ans){
      return String(ans?.empNo ?? ans?.employeeNo ?? ans?.employeeId ?? ans?.userId ?? "").trim();
    }

    function answerMatchesQuestion(ans, qId, qTitle, myEmpNo){
      if(!ans || typeof ans !== "object") return false;

      // If empNo present on answer => must match me
      const aEmp = answerEmpNo(ans);
      if(aEmp && String(myEmpNo||"").trim() && aEmp !== String(myEmpNo).trim()) return false;

      const aQid = String(ans.questionId ?? ans.qid ?? ans.question_id ?? "");
      if(qId && aQid && aQid === qId) return true;

      const aTitle = String(ans.questionTitle ?? ans.title ?? ans.questionText ?? "");
      if(qTitle && aTitle && normKey(aTitle) === normKey(qTitle)) return true;

      return false;
    }

    function hasAnswerForTitle(qTitle, myEmpNo){
      const title = normStr(qTitle);
      if(!title) return false;

      const answers = readAnswers();
      if(!Array.isArray(answers) || answers.length === 0) return false;

      // Prefer: find questionId by questions list
      const questions = readQuestions();
      let qId = "";
      if(Array.isArray(questions) && questions.length){
        const found = questions.find(q => normKey(getQuestionTitle(q)) === normKey(title));
        if(found) qId = getQuestionId(found);
      }

      return answers.some(a => answerMatchesQuestion(a, qId, title, myEmpNo));
    }

    /* ===========================
       AO-053: Packages -> cards (read-only)
    ============================ */
    function readPackagesActive(){
      const arr = readLocalArray(KEY_PACKAGES);
      const list = Array.isArray(arr) ? arr : [];
      return list.filter(p => !!p && typeof p === "object" && p.isActive === true);
    }

    function normalizeBlockKind(kind){
      const k = String(kind || "").toLowerCase().trim();
      if(k === "task" || k === "uppgift") return "task";
      if(k === "question" || k === "fråga") return "question";
      if(k === "info" || k === "information") return "info";
      if(k === "both") return "both";
      return "unknown";
    }

    function blocksFromPackage(pkg){
      const blocks = Array.isArray(pkg?.blocks) ? pkg.blocks : [];
      return blocks.map(b => {
        const id = normStr(b?.id) || ("blk_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16));
        const kind = normalizeBlockKind(b?.kind);
        const title = normStr(b?.title) || "—";
        const description = normStr(b?.description ?? b?.text ?? "");
        const required = (b && typeof b === "object" && "required" in b) ? !!b.required : false;
        return { id, kind, title, description, required, raw:b };
      });
    }

    function findMatchingTaskForBlock(tasksVisible, blockTitle){
      const bt = normKey(blockTitle);
      if(!bt) return null;

      for(let i=0;i<tasksVisible.length;i++){
        const t = tasksVisible[i];
        const tt = normKey(getTaskTitle(t));
        if(tt && tt === bt) return { task: t, idx: i };
      }
      return null;
    }

    function isPackageBlockDone(block, tasksVisible, myEmpNo){
      const kind = block.kind;

      if(kind === "info") return true;

      if(kind === "task"){
        const match = findMatchingTaskForBlock(tasksVisible, block.title);
        if(!match) return false;
        return isDone(match.task);
      }

      if(kind === "question"){
        return hasAnswerForTitle(block.title, myEmpNo);
      }

      if(kind === "both"){
        const tOk = (() => {
          const match = findMatchingTaskForBlock(tasksVisible, block.title);
          if(!match) return false;
          return isDone(match.task);
        })();
        const qOk = hasAnswerForTitle(block.title, myEmpNo);
        return tOk && qOk;
      }

      return false;
    }

    /* ===========================
       Systemets 5 meningar (låst)
    ============================ */
    const VOICE = {
      NOTHING: "Det finns inget som kräver din uppmärksamhet just nu.",
      ONE_LEFT: "Det finns en sak kvar idag, den tar bara en stund.",
      IN_PHASE: "Du är i fas.",
      CAN_WAIT: "Det här kan vänta till imorgon.",
      UNCLEAR: "Något är oklart – säg till om du behöver stöd."
    };

    function chooseVoice(todoCount, doneCount, isToday){
      if(todoCount === 0 && doneCount === 0) return VOICE.NOTHING;
      if(todoCount === 0 && doneCount > 0) return VOICE.IN_PHASE;
      if(todoCount === 1 && isToday) return VOICE.ONE_LEFT;
      if(todoCount > 1 && !isToday) return VOICE.CAN_WAIT;
      if(todoCount > 0 && isToday) return VOICE.UNCLEAR;
      return VOICE.IN_PHASE;
    }

    /* ===========================
       Render
    ============================ */
    function pickNoteBg(i){
      const colors = ["var(--note1)","var(--note2)","var(--note3)","var(--note4)"];
      return colors[i % colors.length];
    }

    function render(auth){
      hideGuard();

      const empNo = String(auth.empNo ?? "").trim();
      const role  = String(auth.role ?? "EMPLOYEE").trim();
      const scopeId = String(auth.scopeId ?? "").trim();

      whoPill.textContent = `${empNo || "—"} • ${role}`;
      helloLine.textContent = `Hej • Anst.nr ${empNo || "—"} • Roll ${role}`;

      const dayISO = toISODate(selectedDate);
      const isToday = dayISO === toISODate(new Date());

      dateBig.textContent = fmtBig(selectedDate);
      dateSmall.textContent = fmtSmall(selectedDate);

      if (!scopeId) {
        voiceLine.textContent = VOICE.UNCLEAR;
        dayBadge.textContent = `0 färdig • 0 återstår`;
        boardPill.textContent = "—";
        doneList.innerHTML = "";
        todoList.innerHTML = "";
        notesGrid.innerHTML = "";
        showGuard("Fail-closed: saknar scopeId i session. (Access/Assignments måste vara korrekt.)");
        return;
      }

      // Calendar tasks (existing logic)
      const all = readTasksArray();
      const mineAll = visibleTasksForMe(all, empNo, scopeId);
      const todays = mineAll.filter(t => taskBelongsToDay(t, dayISO));
      const done = todays.filter(isDone);
      const todo = todays.filter(t => !isDone(t));

      voiceLine.textContent = chooseVoice(todo.length, done.length, isToday);
      dayBadge.textContent = `${done.length} färdig • ${todo.length} återstår`;

      renderCalendarLists(done, todo);

      // AO-053: build extra cards from active definitions (read-only)
      const pkgCards = buildPackageCards(mineAll, empNo);

      const pkgTodoCount = pkgCards.filter(c => !c.isDone).length;
      const pkgDoneCount = pkgCards.filter(c => c.isDone).length;

      boardPill.textContent = `${pkgDoneCount} klar • ${pkgTodoCount} återstår`;

      renderNotesCombined(todo, pkgCards, auth, mineAll);
    }

    function renderCalendarLists(doneArr, todoArr){
      doneList.innerHTML = "";
      todoList.innerHTML = "";

      if(doneArr.length === 0){
        doneList.innerHTML = `
          <li class="item">
            <div>
              <div class="name">Inget färdigt ännu</div>
              <div class="meta">Det är okej.</div>
            </div>
            <span class="badge done">Färdig</span>
          </li>`;
      } else {
        for(const t of doneArr){
          const title = escapeHtml(getTaskTitle(t));
          const meta = escapeHtml(getTaskDesc(t));
          doneList.insertAdjacentHTML("beforeend", `
            <li class="item">
              <div>
                <div class="name">${title}</div>
                <div class="meta">${meta || "Färdig."}</div>
              </div>
              <span class="badge done">Färdig</span>
            </li>
          `);
        }
      }

      if(todoArr.length === 0){
        todoList.innerHTML = `
          <li class="item">
            <div>
              <div class="name">Inget kvar</div>
              <div class="meta">Det är lugnt.</div>
            </div>
            <span class="badge">—</span>
          </li>`;
      } else {
        for(const t of todoArr){
          const title = escapeHtml(getTaskTitle(t));
          const meta = escapeHtml(getTaskDesc(t));
          todoList.insertAdjacentHTML("beforeend", `
            <li class="item">
              <div>
                <div class="name">${title}</div>
                <div class="meta">${meta || "Återstår."}</div>
              </div>
              <span class="badge">Återstår</span>
            </li>
          `);
        }
      }

    /* ===========================
       AO-053: Cards build (read-only)
    ============================ */
    function buildPackageCards(tasksVisibleAll, myEmpNo){
      const activePkgs = readPackagesActive();
      if(!Array.isArray(activePkgs) || activePkgs.length === 0) return [];

      const cards = [];
      for(const pkg of activePkgs){
        const sourceName = normStr(pkg?.name) || "—";
        const schTxt = scheduleTextForCard(pkg?.schedule);
        const sub = `${sourceName}${schTxt ? " • " + schTxt : ""}`.trim();

        const blocks = blocksFromPackage(pkg);
        for(const b of blocks){
          const isDoneNow = isPackageBlockDone(b, tasksVisibleAll, myEmpNo);
          const kind = b.kind;

          const ui = { action:"none", primaryLabel:"", secondaryLabel:"" };

          if(kind === "info"){
            ui.action = "none";
          }else if(kind === "task"){
            ui.action = "taskDone";
            ui.primaryLabel = "Klar";
          }else if(kind === "question"){
            ui.action = "goQuestions";
            ui.primaryLabel = "Svara";
          }else if(kind === "both"){
            ui.action = "both";
            ui.primaryLabel = "Klar";
            ui.secondaryLabel = "Svara";
          }else{
            ui.action = "none";
          }

          cards.push({
            source: "pkg",
            id: `pkg_${normStr(pkg?.id) || "x"}_${b.id}`,
            pkgId: normStr(pkg?.id),
            title: b.title,
            desc: b.description,
            sub: sub,
            kind: kind,
            required: !!b.required,
            isDone: !!isDoneNow,
            ui
          });
        }
      }

      return cards;
    }

    /* ===========================
       Notes rendering (combined)
    ============================ */
    function renderNotesCombined(todoTasksForDay, pkgCards, auth){
      notesGrid.innerHTML = "";

      const items = [];

      if(Array.isArray(pkgCards) && pkgCards.length){
        const a = pkgCards.slice().sort((x,y)=>Number(!!x.isDone)-Number(!!y.isDone));
        items.push(...a);
      }

      if(Array.isArray(todoTasksForDay) && todoTasksForDay.length){
        todoTasksForDay.forEach((t, idx) => {
          items.push({
            source: "task",
            id: `task_${getTaskId(t, idx)}`,
            taskId: getTaskId(t, idx),
            title: getTaskTitle(t),
            desc: getTaskDesc(t),
            sub: "",
            kind: "task",
            isDone: false
          });
        });
      }

      if(items.length === 0){
        notesGrid.innerHTML = `
          <article class="note" style="background: rgba(217,247,214,.85); --tilt:-1deg;">
            <div class="t">Inga post-its just nu</div>
            <div class="s">Om något dyker upp senare syns det här.</div>
            <div class="row">
              <div class="mini">—</div>
              <span class="okPill">Lugnt</span>
            </div>
          </article>`;
        return;
      }

      items.forEach((it, idx) => {
        const title = escapeHtml(it.title || "—");
        const desc  = escapeHtml(it.desc || "—");
        const sub   = escapeHtml(it.sub || "");
        const id    = escapeHtml(it.id);
        const bg    = pickNoteBg(idx);
        const tilt  = (idx % 2 === 0) ? "-1.2deg" : "1.1deg";

        const donePill = it.isDone ? `<span class="okPill" aria-label="Klar">Klar</span>` : "";

        let actionsHtml = "";
        if(it.source === "task"){
          actionsHtml = `
            <button class="doneBtn" type="button" data-action="done-task" data-task-id="${escapeHtml(it.taskId)}">Klar</button>
          `;
        }else if(it.source === "pkg"){
          if(it.ui.action === "none"){
            actionsHtml = donePill || `<span class="pill2">Info</span>`;
          }else if(it.ui.action === "goQuestions"){
            actionsHtml = `
              <a class="linkBtn" href="./questions.html" data-action="go-questions">Svara</a>
              ${donePill}
            `;
          }else if(it.ui.action === "taskDone"){
            actionsHtml = it.isDone
              ? donePill
              : `<button class="doneBtn" type="button" data-action="done-pkg-task" data-card-id="${id}">Klar</button>`;
          }else if(it.ui.action === "both"){
            actionsHtml = `
              ${it.isDone ? donePill : `<button class="doneBtn" type="button" data-action="done-pkg-task" data-card-id="${id}">Klar</button>`}
              <a class="linkBtn" href="./questions.html" data-action="go-questions">Svara</a>
            `;
          }else{
            actionsHtml = donePill || "";
          }
        }

        const subline = sub ? `<div class="mini">${sub}</div>` : `<div class="mini">—</div>`;

        notesGrid.insertAdjacentHTML("beforeend", `
          <article class="note" data-note-id="${id}" data-source="${escapeHtml(it.source)}" style="background:${bg}; --tilt:${tilt};">
            <div class="t">${title}</div>
            <div class="s">${desc || "—"}</div>
            <div class="row">
              ${subline}
              <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
                ${actionsHtml}
              </div>
            </div>
          </article>
        `);
      });
    }

    /* ===========================
       Mark done + Animate to trash
    ============================ */
    function markTaskDone(taskId, auth){
      const empNo = String(auth.empNo ?? "").trim();
      const scopeId = String(auth.scopeId ?? "").trim();

      const all = readTasksArray();
      if(!Array.isArray(all) || all.length === 0) return false;

      let found = false;
      for(let i=0;i<all.length;i++){
        const id = getTaskId(all[i], i);
        if(String(id) !== String(taskId)) continue;

        if (!hasValidScopeMatch(all[i], scopeId)) return false;
        if (!isAssignedToMe(all[i], empNo)) return false;

        all[i] = setDone(all[i]);
        found = true;
        break;
      }
      if(!found) return false;

      return writeTasksArray(all);
    }

    function markMatchingTaskDoneByTitle(blockTitle, auth){
      const empNo = String(auth.empNo ?? "").trim();
      const scopeId = String(auth.scopeId ?? "").trim();

      const all = readTasksArray();
      const mineAll = visibleTasksForMe(all, empNo, scopeId);
      const match = findMatchingTaskForBlock(mineAll, blockTitle);
      if(!match) return { ok:false, reason:"no_match" };

      const realId = (() => {
        const bt = normKey(blockTitle);
        for(let i=0;i<all.length;i++){
          const t = all[i];
          if(!hasValidScopeMatch(t, scopeId)) continue;
          if(!isAssignedToMe(t, empNo)) continue;
          if(normKey(getTaskTitle(t)) !== bt) continue;
          return getTaskId(t, i);
        }
        return "";
      })();
      if(!realId) return { ok:false, reason:"no_real_id" };

      const ok = markTaskDone(realId, auth);
      return ok ? { ok:true } : { ok:false, reason:"save_fail" };
    }

    function animateToTrash(noteEl, auth){
      noteEl.classList.add("is-crumpling");

      window.setTimeout(() => {
        const noteRect = noteEl.getBoundingClientRect();
        const trashRect = trashBox.getBoundingClientRect();

        const targetX = (trashRect.left + trashRect.width/2) - (noteRect.left + noteRect.width/2);
        const targetY = (trashRect.top + trashRect.height/2) - (noteRect.top + noteRect.height/2);

        noteEl.classList.remove("is-crumpling");
        noteEl.classList.add("is-throwing");

        noteEl.style.transition = "transform 420ms cubic-bezier(.2,.9,.15,1)";
        noteEl.style.transform = `translate(${targetX}px, ${targetY}px) rotate(22deg) scale(0.2)`;

        window.setTimeout(() => {
          noteEl.remove();
          render(auth);
        }, 440);
      }, 520);
    }

    /* ===========================
       Events
    ============================ */

    prevDayBtn.addEventListener("click", () => {
      selectedDate = new Date(selectedDate.getTime() - 86400000);
      selectedDate.setHours(12,0,0,0);
      if (AUTH) render(AUTH);
    });

    nextDayBtn.addEventListener("click", () => {
      selectedDate = new Date(selectedDate.getTime() + 86400000);
      selectedDate.setHours(12,0,0,0);
      if (AUTH) render(AUTH);
    });

    todayBtn.addEventListener("click", () => {
      selectedDate = new Date();
      selectedDate.setHours(12,0,0,0);
      if (AUTH) render(AUTH);
    });

    notesGrid.addEventListener("click", (e) => {
      const btn = e.target?.closest?.("button[data-action]");
      if(!btn || !AUTH) return;

      const action = btn.getAttribute("data-action");

      if(action === "done-task"){
        const taskId = btn.getAttribute("data-task-id");
        if(!taskId) return;

        const noteEl = notesGrid.querySelector(`.note[data-source="task"] button[data-task-id="${CSS.escape(String(taskId))}"]`)?.closest?.(".note");
        if(!noteEl) return;

        const ok = markTaskDone(taskId, AUTH);
        if(!ok){
          showGuard("Fail-closed: kunde inte markera uppgiften som klar (scope/ägare matchar inte eller data är korrupt).");
          return;
        }
        animateToTrash(noteEl, AUTH);
        return;
      }

      if(action === "done-pkg-task"){
        const noteEl = btn.closest(".note");
        if(!noteEl) return;

        const titleEl = noteEl.querySelector(".t");
        const blockTitle = titleEl ? titleEl.textContent : "";
        if(!String(blockTitle || "").trim()){
          showGuard("Fail-closed: saknar titel för kortet (korrupt data).");
          return;
        }

        const res = markMatchingTaskDoneByTitle(blockTitle, AUTH);
        if(!res.ok){
          if(res.reason === "no_match"){
            showGuard("Fail-closed: hittade ingen kopplad uppgift att markera som klar. (Ingen schemamotor här.)");
          }else{
            showGuard("Fail-closed: kunde inte spara (localStorage kan vara fullt/blockerat).");
          }
          return;
        }

        animateToTrash(noteEl, AUTH);
        return;
      }
    });

    logoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      if (window.HRApp && typeof window.HRApp.logout === "function") {
        window.HRApp.logout();
      } else {
        try { sessionStorage.removeItem(KEY_SESSION); } catch {}
        try { localStorage.removeItem(KEY_SESSION); } catch {}
        window.location.href = "../UI/UI-01-SKELETON.html?err=logout";
      }
    });

    // init (kopplat till kärnan)
    (function init(){
      const res = mustAuthOrStop();
      if (!res) return;
      AUTH = res.auth;
      render(AUTH);
    })();
  </script>
