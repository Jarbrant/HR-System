<!-- ============================================================
AO-048 (PATCH) | FIL-ID: employee/home.html
Projekt: HR-System
Syfte: Employee – Dagskalender + Post-its med visuell “knöggla & kasta”
Policy (LÅST): UI-only • Fail-closed • sessionStorage först • fallback localStorage • XSS-escape • Inga nya storage-keys
Keys (LÅST):
- AO-001_LOGIN_V1 (sessionStorage/localStorage) – session
- AO-014_TASKS_V1 (localStorage) – uppgifter
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Medarbetare</title>
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#0f172a;
      --muted:#64748b;
      --line:rgba(15,23,42,.12);

      --cal1:rgba(238,242,255,.85);
      --cal2:rgba(236,254,255,.75);

      --note1:#fff7c2;
      --note2:#ffd6a5;
      --note3:#cdeaff;
      --note4:#d9f7d6;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Top nav */
    .topbar{
      position: sticky;
      top:0;
      z-index:10;
      background: rgba(246,247,251,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
    }
    .nav{
      max-width:1100px;
      margin:0 auto;
      padding:10px 16px;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .nav a{
      text-decoration:none;
      color:var(--ink);
      font-size:14px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid transparent;
    }
    .nav a:hover{ border-color:var(--line); background:#fff; }
    .nav .spacer{ flex:1; }
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--line);
      background:#fff;
      padding:6px 10px;
      border-radius:999px;
      white-space:nowrap;
    }

    .wrap{
      max-width:1100px;
      margin:16px auto 28px;
      padding:0 16px;
    }

    .guard{
      border:1px solid rgba(239,68,68,.25);
      background:rgba(254,242,242,.9);
      color:#7f1d1d;
      padding:12px 14px;
      border-radius:14px;
      margin:14px 0;
      display:none;
    }

    /* Header card */
    .header{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      margin-bottom:14px;
    }
    .header h1{
      margin:0 0 6px;
      font-size:16px;
      font-weight:900;
    }
    .header p{
      margin:0;
      font-size:13px;
      color:var(--muted);
      line-height:1.4;
    }
    .voice{
      margin-top:10px;
      padding:14px;
      border-radius:16px;
      border:1px dashed rgba(15,23,42,.22);
      background: linear-gradient(135deg, rgba(238,242,255,.95), rgba(236,254,255,.95));
      font-weight:900;
      font-size:16px;
    }

    .grid{
      display:grid;
      grid-template-columns: 340px 1fr;
      gap:16px;
      align-items:start;
    }
    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
    }

    /* Calendar */
    .cal{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
    }
    .calHead{
      padding:14px 14px 10px;
      border-bottom:1px solid var(--line);
      background: linear-gradient(180deg, var(--cal1), #fff);
    }
    .calHeadTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }
    .calHead h2{
      margin:0;
      font-size:14px;
      font-weight:900;
    }
    .controls{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .btn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:8px 10px;
      font-size:13px;
      cursor:pointer;
      user-select:none;
    }
    .btn:hover{ background:#fafafa; }
    .btn:active{ transform:translateY(1px); }

    .dateRow{
      margin-top:10px;
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:10px;
    }
    .dateBig{
      font-size:18px;
      font-weight:950;
      letter-spacing:.2px;
    }
    .dateSmall{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }
    .badge{
      font-size:12px;
      border-radius:999px;
      padding:6px 10px;
      border:1px solid rgba(15,23,42,.10);
      background: rgba(236,254,255,.70);
      white-space:nowrap;
    }
    .badge.done{
      background: rgba(217,247,214,.85);
      border-color: rgba(16,185,129,.25);
    }

    .calBody{ padding:12px 14px 14px; }
    .block{
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      background: rgba(238,242,255,.55);
      margin-bottom:10px;
    }
    .block.alt{ background: rgba(236,254,255,.55); }
    .block h3{
      margin:0 0 8px;
      font-size:13px;
      font-weight:900;
    }
    .list{
      list-style:none;
      margin:0;
      padding:0;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .item{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      padding:10px 10px;
      border-radius:14px;
      border:1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,.92);
    }
    .name{
      font-size:13px;
      font-weight:800;
      line-height:1.25;
    }
    .meta{
      font-size:12px;
      color:var(--muted);
      margin-top:2px;
    }

    /* Board */
    .board{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      position:relative;
      min-height:520px;
    }
    .boardHead{
      padding:14px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      background: linear-gradient(180deg, #fff, #fafafa);
    }
    .boardHead h2{
      margin:0;
      font-size:14px;
      font-weight:950;
    }
    .hint{
      font-size:12px;
      color:var(--muted);
    }

    .notes{
      padding:14px;
      display:grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap:14px;
      align-items:start;
    }
    @media (max-width: 980px){
      .notes{ grid-template-columns: 1fr; }
    }

    .note{
      border-radius:16px;
      border:1px solid rgba(15,23,42,.12);
      box-shadow: 0 10px 20px rgba(15,23,42,.06);
      padding:12px;
      position:relative;
      transform: rotate(var(--tilt, -1deg));
      transition: transform .2s ease, box-shadow .2s ease;
      will-change: transform, opacity, filter;
      transform-origin: 30% 20%;
    }
    .note:hover{
      transform: rotate(var(--tilt, -1deg)) translateY(-2px);
      box-shadow: 0 14px 24px rgba(15,23,42,.10);
    }
    .note .t{
      font-weight:950;
      font-size:14px;
      margin:0 0 6px;
      line-height:1.25;
    }
    .note .s{
      font-size:12px;
      color: rgba(15,23,42,.72);
      margin:0 0 10px;
      line-height:1.35;
    }
    .row{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
    }
    .mini{
      font-size:12px;
      color:var(--muted);
    }
    .doneBtn{
      border:1px solid rgba(15,23,42,.12);
      background: rgba(255,255,255,.75);
      border-radius:12px;
      padding:8px 10px;
      cursor:pointer;
      font-size:13px;
      font-weight:900;
    }
    .doneBtn:hover{ background: rgba(255,255,255,.95); }
    .doneBtn:active{ transform: translateY(1px); }

    /* Trash */
    .trash{
      position:absolute;
      right:14px;
      bottom:14px;
      width:170px;
      height:120px;
      border-radius:16px;
      border:1px dashed rgba(15,23,42,.18);
      background: rgba(15,23,42,.03);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:6px;
      pointer-events:none;
    }
    .trash .icon{ font-size:22px; opacity:.85; }
    .trash .txt{ font-size:12px; color:var(--muted); text-align:center; padding:0 10px; }

    /* === Filmisk “knöggla & kasta” ===
       1) crumple: tappar form
       2) throw: flyger mot papperskorg
    */
    .note.is-crumpling{
      animation: crumple 520ms ease forwards;
    }
    @keyframes crumple{
      0%   { transform: rotate(var(--tilt, -1deg)) scale(1); filter: blur(0px); }
      35%  { transform: rotate(8deg) scale(.94) skewX(2deg); filter: blur(.2px); }
      65%  { transform: rotate(-12deg) scale(.82) skewX(-3deg); filter: blur(.6px); }
      100% { transform: rotate(18deg) scale(.62); filter: blur(.9px); }
    }

    /* when we have target coords we switch to throwing */
    .note.is-throwing{
      animation: throw 420ms cubic-bezier(.2,.9,.15,1) forwards;
    }
    @keyframes throw{
      0%   { opacity: 1; }
      55%  { opacity: .9; }
      100% { opacity: 0; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce){
      .note.is-crumpling, .note.is-throwing{ animation: none !important; opacity: 0 !important; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="nav" aria-label="Primär navigation">
      <a href="./home.html" aria-current="page">Hem</a>
      <a href="./tasks.html">Uppgifter</a>
      <a href="./questions.html">Frågor</a>
      <a href="./schedule.html">Schema</a>
      <a href="./documents.html">Dokument</a>
      <a href="../report.html">Rapportera fel</a>
      <a href="./profile.html">Min sida</a>
      <div class="spacer"></div>
      <span class="pill" id="whoPill">—</span>
      <a href="#" id="logoutLink">Logga ut</a>
    </div>
  </div>

  <main class="wrap">
    <div class="guard" id="guardBox" role="alert"></div>

    <section class="header">
      <h1>Min sida</h1>
      <p id="helloLine">Hej — • Anst.nr — • Roll EMPLOYEE</p>
      <div class="voice" id="voiceLine">—</div>
    </section>

    <section class="grid" aria-label="Dagsvy">
      <!-- Vänster -->
      <aside class="cal" aria-label="Dagskalender">
        <div class="calHead">
          <div class="calHeadTop">
            <h2>Dagskalender</h2>
            <div class="controls">
              <button class="btn" id="prevDayBtn" type="button" aria-label="Föregående dag">◀</button>
              <button class="btn" id="todayBtn" type="button">Idag</button>
              <button class="btn" id="nextDayBtn" type="button" aria-label="Nästa dag">▶</button>
            </div>
          </div>

          <div class="dateRow">
            <div>
              <div class="dateBig" id="dateBig">—</div>
              <div class="dateSmall" id="dateSmall">—</div>
            </div>
            <div class="badge" id="dayBadge">—</div>
          </div>
        </div>

        <div class="calBody">
          <div class="block">
            <h3>Färdig</h3>
            <ul class="list" id="doneList"></ul>
          </div>
          <div class="block alt">
            <h3>Återstår</h3>
            <ul class="list" id="todoList"></ul>
          </div>
        </div>
      </aside>

      <!-- Höger -->
      <section class="board" aria-label="Post-it-tavla">
        <div class="boardHead">
          <h2>Post-its</h2>
          <div class="hint">Klar → knögglas → kastas → försvinner.</div>
        </div>

        <div class="notes" id="notesGrid" aria-live="polite"></div>

        <div class="trash" id="trashBox" aria-hidden="true">
          <div class="icon">🗑️</div>
          <div class="txt">Papperskorg<br><span style="font-size:11px;">(visuell)</span></div>
        </div>
      </section>
    </section>
  </main>

  <script>
    "use strict";

    /* ===========================
       Keys (LÅST)
    ============================ */
    const KEY_SESSION = "AO-001_LOGIN_V1";
    const KEY_TASKS   = "AO-014_TASKS_V1";

    /* ===========================
       DOM
    ============================ */
    const guardBox  = document.getElementById("guardBox");
    const whoPill   = document.getElementById("whoPill");
    const helloLine = document.getElementById("helloLine");
    const voiceLine = document.getElementById("voiceLine");

    const dateBig   = document.getElementById("dateBig");
    const dateSmall = document.getElementById("dateSmall");
    const dayBadge  = document.getElementById("dayBadge");

    const doneList  = document.getElementById("doneList");
    const todoList  = document.getElementById("todoList");
    const notesGrid = document.getElementById("notesGrid");

    const prevDayBtn = document.getElementById("prevDayBtn");
    const nextDayBtn = document.getElementById("nextDayBtn");
    const todayBtn   = document.getElementById("todayBtn");

    const logoutLink = document.getElementById("logoutLink");
    const trashBox   = document.getElementById("trashBox");

    /* ===========================
       Helpers
    ============================ */
    function safeJsonParse(str){ try { return JSON.parse(str); } catch { return null; } }
    function escapeHtml(input){
      const s = String(input ?? "");
      return s
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function showGuard(msg){ guardBox.style.display = "block"; guardBox.textContent = msg; }
    function hideGuard(){ guardBox.style.display = "none"; guardBox.textContent = ""; }

    // Fail-closed: sessionStorage först, fallback localStorage
    function readSessionFailClosed(){
      const s1 = sessionStorage.getItem(KEY_SESSION);
      const s2 = localStorage.getItem(KEY_SESSION);
      const obj = safeJsonParse(s1 || s2 || "");
      if(!obj || typeof obj !== "object") return null;
      return obj;
    }

    function readTasksArray(){
      const raw = localStorage.getItem(KEY_TASKS);
      const data = safeJsonParse(raw || "");
      if(!Array.isArray(data)) return [];
      return data;
    }

    function writeTasksArray(arr){
      if(!Array.isArray(arr)) return false;
      localStorage.setItem(KEY_TASKS, JSON.stringify(arr));
      return true;
    }

    /* ===========================
       Date
    ============================ */
    const WEEKDAYS = ["Söndag","Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag"];
    const MONTHS   = ["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];

    function toISODate(d){
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    }
    function fmtBig(d){ return WEEKDAYS[d.getDay()]; }
    function fmtSmall(d){ return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }

    let selectedDate = new Date();
    selectedDate.setHours(12,0,0,0);

    /* ===========================
       Task normalization (tolerant läsning)
    ============================ */
    function getTaskId(t, idx){
      const raw = (t && (t.id || t.taskId || t.uuid)) ?? `task_${idx}`;
      return String(raw);
    }
    function getTaskTitle(t){ return String(t?.title ?? t?.name ?? t?.text ?? "Uppgift"); }
    function getTaskDesc(t){ return String(t?.description ?? t?.desc ?? ""); }

    function isDone(t){
      const s = String(t?.status ?? t?.state ?? "").toLowerCase();
      if(t?.done === true) return true;
      if(t?.isDone === true) return true;
      if(s === "done" || s === "klar" || s === "completed" || s === "complete") return true;
      return false;
    }
    function setDone(t){
      if("done" in t) t.done = true;
      else if("isDone" in t) t.isDone = true;
      else t.done = true;
      if("status" in t) t.status = "done";
      return t;
    }

    function getTaskDateISO(t){
      const candidates = [t?.dueDate, t?.date, t?.day, t?.scheduledDate, t?.startDate, t?.startsAt];
      for(const c of candidates){
        if(!c) continue;
        if(typeof c === "string"){
          if(/^\d{4}-\d{2}-\d{2}$/.test(c)) return c;
          const d = new Date(c);
          if(!isNaN(d.getTime())) return toISODate(d);
        } else if(typeof c === "number"){
          const d = new Date(c);
          if(!isNaN(d.getTime())) return toISODate(d);
        }
      }
      return null;
    }

    function taskBelongsToDay(t, dayISO){
      const iso = getTaskDateISO(t);
      if(!iso) return (dayISO === toISODate(new Date())); // saknar datum => behandla som idag
      return iso === dayISO;
    }

    /* ===========================
       Systemets 5 meningar (låst)
    ============================ */
    const VOICE = {
      NOTHING: "Det finns inget som kräver din uppmärksamhet just nu.",
      ONE_LEFT: "Det finns en sak kvar idag, den tar bara en stund.",
      IN_PHASE: "Du är i fas.",
      CAN_WAIT: "Det här kan vänta till imorgon.",
      UNCLEAR: "Något är oklart – säg till om du behöver stöd."
    };

    function chooseVoice(todoCount, doneCount, isToday){
      if(todoCount === 0 && doneCount === 0) return VOICE.NOTHING;
      if(todoCount === 0 && doneCount > 0) return VOICE.IN_PHASE;
      if(todoCount === 1 && isToday) return VOICE.ONE_LEFT;
      if(todoCount > 1 && !isToday) return VOICE.CAN_WAIT;
      if(todoCount > 0 && isToday) return VOICE.UNCLEAR;
      return VOICE.IN_PHASE;
    }

    /* ===========================
       Render
    ============================ */
    function pickNoteBg(i){
      const colors = ["var(--note1)","var(--note2)","var(--note3)","var(--note4)"];
      return colors[i % colors.length];
    }

    function render(){
      hideGuard();

      const session = readSessionFailClosed();
      if(!session){
        showGuard("Du är inte inloggad. Gå tillbaka och logga in igen.");
        whoPill.textContent = "—";
        helloLine.textContent = "Hej — • Anst.nr — • Roll EMPLOYEE";
        voiceLine.textContent = VOICE.NOTHING;
        doneList.innerHTML = "";
        todoList.innerHTML = "";
        notesGrid.innerHTML = "";
        dayBadge.textContent = "—";
        dateBig.textContent = "—";
        dateSmall.textContent = "—";
        return;
      }

      const name = escapeHtml(session.name ?? session.displayName ?? "—");
      const empNo = escapeHtml(session.empNo ?? session.employeeNo ?? "—");
      const role = escapeHtml(session.role ?? "EMPLOYEE");

      whoPill.textContent = `${name} • ${empNo}`;
      helloLine.textContent = `Hej ${name} • Anst.nr ${empNo} • Roll ${role}`;

      const dayISO = toISODate(selectedDate);
      const isToday = dayISO === toISODate(new Date());

      dateBig.textContent = fmtBig(selectedDate);
      dateSmall.textContent = fmtSmall(selectedDate);

      const all = readTasksArray();
      const todays = all.filter(t => taskBelongsToDay(t, dayISO));
      const done = todays.filter(isDone);
      const todo = todays.filter(t => !isDone(t));

      voiceLine.textContent = chooseVoice(todo.length, done.length, isToday);
      dayBadge.textContent = `${done.length} färdig • ${todo.length} återstår`;

      renderCalendarLists(done, todo);
      renderNotes(todo);
    }

    function renderCalendarLists(doneArr, todoArr){
      doneList.innerHTML = "";
      todoList.innerHTML = "";

      if(doneArr.length === 0){
        doneList.innerHTML = `
          <li class="item">
            <div>
              <div class="name">Inget färdigt ännu</div>
              <div class="meta">Det är okej.</div>
            </div>
            <span class="badge done">Färdig</span>
          </li>`;
      } else {
        for(const t of doneArr){
          const title = escapeHtml(getTaskTitle(t));
          const meta = escapeHtml(getTaskDesc(t));
          doneList.insertAdjacentHTML("beforeend", `
            <li class="item">
              <div>
                <div class="name">${title}</div>
                <div class="meta">${meta || "Färdig."}</div>
              </div>
              <span class="badge done">Färdig</span>
            </li>
          `);
        }
      }

      if(todoArr.length === 0){
        todoList.innerHTML = `
          <li class="item">
            <div>
              <div class="name">Inget kvar</div>
              <div class="meta">Det är lugnt.</div>
            </div>
            <span class="badge">—</span>
          </li>`;
      } else {
        for(const t of todoArr){
          const title = escapeHtml(getTaskTitle(t));
          const meta = escapeHtml(getTaskDesc(t));
          todoList.insertAdjacentHTML("beforeend", `
            <li class="item">
              <div>
                <div class="name">${title}</div>
                <div class="meta">${meta || "Återstår."}</div>
              </div>
              <span class="badge">Återstår</span>
            </li>
          `);
        }
      }
    }

    function renderNotes(todoArr){
      notesGrid.innerHTML = "";

      if(todoArr.length === 0){
        notesGrid.innerHTML = `
          <article class="note" style="background: rgba(217,247,214,.85); --tilt:-1deg;">
            <div class="t">Inga post-its idag</div>
            <div class="s">Om något dyker upp senare syns det här.</div>
            <div class="row">
              <div class="mini">—</div>
              <span class="badge done">Lugnt</span>
            </div>
          </article>`;
        return;
      }

      todoArr.forEach((t, idx) => {
        const title = escapeHtml(getTaskTitle(t));
        const desc  = escapeHtml(getTaskDesc(t));
        const id    = escapeHtml(getTaskId(t, idx));
        const bg    = pickNoteBg(idx);
        const tilt  = (idx % 2 === 0) ? "-1.2deg" : "1.1deg";

        notesGrid.insertAdjacentHTML("beforeend", `
          <article class="note" data-task-id="${id}" style="background:${bg}; --tilt:${tilt};">
            <div class="t">${title}</div>
            <div class="s">${desc || "—"}</div>
            <div class="row">
              <div class="mini">Id: ${id}</div>
              <button class="doneBtn" type="button" data-action="done" data-task-id="${id}">Klar</button>
            </div>
          </article>
        `);
      });
    }

    /* ===========================
       Mark done + Animate to trash
    ============================ */
    function markTaskDone(taskId){
      const all = readTasksArray();
      if(!Array.isArray(all) || all.length === 0) return false;

      let found = false;
      for(let i=0;i<all.length;i++){
        const id = getTaskId(all[i], i);
        if(String(id) === String(taskId)){
          all[i] = setDone(all[i]);
          found = true;
          break;
        }
      }
      if(!found) return false;

      writeTasksArray(all);
      return true;
    }

    function animateToTrash(noteEl){
      // 1) knöggla
      noteEl.classList.add("is-crumpling");

      // 2) efter knöggla: flyg till papperskorgen (med riktiga koordinater)
      window.setTimeout(() => {
        const noteRect = noteEl.getBoundingClientRect();
        const trashRect = trashBox.getBoundingClientRect();

        // Målpunkten: mitten av papperskorgen
        const targetX = (trashRect.left + trashRect.width/2) - (noteRect.left + noteRect.width/2);
        const targetY = (trashRect.top + trashRect.height/2) - (noteRect.top + noteRect.height/2);

        noteEl.classList.remove("is-crumpling");
        noteEl.classList.add("is-throwing");

        // Lås transform med inline så att kastet känns "filmigt"
        // (vi lägger rörelse + krympning)
        noteEl.style.transition = "transform 420ms cubic-bezier(.2,.9,.15,1)";
        noteEl.style.transform = `translate(${targetX}px, ${targetY}px) rotate(22deg) scale(0.2)`;

        // 3) efter kast: remove + rerender
        window.setTimeout(() => {
          noteEl.remove();
          render();
        }, 440);
      }, 520);
    }

    /* ===========================
       Events
    ============================ */
    prevDayBtn.addEventListener("click", () => {
      selectedDate = new Date(selectedDate.getTime() - 86400000);
      selectedDate.setHours(12,0,0,0);
      render();
    });

    nextDayBtn.addEventListener("click", () => {
      selectedDate = new Date(selectedDate.getTime() + 86400000);
      selectedDate.setHours(12,0,0,0);
      render();
    });

    todayBtn.addEventListener("click", () => {
      selectedDate = new Date();
      selectedDate.setHours(12,0,0,0);
      render();
    });

    notesGrid.addEventListener("click", (e) => {
      const btn = e.target?.closest?.("button[data-action='done']");
      if(!btn) return;

      const taskId = btn.getAttribute("data-task-id");
      if(!taskId) return;

      const noteEl = notesGrid.querySelector(`.note[data-task-id="${CSS.escape(String(taskId))}"]`);
      if(!noteEl) return;

      const ok = markTaskDone(taskId);
      if(!ok){
        showGuard("Kunde inte markera uppgiften som klar (data saknas eller är korrupt).");
        return;
      }

      animateToTrash(noteEl);
    });

    logoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      sessionStorage.removeItem(KEY_SESSION);
      localStorage.removeItem(KEY_SESSION);
      window.location.href = "../index.html";
    });

    // init
    render();
  </script>
</body>
</html>
