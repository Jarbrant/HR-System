Projekt: HR-System
Syfte: Medarbetarens startsida (Dashboard) – UI-only v1
Policy:

- Ingen känslig data lagras

<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Medarbetare</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <!-- Små, lokala UI-förbättringar (Alt B) -->
  <style>
    .top-actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-bottom:10px;
    }
    .btn-logout{
      opacity:0.8;
    }
    .btn-logout:hover{
      opacity:1;
    }
    .bigcard.action{
      border-style:dashed;
    }
  </style>
</head>
<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Medarbetare</span>
  </div>

  <nav class="nav" aria-label="Meny">
    <a href="./home.html" aria-current="page">Hem</a>
    <a href="#">Uppgifter</a>
    <a href="#">Frågor</a>
    <a href="#">Schema</a>
    <a href="#">Dokument</a>
  </nav>
</header>

<main class="container">

  <!-- Logga ut ENSAMT uppe till höger -->
  <div class="top-actions">
    <button id="btnLogout" class="secondary btn-logout" type="button">
      Logga ut
    </button>
  </div>

  <section class="card">

    <div class="row space-between wrap">
      <div>
        <h1 class="tight">Min sida</h1>
        <div class="muted">
          Hej <strong id="whoName">—</strong>
          • Anst.nr <span id="whoEmpNo">—</span>
          • Roll <span>employee</span>
        </div>
      </div>
    </div>

    <!-- Stora navigationsrutor -->
    <div class="grid-cards">
      <div class="bigcard">
        <div class="bigcard-title">Uppgifter</div>
        <div class="muted">3 att göra idag <span class="tag">demo</span></div>
      </div>

      <div class="bigcard">
        <div class="bigcard-title">Frågor</div>
        <div class="muted">2 nya från chef <span class="tag">demo</span></div>
      </div>

      <div class="bigcard">
        <div class="bigcard-title">Schema</div>
        <div class="muted">Nästa pass: tis 07:00 <span class="tag">demo</span></div>
      </div>

      <div class="bigcard">
        <div class="bigcard-title">Dokument</div>
        <div class="muted">1 policy att kvittera <span class="tag">demo</span></div>
      </div>

      <!-- Rapportera fel: TYDLIG ÅTGÄRD, men i kortytan -->
      <div class="bigcard action">
        <div class="bigcard-title">Rapportera fel</div>
        <div class="muted">Skicka fel med teknisk info</div>
      </div>
    </div>

  </section>
</main>

<script>
/* ============================================================
AO-001 | FIL-ID: employee/home.html (inline JS)
Syfte: Guard + UI-fill + logout
============================================================ */
(function () {
  "use strict";

  const STORAGE_KEY = "AO-001_LOGIN_V1";

  function redirectToLogin() {
    window.location.replace("../UI/UI-01-SKELETON.html#login");
  }

  function readSession() {
    try {
      const raw = sessionStorage.getItem(STORAGE_KEY);
      if (!raw) return null;

      const data = JSON.parse(raw);
      if (!data?.auth?.isAuthed) return null;
      if (data.auth.role !== "employee") return null;
      if (!data.auth.expiresAt || data.auth.expiresAt < Date.now()) return null;

      return data.auth;
    } catch {
      return null;
    }
  }

  function init() {
    const auth = readSession();
    if (!auth) {
      redirectToLogin();
      return;
    }

    document.getElementById("whoName").textContent = auth.displayName || "—";
    document.getElementById("whoEmpNo").textContent = auth.empNo || "—";

    document.getElementById("btnLogout").addEventListener("click", () => {
      sessionStorage.removeItem(STORAGE_KEY);
      redirectToLogin();
    });
  }

  init();
})();
</script>

</body>
</html>
