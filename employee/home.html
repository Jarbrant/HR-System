<!-- ============================================================

Krav:
- Vänster: Dagskalender (bläddra dag)
- Höger: Post-it-lappar (uppgifter)
- Klarmarkering: post-it “knögglas” + slängs i papperskorg
- Klar uppgift visas i dagskalendern som “Färdig”
Policy (LÅST): UI-only • Fail-closed • sessionStorage först • fallback localStorage • XSS-escape • Inga nya storage-keys
Lagring (LÅST):
- AO-001_LOGIN_V1 (sessionStorage/localStorage) – session
- AO-014_TASKS_V1 (localStorage) – uppgifter
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Medarbetare</title>
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    :root{
      --bg: #f6f7fb;
      --card: #ffffff;
      --ink: #111827;
      --muted: #6b7280;
      --line: rgba(17,24,39,.10);

      --cal: #eef2ff;        /* lugn blå */
      --cal2: #ecfeff;       /* lugn cyan */
      --note1:#fff7c2;       /* post-it gul */
      --note2:#ffd6a5;       /* varm */
      --note3:#cdeaff;       /* sval */
      --note4:#d9f7d6;       /* grön */
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* --- Top bar (behåll samma routingkänsla som idag) --- */
    .topbar{
      position: sticky;
      top:0;
      z-index:10;
      background: rgba(246,247,251,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .nav{
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 16px;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap: wrap;
    }
    .nav a{
      text-decoration:none;
      color: var(--ink);
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid transparent;
    }
    .nav a:hover{ border-color: var(--line); background: #fff; }
    .nav .spacer{ flex:1; }
    .pill{
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--line);
      background: #fff;
      padding: 6px 10px;
      border-radius: 999px;
    }

    /* --- Layout --- */
    .wrap{
      max-width: 1100px;
      margin: 18px auto 28px;
      padding: 0 16px;
    }

    .hero{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .hello{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 14px;
      flex: 1;
      min-width: 260px;
    }
    .hello h1{
      margin:0 0 6px;
      font-size: 16px;
      font-weight: 700;
    }
    .hello p{
      margin:0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    /* Systemets röst */
    .voice{
      margin-top: 10px;
      padding: 14px;
      border-radius: 14px;
      border: 1px dashed rgba(17,24,39,.20);
      background: linear-gradient(135deg, rgba(238,242,255,.9), rgba(236,254,255,.9));
      font-weight: 700;
      font-size: 16px;
    }

    .grid{
      display:grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      align-items:start;
    }
    @media (max-width: 980px){
      .grid{ grid-template-columns: 1fr; }
    }

    /* --- Kalender (vänster) --- */
    .calendar{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow:hidden;
    }
    .cal-head{
      padding: 14px 14px 10px;
      background: linear-gradient(180deg, rgba(238,242,255,.9), rgba(255,255,255,1));
      border-bottom: 1px solid var(--line);
    }
    .cal-head .title{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
    }
    .cal-head h2{
      margin:0;
      font-size: 14px;
      font-weight: 800;
    }
    .cal-controls{
      display:flex;
      gap:8px;
      align-items:center;
    }
    .btn{
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 13px;
      cursor:pointer;
      user-select:none;
    }
    .btn:hover{ background: #fafafa; }
    .btn:active{ transform: translateY(1px); }

    .cal-date{
      margin-top: 10px;
      display:flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
    }
    .cal-date .big{
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .2px;
    }
    .cal-date .small{
      color: var(--muted);
      font-size: 12px;
    }

    .cal-body{
      padding: 12px 14px 14px;
    }
    .cal-block{
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: rgba(238,242,255,.55);
      margin-bottom: 10px;
    }
    .cal-block h3{
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 800;
    }
    .cal-list{
      list-style:none;
      margin:0;
      padding:0;
      display:flex;
      flex-direction: column;
      gap: 8px;
    }
    .cal-item{
      display:flex;
      justify-content: space-between;
      gap: 10px;
      align-items:flex-start;
      padding: 10px 10px;
      border-radius: 12px;
      border: 1px solid rgba(17,24,39,.10);
      background: rgba(255,255,255,.9);
    }
    .cal-item .name{
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }
    .cal-item .meta{
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .badge{
      font-size: 12px;
      border-radius: 999px;
      padding: 6px 10px;
      border: 1px solid rgba(17,24,39,.10);
      background: rgba(236,254,255,.7);
      color: #0f172a;
      white-space: nowrap;
    }
    .badge.done{
      background: rgba(217,247,214,.85);
      border-color: rgba(16,185,129,.25);
    }

    /* --- Post-its (höger) --- */
    .board{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow:hidden;
      position: relative;
      min-height: 520px;
    }
    .board-head{
      padding: 14px;
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,1), rgba(250,250,250,1));
    }
    .board-head h2{
      margin:0;
      font-size: 14px;
      font-weight: 900;
    }
    .hint{
      font-size: 12px;
      color: var(--muted);
    }

    .notes{
      padding: 14px;
      display:grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 14px;
      align-items:start;
    }
    @media (max-width: 980px){
      .notes{ grid-template-columns: 1fr; }
    }

    .note{
      border-radius: 14px;
      border: 1px solid rgba(17,24,39,.12);
      box-shadow: 0 10px 20px rgba(17,24,39,.06);
      padding: 12px;
      position: relative;
      transform: rotate(var(--tilt, -1deg));
      transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
      will-change: transform, opacity;
    }
    .note:hover{
      transform: rotate(var(--tilt, -1deg)) translateY(-2px);
      box-shadow: 0 14px 24px rgba(17,24,39,.10);
    }
    .note .t{
      font-weight: 900;
      font-size: 14px;
      margin: 0 0 6px;
      line-height: 1.25;
    }
    .note .s{
      font-size: 12px;
      color: rgba(17,24,39,.70);
      margin: 0 0 10px;
      line-height: 1.35;
    }
    .note .row{
      display:flex;
      gap: 8px;
      align-items:center;
      justify-content: space-between;
    }
    .note .mini{
      font-size: 12px;
      color: var(--muted);
    }
    .note .donebtn{
      border: 1px solid rgba(17,24,39,.12);
      background: rgba(255,255,255,.75);
      border-radius: 12px;
      padding: 8px 10px;
      cursor:pointer;
      font-size: 13px;
      font-weight: 800;
    }
    .note .donebtn:hover{ background: rgba(255,255,255,.95); }
    .note .donebtn:active{ transform: translateY(1px); }

    /* “Knöggla” animation */
    @keyframes crumple {
      0%   { transform: rotate(var(--tilt, -1deg)) scale(1); filter: blur(0px); }
      45%  { transform: rotate(8deg) scale(.92); filter: blur(.3px); }
      70%  { transform: rotate(-12deg) scale(.78); filter: blur(.6px); }
      100% { transform: rotate(18deg) scale(.30); opacity: 0; filter: blur(1px); }
    }
    .note.crumpling{
      animation: crumple 520ms ease forwards;
    }

    /* Papperskorg */
    .trash{
      position:absolute;
      right: 14px;
      bottom: 14px;
      width: 160px;
      height: 120px;
      border-radius: 16px;
      border: 1px dashed rgba(17,24,39,.18);
      background: rgba(17,24,39,.03);
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction: column;
      gap: 6px;
      pointer-events: none; /* bara visuellt */
    }
    .trash .icon{
      font-size: 22px;
      opacity: .8;
    }
    .trash .txt{
      font-size: 12px;
      color: var(--muted);
      text-align:center;
      padding: 0 10px;
    }

    /* Fail-closed panel */
    .guard{
      border: 1px solid rgba(239,68,68,.25);
      background: rgba(254,242,242,.9);
      color: #7f1d1d;
      padding: 12px 14px;
      border-radius: 14px;
      margin: 14px 0;
      display:none;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="nav" aria-label="Primär navigation">
      <a href="./home.html" aria-current="page">Hem</a>
      <a href="./tasks.html">Uppgifter</a>
      <a href="./questions.html">Frågor</a>
      <a href="./schedule.html">Schema</a>
      <a href="./documents.html">Dokument</a>
      <a href="../report.html">Rapportera fel</a>
      <a href="./profile.html">Min sida</a>
      <div class="spacer"></div>
      <span class="pill" id="whoPill">—</span>
      <a href="#" id="logoutLink">Logga ut</a>
    </div>
  </div>

  <main class="wrap">
    <div class="guard" id="guardBox" role="alert"></div>

    <section class="hero">
      <div class="hello">
        <h1>Min sida</h1>
        <p id="helloLine">Hej — • Anst.nr — • Roll EMPLOYEE</p>
        <div class="voice" id="voiceLine">—</div>
      </div>
    </section>

    <section class="grid" aria-label="Dagsvy">
      <!-- VÄNSTER: Dagskalender -->
      <aside class="calendar" aria-label="Dagskalender">
        <div class="cal-head">
          <div class="title">
            <h2>Dagskalender</h2>
            <div class="cal-controls">
              <button class="btn" id="prevDayBtn" type="button" aria-label="Föregående dag">◀</button>
              <button class="btn" id="todayBtn" type="button">Idag</button>
              <button class="btn" id="nextDayBtn" type="button" aria-label="Nästa dag">▶</button>
            </div>
          </div>
          <div class="cal-date">
            <div>
              <div class="big" id="dateBig">—</div>
              <div class="small" id="dateSmall">—</div>
            </div>
            <div class="badge" id="dayBadge">—</div>
          </div>
        </div>

        <div class="cal-body">
          <div class="cal-block">
            <h3>Färdig idag</h3>
            <ul class="cal-list" id="doneList"></ul>
          </div>

          <div class="cal-block" style="background: rgba(236,254,255,.55);">
            <h3>Återstår</h3>
            <ul class="cal-list" id="todoList"></ul>
          </div>
        </div>
      </aside>

      <!-- HÖGER: Post-its -->
      <section class="board" aria-label="Post-it-tavla">
        <div class="board-head">
          <h2>Post-its</h2>
          <div class="hint">Markera klar för att “knöggla” och slänga.</div>
        </div>

        <div class="notes" id="notesGrid" aria-live="polite"></div>

        <div class="trash" aria-hidden="true">
          <div class="icon">🗑️</div>
          <div class="txt">Papperskorg<br><span style="font-size:11px;">(visuell)</span></div>
        </div>
      </section>
    </section>
  </main>

  <script>
    "use strict";

    /* ===========================
       GUARD / STORAGE HELPERS
    ============================ */
    const KEY_SESSION = "AO-001_LOGIN_V1";
    const KEY_TASKS = "AO-014_TASKS_V1";

    const guardBox = document.getElementById("guardBox");

    function showGuard(msg){
      guardBox.style.display = "block";
      guardBox.textContent = msg;
    }
    function hideGuard(){
      guardBox.style.display = "none";
      guardBox.textContent = "";
    }

    function safeJsonParse(str){
      try { return JSON.parse(str); } catch { return null; }
    }

    function readSessionFailClosed(){
      // Fail-closed: sessionStorage först, fallback localStorage
      const s1 = sessionStorage.getItem(KEY_SESSION);
      const s2 = localStorage.getItem(KEY_SESSION);
      const obj = safeJsonParse(s1 || s2 || "");
      if(!obj || typeof obj !== "object") return null;
      return obj;
    }

    function readTasksArray(){
      const raw = localStorage.getItem(KEY_TASKS);
      const data = safeJsonParse(raw || "");
      if(!Array.isArray(data)) return [];
      return data;
    }

    function writeTasksArray(arr){
      // Fail-safe: skriv bara om det är array
      if(!Array.isArray(arr)) return false;
      localStorage.setItem(KEY_TASKS, JSON.stringify(arr));
      return true;
    }

    function escapeHtml(input){
      const s = String(input ?? "");
      return s
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    /* ===========================
       DATE HELPERS
    ============================ */
    const WEEKDAYS = ["Söndag","Måndag","Tisdag","Onsdag","Torsdag","Fredag","Lördag"];
    const MONTHS = ["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];

    function toISODate(d){
      // YYYY-MM-DD i lokal tid
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    }

    function fmtBig(d){
      const wd = WEEKDAYS[d.getDay()];
      return `${wd}`;
    }

    function fmtSmall(d){
      return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    }

    /* ===========================
       TASK NORMALIZATION
       (ingen ny datamodell – vi läser tolerant)
    ============================ */
    function getTaskId(t, idx){
      // stabilt id om saknas
      const raw = (t && (t.id || t.taskId || t.uuid)) ?? `task_${idx}`;
      return String(raw);
    }

    function getTaskTitle(t){
      return String(t?.title ?? t?.name ?? t?.text ?? "Uppgift");
    }

    function getTaskDesc(t){
      return String(t?.description ?? t?.desc ?? "");
    }

    function isDone(t){
      const s = String(t?.status ?? t?.state ?? "").toLowerCase();
      if(t?.done === true) return true;
      if(t?.isDone === true) return true;
      if(s === "done" || s === "klar" || s === "completed" || s === "complete") return true;
      return false;
    }

    function setDone(t){
      // ändra försiktigt utan att “uppfinna” nya fält om de redan finns:
      if("done" in t) t.done = true;
      else if("isDone" in t) t.isDone = true;
      else t.done = true; // fallback (kan vara nytt fält i praktiken, men inom samma key/datapost)
      if("status" in t) t.status = "done";
      return t;
    }

    function getTaskDateISO(t){
      // Försök hitta en dagskoppling, annars null
      // accepterar: dueDate, date, day, scheduledDate, startsAt, startDate
      const candidates = [t?.dueDate, t?.date, t?.day, t?.scheduledDate, t?.startDate, t?.startsAt];
      for(const c of candidates){
        if(!c) continue;
        if(typeof c === "string"){
          // om redan YYYY-MM-DD
          if(/^\d{4}-\d{2}-\d{2}$/.test(c)) return c;
          // om ISO timestamp
          const d = new Date(c);
          if(!isNaN(d.getTime())) return toISODate(d);
        } else if(typeof c === "number"){
          const d = new Date(c);
          if(!isNaN(d.getTime())) return toISODate(d);
        }
      }
      return null;
    }

    function taskBelongsToDay(t, dayISO){
      const iso = getTaskDateISO(t);
      if(!iso) return (dayISO === toISODate(new Date())); // saknar datum -> behandla som idag
      return iso === dayISO;
    }

    /* ===========================
       UI STATE
    ============================ */
    const helloLine = document.getElementById("helloLine");
    const whoPill = document.getElementById("whoPill");
    const voiceLine = document.getElementById("voiceLine");

    const dateBig = document.getElementById("dateBig");
    const dateSmall = document.getElementById("dateSmall");
    const dayBadge = document.getElementById("dayBadge");

    const doneList = document.getElementById("doneList");
    const todoList = document.getElementById("todoList");
    const notesGrid = document.getElementById("notesGrid");

    const prevDayBtn = document.getElementById("prevDayBtn");
    const nextDayBtn = document.getElementById("nextDayBtn");
    const todayBtn = document.getElementById("todayBtn");

    const logoutLink = document.getElementById("logoutLink");

    let selectedDate = new Date();
    selectedDate.setHours(12,0,0,0);

    /* ===========================
       SYSTEMETS 5 MENINGAR (låst)
    ============================ */
    const VOICE = {
      NOTHING: "Det finns inget som kräver din uppmärksamhet just nu.",
      ONE_LEFT: "Det finns en sak kvar idag, den tar bara en stund.",
      IN_PHASE: "Du är i fas.",
      CAN_WAIT: "Det här kan vänta till imorgon.",
      UNCLEAR: "Något är oklart – säg till om du behöver stöd."
    };

    function chooseVoice(todoCount, doneCount, isToday){
      // enkel, lugn tolkning utan nya meningar
      if(todoCount === 0 && doneCount === 0) return VOICE.NOTHING;
      if(todoCount === 0 && doneCount > 0) return VOICE.IN_PHASE;
      if(todoCount === 1 && isToday) return VOICE.ONE_LEFT;
      if(todoCount > 1 && !isToday) return VOICE.CAN_WAIT;
      if(todoCount > 0 && isToday) return VOICE.UNCLEAR;
      return VOICE.IN_PHASE;
    }

    /* ===========================
       RENDER
    ============================ */
    function render(){
      hideGuard();

      const session = readSessionFailClosed();
      if(!session){
        showGuard("Du är inte inloggad. Gå tillbaka och logga in igen.");
        // fail-closed: visa inte funktion
        voiceLine.textContent = VOICE.NOTHING;
        notesGrid.innerHTML = "";
        doneList.innerHTML = "";
        todoList.innerHTML = "";
        whoPill.textContent = "—";
        helloLine.textContent = "Hej — • Anst.nr — • Roll EMPLOYEE";
        return;
      }

      const name = escapeHtml(session.name ?? session.displayName ?? "—");
      const empNo = escapeHtml(session.empNo ?? session.employeeNo ?? "—");
      const role = escapeHtml(session.role ?? "EMPLOYEE");

      helloLine.textContent = `Hej ${name} • Anst.nr ${empNo} • Roll ${role}`;
      whoPill.textContent = `${name} • ${empNo}`;

      const dayISO = toISODate(selectedDate);
      const isToday = dayISO === toISODate(new Date());

      dateBig.textContent = fmtBig(selectedDate);
      dateSmall.textContent = fmtSmall(selectedDate);

      const all = readTasksArray();

      // filtrera per vald dag
      const todays = all.filter(t => taskBelongsToDay(t, dayISO));

      const done = todays.filter(isDone);
      const todo = todays.filter(t => !isDone(t));

      const msg = chooseVoice(todo.length, done.length, isToday);
      voiceLine.textContent = msg;

      dayBadge.textContent = `${done.length} färdig • ${todo.length} återstår`;

      renderCalendarLists(done, todo);
      renderNotes(todo, dayISO);
    }

    function renderCalendarLists(doneArr, todoArr){
      doneList.innerHTML = "";
      todoList.innerHTML = "";

      if(doneArr.length === 0){
        doneList.innerHTML = `<li class="cal-item"><div><div class="name">Inget färdigt ännu</div><div class="meta">Det är okej.</div></div><span class="badge done">Färdig</span></li>`;
      } else {
        doneArr.forEach((t, idx) => {
          const title = escapeHtml(getTaskTitle(t));
          const meta = escapeHtml(getTaskDesc(t));
          doneList.insertAdjacentHTML("beforeend", `
            <li class="cal-item">
              <div>
                <div class="name">${title}</div>
                <div class="meta">${meta || "Färdig."}</div>
              </div>
              <span class="badge done">Färdig</span>
            </li>
          `);
        });
      }

      if(todoArr.length === 0){
        todoList.innerHTML = `<li class="cal-item"><div><div class="name">Inget kvar</div><div class="meta">Det är lugnt.</div></div><span class="badge">—</span></li>`;
      } else {
        todoArr.forEach((t) => {
          const title = escapeHtml(getTaskTitle(t));
          const meta = escapeHtml(getTaskDesc(t));
          todoList.insertAdjacentHTML("beforeend", `
            <li class="cal-item">
              <div>
                <div class="name">${title}</div>
                <div class="meta">${meta || "Återstår."}</div>
              </div>
              <span class="badge">Återstår</span>
            </li>
          `);
        });
      }
    }

    function pickNoteBg(i){
      const colors = ["var(--note1)","var(--note2)","var(--note3)","var(--note4)"];
      return colors[i % colors.length];
    }

    function renderNotes(todoArr, dayISO){
      notesGrid.innerHTML = "";

      if(todoArr.length === 0){
        notesGrid.innerHTML = `
          <div class="note" style="background: rgba(217,247,214,.8); --tilt: -1deg;">
            <div class="t">Inga post-its idag</div>
            <div class="s">Om något dyker upp senare syns det här.</div>
            <div class="row">
              <div class="mini">${escapeHtml(dayISO)}</div>
              <span class="badge done">Lugnt</span>
            </div>
          </div>
        `;
        return;
      }

      todoArr.forEach((t, idx) => {
        const title = escapeHtml(getTaskTitle(t));
        const desc = escapeHtml(getTaskDesc(t));
        const id = escapeHtml(getTaskId(t, idx));
        const bg = pickNoteBg(idx);
        const tilt = (idx % 2 === 0) ? "-1.2deg" : "1.1deg";

        notesGrid.insertAdjacentHTML("beforeend", `
          <article class="note" data-task-id="${id}" style="background:${bg}; --tilt:${tilt};">
            <div class="t">${title}</div>
            <div class="s">${desc || "—"}</div>
            <div class="row">
              <div class="mini">Id: ${id}</div>
              <button class="donebtn" type="button" data-action="done" data-task-id="${id}">
                Klar
              </button>
            </div>
          </article>
        `);
      });
    }

    /* ===========================
       ACTIONS
    ============================ */
    function markTaskDone(taskId){
      const all = readTasksArray();
      if(!Array.isArray(all) || all.length === 0) return;

      // hitta i hela listan (inte bara dagens)
      let found = false;
      for(let i=0;i<all.length;i++){
        const id = getTaskId(all[i], i);
        if(String(id) === String(taskId)){
          all[i] = setDone(all[i]);
          found = true;
          break;
        }
      }
      if(!found) return;

      writeTasksArray(all);
    }

    function crumpleNote(taskId){
      const el = notesGrid.querySelector(`.note[data-task-id="${CSS.escape(String(taskId))}"]`);
      if(!el) return;

      el.classList.add("crumpling");

      // efter animation: rendera om så att den flyttas till “Färdig”
      window.setTimeout(() => {
        render();
      }, 540);
    }

    /* ===========================
       EVENTS
    ============================ */
    prevDayBtn.addEventListener("click", () => {
      selectedDate = new Date(selectedDate.getTime() - 86400000);
      selectedDate.setHours(12,0,0,0);
      render();
    });

    nextDayBtn.addEventListener("click", () => {
      selectedDate = new Date(selectedDate.getTime() + 86400000);
      selectedDate.setHours(12,0,0,0);
      render();
    });

    todayBtn.addEventListener("click", () => {
      selectedDate = new Date();
      selectedDate.setHours(12,0,0,0);
      render();
    });

    notesGrid.addEventListener("click", (e) => {
      const btn = e.target?.closest?.("button[data-action='done']");
      if(!btn) return;
      const taskId = btn.getAttribute("data-task-id");
      if(!taskId) return;

      // 1) uppdatera storage (så den blir “Färdig”)
      markTaskDone(taskId);

      // 2) knöggla visuellt + “släng”
      crumpleNote(taskId);
    });

    logoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      // fail-closed: rensa session (båda), gå till login om du har den
      sessionStorage.removeItem(KEY_SESSION);
      localStorage.removeItem(KEY_SESSION);
      // Anpassa om du har en specifik loginfil:
      window.location.href = "../index.html";
    });

    // init
    render();
  </script>
</body>
</html>
