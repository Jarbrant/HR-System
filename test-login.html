<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Test Inloggning</title>
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />
  <style>
    .login-container {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
      background: #f4f4f4;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .error-message {
      color: red;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h1>Logga in</h1>
  <form id="loginForm">
    <label for="empNo">Anställningsnummer (empNo)</label>
    <input type="text" id="empNo" name="empNo" required maxlength="20" placeholder="Anställningsnummer" />

    <label for="role">Roll</label>
    <select id="role" name="role" required>
      <option value="">Välj roll</option>
      <option value="EMPLOYEE">EMPLOYEE</option>
      <option value="MANAGER">MANAGER</option>
      <option value="ADMIN">ADMIN</option>
      <option value="SYSTEM_ADMIN">SYSTEM_ADMIN</option>
    </select>

    <button type="submit">Logga in</button>
    <p id="errorMessage" class="error-message"></p>
  </form>
</div>

<script>
// Funktion för att skriva session till localStorage
function writeSession(empNo, role) {
  const session = {
    auth: {
      isAuthed: true,
      role: role,
      empNo: empNo,
      expiresAt: Date.now() + 8 * 60 * 60 * 1000 // TTL 8h
    }
  };
  localStorage.setItem('AO-001_LOGIN_V1', JSON.stringify(session));
}

// Inloggningshantering
document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();

  const empNo = document.getElementById('empNo').value.trim();
  const role = document.getElementById('role').value;

  // Validering
  if (!empNo || !role) {
    document.getElementById('errorMessage').textContent = 'Fyll i både anställningsnummer och roll.';
    return;
  }

  // Skriver sessionen till localStorage
  writeSession(empNo, role);

  // Omdirigera till moduler-sidan efter inloggning
  window.location.href = 'test-modules.html';
});
</script>

</body>
</html>
