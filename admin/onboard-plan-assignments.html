<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Admin • Koppla onboardingplan</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />
  <script src="../UI/UI-03-APP.js"></script>

  <style>
    .pageHead{
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }
    .who{ color:var(--muted); font-size:.95rem; }
    .who strong{ color:#111; }

    .card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:var(--r14);
      box-shadow:var(--shadow-soft);
      padding:14px;
      margin-bottom:14px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 860px){
      .grid{ grid-template-columns:1fr; }
    }

    .message{
      margin-top:10px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:var(--r14);
      background:#fff;
    }
    .message.ok{
      border-color:rgba(16,185,129,.35);
      background:rgba(167,243,208,.18);
    }
    .message.err{
      border-color:rgba(239,68,68,.35);
      background:rgba(254,202,202,.18);
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:720px;
    }
    th,td{
      padding:10px;
      border-bottom:1px solid var(--line);
      text-align:left;
      font-size:.95rem;
    }
    th{
      background:rgba(17,24,39,.04);
      font-weight:900;
    }
    .tableWrap{
      overflow:auto;
      border:1px solid var(--line);
      border-radius:var(--r14);
    }
    .right{ text-align:right; }
  </style>
</head>

<body>
<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• ADMIN • Koppla onboardingplan</span>
  </div>

  <nav class="nav" aria-label="Meny">
    <a href="./home.html">Hem</a>
    <a href="./onboard-plans.html">Planer</a>
    <a href="./onboard-progress.html">Progress</a>
    <a href="./onboard-plan-assignments.html" aria-current="page">Tilldelning</a>
    <a href="#" id="navLogout" style="margin-left:auto;">Logga ut</a>
  </nav>
</header>

<main class="container">

  <div class="pageHead">
    <div>
      <h1 class="tight">Koppla plan → medarbetare</h1>
      <p class="muted">
        Kopplar <strong>active</strong> onboardingplan till empNo via startdatum.
        Ingen exekvering.
      </p>
    </div>
    <div class="who">
      Inloggad: <strong id="whoName">—</strong> • Roll <span id="whoRole">—</span>
    </div>
  </div>

  <section class="card">
    <div class="grid">
      <label>
        Medarbetare (empNo)
        <select id="empSelect"></select>
      </label>
      <label>
        Plan (status = active)
        <select id="planSelect"></select>
      </label>
      <label>
        Startdatum
        <input type="date" id="startDate" />
      </label>
      <div style="align-self:end;">
        <button id="btnAssign" type="button">Spara koppling</button>
      </div>
    </div>

    <p id="msg" class="message" aria-live="polite" style="display:none;"></p>
  </section>

  <section class="card">
    <h2 class="tight">Befintliga kopplingar</h2>
    <div class="tableWrap">
      <table aria-label="Onboarding-kopplingar">
        <thead>
          <tr>
            <th>Employee</th>
            <th>Plan</th>
            <th>Startdatum</th>
            <th>Status</th>
            <th class="right">Åtgärd</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5" class="muted">Laddar…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<script>
(function(){
  "use strict";

  const ASSIGN_KEY = "AO-061";
  const PLANS_KEY  = "AO-060_PLANS_V1";
  const ASG_KEY    = "AO-020_ROLE_ASSIGNMENTS_V2";

  const $ = (s)=>document.querySelector(s);

  function setMsg(kind,text){
    const el=$("#msg");
    el.className="message"+(kind?" "+kind:"");
    el.textContent=text||"";
    el.style.display=text?"block":"none";
  }

  function logout(){
    try{ HRApp.logout(); }catch{}
    location.replace("../UI/UI-01-SKELETON.html");
  }
  $("#navLogout").addEventListener("click",(e)=>{ e.preventDefault(); logout(); });

  const session = HRApp.requireAuth({ allowRoles:["ADMIN","SYSTEM_ADMIN"] });
  if(!session) return;

  $("#whoName").textContent = session.auth?.displayName || "—";
  $("#whoRole").textContent = session.auth?.role || "—";

  function read(key,fb){ try{ return JSON.parse(localStorage.getItem(key)||"null") ?? fb; }catch{ return fb; } }
  function write(key,val){ localStorage.setItem(key,JSON.stringify(val)); }

  const assignments = read(ASG_KEY,{});
  const plans = (read(PLANS_KEY,[])||[]).filter(p=>p.status==="active");
  const links = read(ASSIGN_KEY,[]);

  Object.keys(assignments).forEach(emp=>{
    const o=document.createElement("option");
    o.value=emp; o.textContent=emp;
    $("#empSelect").appendChild(o);
  });

  plans.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id; o.textContent=p.title||p.name||p.id;
    $("#planSelect").appendChild(o);
  });

  function render(){
    const tb=$("#tbody");
    tb.textContent="";
    if(!links.length){
      const tr=document.createElement("tr");
      tr.innerHTML='<td colspan="5" class="muted">Inga kopplingar</td>';
      tb.appendChild(tr);
      return;
    }
    links.forEach(l=>{
      const tr=document.createElement("tr");
      tr.innerHTML=
        `<td>${l.empNo}</td>
         <td>${l.planId}</td>
         <td>${new Date(l.startDateTs).toLocaleDateString("sv-SE")}</td>
         <td>${l.status||"—"}</td>
         <td class="right"><button data-del="${l.empNo}|${l.planId}">Ta bort</button></td>`;
      tb.appendChild(tr);
    });
  }

  $("#btnAssign").addEventListener("click",()=>{
    const emp=$("#empSelect").value;
    const plan=$("#planSelect").value;
    const d=$("#startDate").value;
    if(!emp||!plan||!d){ setMsg("err","Alla fält krävs."); return; }

    const ts=new Date(d+"T00:00").getTime();
    const idx=links.findIndex(x=>x.empNo===emp&&x.planId===plan);
    if(idx>=0) links[idx].startDateTs=ts;
    else links.push({ empNo:emp, planId:plan, startDateTs:ts, status:"active" });

    write(ASSIGN_KEY,links);
    setMsg("ok","Koppling sparad.");
    render();
  });

  $("#tbody").addEventListener("click",(e)=>{
    const b=e.target.closest("button[data-del]");
    if(!b) return;
    const [emp,plan]=b.dataset.del.split("|");
    const i=links.findIndex(x=>x.empNo===emp&&x.planId===plan);
    if(i>=0){
      links.splice(i,1);
      write(ASSIGN_KEY,links);
      render();
    }
  });

  render();
})();
</script>

</html>
