<!-- ============================================================
AO-ADMIN-EMPLOYEE-ALIAS-01 (PROD v1.0) | FIL-ID: admin/employee.html
Projekt: HR-System (GitHub Pages / localStorage-first)
Syfte: Alias/redirect för gamla länkar → skickar till admin/employees.html

POLICY (LÅST):
- UI-only • Inga storage-keys • Inga kopplingar ändras
- Fail-closed: om redirect misslyckas visas tydlig knapp till rätt sida
- Hel-filsleverans
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Admin • Employee</title>

  <!-- Designprofil (samma som övriga admin-sidor) -->
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <meta http-equiv="refresh" content="0; url=./employees.html" />
  <style>
    /* Minimal, men följer designkänslan */
    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }
    .card{
      border: 1px solid var(--line, rgba(15,23,42,.12));
      border-radius: 14px;
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow-soft, 0 10px 24px rgba(15,23,42,.08));
      padding: 14px;
    }
    .muted{ color: var(--muted, #64748b); }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line, rgba(15,23,42,.12));
      background: #fff;
      text-decoration:none;
      color: inherit;
      font-weight: 700;
      min-height: 44px;
    }
    .btn.primary{
      background: #111;
      color: #fff;
      border-color:#111;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="card" role="status" aria-live="polite">
      <h1 style="margin:0 0 6px 0;">Employee (Admin)</h1>
      <p class="muted" style="margin:0 0 12px 0;">
        Du skickas vidare till rätt sida: <strong>employees.html</strong>
      </p>

      <div class="row">
        <a class="btn primary" href="./employees.html">Gå till Personal (Översikt)</a>
        <a class="btn" href="./home.html">Till Admin Home</a>
      </div>
    </div>
  </main>

  <script>
    // Inline-kommentar: Redirect via JS som backup (utöver meta refresh).
    (function(){
      "use strict";
      try{
        // replace() så att back-knappen inte fastnar på alias-sidan
        window.location.replace("./employees.html");
      }catch{
        // fail-closed: gör inget, användaren ser knapparna
      }
    })();
  </script>

<!-- ============================================================
Ändringslogg (≤ 8 rader)
- NY: admin/employee.html skapat som alias/redirect till admin/employees.html
- Meta refresh + JS replace + fallback-knappar
============================================================ -->
</body>
</html>
