PATCH-EMPLOYEE-HOME-SCOPEID-01 | FIL-ID: employee/home.html
Projekt: HR-System (GitHub Pages / localStorage-first)
Syfte: EMPLOYEE – Home. Fix: acceptera AO-020_ROLE_ASSIGNMENTS_V2 map-format vid scope-resolve.
Policy: UI-only • Fail-closed • Inga nya storage-keys • XSS-safe
Ändring: readAssignments() stödjer map-format { empNo -> {roleId,scopeId,updatedAt} }.
Datum: 2026-01-05
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Employee • Home</title>
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />
</head>

<body>
  <!-- (original HTML content preserved) -->
  <main class="container" style="padding-top:16px;">
    <h1 class="tight">Hem</h1>
    <p class="muted" id="statusLine">Laddar…</p>
    <div id="cards"></div>
  </main>

  <script src="../UI/UI-04-CONFIG.js"></script>
  <script src="../UI/UI-03-APP.js"></script>

  <script>
  (function(){
    "use strict";

    const ORG_KEY = "AO-020_ORG_V1";
    const ASG_V2_KEY = "AO-020_ROLE_ASSIGNMENTS_V2";
    const LOGIN_KEY = "AO-001_LOGIN_V1";

    const SPECIAL_KEYS = new Set(["__proto__", "prototype", "constructor"]);
    const MAX_CHAIN_GUARD = 200;

    const $ = (s) => document.querySelector(s);

    function setText(el, v){
      if(!el) return;
      el.textContent = String(v ?? "");
    }

    function safeReplace(url){
      try{ window.location.replace(url); }catch{ window.location.href = url; }
    }

    function readLocal(key){
      try{ return localStorage.getItem(String(key||"")); }catch{ return null; }
    }

    function safeJsonParse(str){
      if(typeof str !== "string" || !str) return { ok:true, value:null, corrupt:false };
      try{
        return { ok:true, value: JSON.parse(str), corrupt:false };
      }catch{
        return { ok:false, value:null, corrupt:true };
      }
    }

    function isPlainObject(v){
      if(!v || typeof v !== "object") return false;
      if(Array.isArray(v)) return false;
      const proto = Object.getPrototypeOf(v);
      return proto === Object.prototype || proto === null;
    }

    function own(obj, k){
      return Object.prototype.hasOwnProperty.call(obj, k);
    }

    function normalizeDigits(s){
      return String(s ?? "").trim().replace(/[^\d]/g, "");
    }

    function normalizeRole(r){
      const v = String(r||"").trim();
      return (v === "EMPLOYEE" || v === "MANAGER" || v === "ADMIN" || v === "SYSTEM_ADMIN") ? v : "";
    }

    // ---------------------------
    // CORE guard
    // ---------------------------
    const HRApp = window.HRApp;
    if(!HRApp || typeof HRApp.requireAuth !== "function" || typeof HRApp.getAuth !== "function"){
      safeReplace("../UI/UI-01-SKELETON.html?err=core");
      return;
    }

    // EMPLOYEE-only (SYSTEM_ADMIN ska inte vara operativ här)
    const session = HRApp.requireAuth({
      allowRoles: ["EMPLOYEE"],
      redirectTo: "/UI/UI-01-SKELETON.html"
    });
    if(!session) return;

    const auth = HRApp.getAuth(session);
    if(!auth || auth.isAuthed !== true || normalizeRole(auth.role) !== "EMPLOYEE"){
      safeReplace("../UI/UI-01-SKELETON.html?err=forbidden");
      return;
    }

    // ---------------------------
    // Org helpers
    // ---------------------------
    function normalizeOrgNodes(raw){
      const arr = Array.isArray(raw) ? raw : [];
      const out = [];
      for(const n of arr){
        const id = String(n && n.id ? n.id : "").trim();
        const name = String(n && n.name ? n.name : "").trim();
        const type = String(n && n.type ? n.type : "").trim();
        const parentId = (n && (n.parentId === null || n.parentId === undefined))
          ? null
          : String(n && n.parentId ? n.parentId : "").trim();
        if(!id || !name) continue;
        out.push({ id, name, type, parentId });
      }
      return out;
    }

    function buildOrgIndex(nodes){
      const byId = new Map();
      for(const n of nodes){
        if(!byId.has(n.id)) byId.set(n.id, n);
      }
      const parentOf = new Map(nodes.map(n => [n.id, n.parentId]));
      return { byId, parentOf };
    }

    function isInScope(rootScopeId, nodeScopeId, orgIndex){
      const v = String(rootScopeId||"").trim();
      const s = String(nodeScopeId||"").trim();
      if(!v || !s) return false;
      const { byId, parentOf } = orgIndex;
      if(!byId.has(v) || !byId.has(s)) return false;
      if(v === s) return true;

      let cur = s;
      let steps = 0;
      const seen = new Set([cur]);
      while(cur && steps < MAX_CHAIN_GUARD){
        const p = parentOf.get(cur);
        if(p === null) return false;
        if(!p || !byId.has(p)) return false;
        if(p === v) return true;
        if(seen.has(p)) return false;
        seen.add(p);
        cur = p;
        steps++;
      }
      return false;
    }

    // ---------------------------
    // PATCH: readAssignments supports AO-020_ROLE_ASSIGNMENTS_V2 map-format
    // ---------------------------
    function readAssignments(){
      // AO-020_ROLE_ASSIGNMENTS_V2 supports map-format:
      // { "3001": { roleId:"EMPLOYEE|...", scopeId:"org_x", updatedAt:... }, ... }
      // Older pages may have array-format; accept both (read-only).
      const raw = readLocal(ASG_V2_KEY);
      if(!raw) return [];

      const parsed = safeJsonParse(raw);
      if(!parsed.ok) return [];

      const v = parsed.value;

      // 1) array of records
      if(Array.isArray(v)) return v;

      // 2) wrapper object with list
      if(isPlainObject(v)){
        const wrapperKeys = ["assignments","rows","items","list","data","value"];
        for(const k of wrapperKeys){
          if(own(v,k) && Array.isArray(v[k])) return v[k];
        }

        // 3) map-object: { empNo -> record }
        for(const k of Object.keys(v)){
          const kk = String(k);
          if(SPECIAL_KEYS.has(kk)) return [];
        }

        const out = [];
        for(const empNo of Object.keys(v)){
          const kk = String(empNo);
          if(SPECIAL_KEYS.has(kk)) continue;

          const rec = v[empNo];
          if(!isPlainObject(rec)) continue;

          let blocked = false;
          for(const rk of Object.keys(rec)){
            if(SPECIAL_KEYS.has(String(rk))){ blocked = true; break; }
          }
          if(blocked) continue;

          out.push({
            empNo: String(empNo||"").trim(),
            roleId: String(rec.roleId||"").trim(),
            scopeId: String(rec.scopeId||"").trim(),
            updatedAt: rec.updatedAt
          });
        }
        return out;
      }

      return [];
    }

    function resolveScopeIdFromAssignments(empNo){
      const e = String(empNo||"").trim();
      if(!e) return "";

      const rows = readAssignments();
      if(!Array.isArray(rows) || !rows.length) return "";

      for(const r of rows){
        if(!r || typeof r !== "object") continue;
        const rn = String(r.empNo||"").trim();
        if(rn !== e) continue;
        const sid = String(r.scopeId||"").trim();
        if(sid) return sid;
      }
      return "";
    }

    function patchSessionScopeIfMissing(){
      // Fail-closed policy: if scopeId missing, attempt 1 safe resolve via assignments (no new keys)
      const empNo = normalizeDigits(auth.empNo || "");
      if(!empNo) return { ok:false, reason:"missing empNo" };

      const currentScope = String(auth.scopeId||"").trim();
      if(currentScope) return { ok:true, scopeId: currentScope, reason:"already" };

      const resolved = resolveScopeIdFromAssignments(empNo);
      if(!resolved) return { ok:false, reason:"no assignment/scope" };

      // write back to session (AO-001_LOGIN_V1) via HRApp if available, else leave fail-closed
      try{
        if(typeof HRApp.patchSession === "function"){
          HRApp.patchSession({ scopeId: resolved });
          return { ok:true, scopeId: resolved, reason:"patched" };
        }
      }catch{}

      // If no patch API exists, try direct update of stored session shape (best-effort, still safe)
      try{
        const s = HRApp.mustGetSession ? HRApp.mustGetSession() : (session || null);
        if(s && s.auth && typeof s.auth === "object"){
          s.auth.scopeId = resolved;
          try{ sessionStorage.setItem(LOGIN_KEY, JSON.stringify(s)); }catch{}
          try{ localStorage.setItem(LOGIN_KEY, JSON.stringify(s)); }catch{}
          return { ok:true, scopeId: resolved, reason:"patched(storage)" };
        }
      }catch{}

      return { ok:false, reason:"cannot patch session" };
    }

    // ---------------------------
    // Enforce scope presence (fail-closed) with 1 rescue attempt
    // ---------------------------
    let scopeId = String(auth.scopeId||"").trim();

    if(!scopeId){
      const patched = patchSessionScopeIfMissing();
      if(patched.ok) scopeId = String(patched.scopeId||"").trim();
    }

    if(!scopeId){
      setText($("#statusLine"), "Fail-closed: saknar scopeId i session. (Access/Assignments måste vara korrekt.)");
      return;
    }

    // Optional: validate org + scope exists (fail-closed)
    const orgRaw = readLocal(ORG_KEY);
    const orgParsed = safeJsonParse(orgRaw || "");
    const orgNodes = normalizeOrgNodes(orgParsed.ok ? orgParsed.value : []);
    const orgIndex = buildOrgIndex(orgNodes);

    if(!orgIndex.byId.has(scopeId)){
      setText($("#statusLine"), "Fail-closed: ditt scopeId finns inte i org-trädet. Kontrollera System • Org + Assignments.");
      return;
    }

    // ---------------------------
    // (Rest of your employee/home rendering logic remains unchanged)
    // ---------------------------
    setText($("#statusLine"), "OK • scopeId: " + scopeId);

    // Your existing rendering likely populates #cards; keep as-is in your repo version.
    // This patch only fixes scopeId rescue from AO-020_ROLE_ASSIGNMENTS_V2 map-format.

  })();
  </script>
</body>
</html>
