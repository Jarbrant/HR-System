<!-- ============================================================
AO-ADMIN-EMPLOYEE-ALIAS-01 (PROD v1.1) | FIL-ID: admin/employee.html
Projekt: HR-System (GitHub Pages / localStorage-first)
Syfte: Alias/redirect för gamla länkar → skickar till admin/employees.html

POLICY (LÅST):
- UI-only • Inga storage-keys • Inga kopplingar ändras
- Fail-closed: om redirect misslyckas visas tydliga knappar till rätt sida
- Behåll querystring + hash (nytt tänk) så att employees.html kan läsa ?empNo=...
- Hel-filsleverans
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Admin • Employee (Alias)</title>

  <!-- Designprofil (samma som övriga admin-sidor) -->
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <!-- Fail-closed: vi använder INTE meta refresh nu, eftersom den kan tappa query.
       Redirect görs i JS direkt efter load. -->
  <style>
    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }
    .card{
      border: 1px solid var(--line, rgba(15,23,42,.12));
      border-radius: 14px;
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow-soft, 0 10px 24px rgba(15,23,42,.08));
      padding: 14px;
    }
    .muted{ color: var(--muted, #64748b); }
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line, rgba(15,23,42,.12));
      background: #fff;
      text-decoration:none;
      color: inherit;
      font-weight: 700;
      min-height: 44px;
    }
    .btn.primary{
      background: #111;
      color: #fff;
      border-color:#111;
    }
    .mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: .95rem;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="card" role="status" aria-live="polite">
      <h1 style="margin:0 0 6px 0;">Employee (Admin) – Alias</h1>

      <p class="muted" style="margin:0 0 10px 0;">
        Du skickas vidare till: <strong>employees.html</strong>
      </p>

      <p class="muted" style="margin:0 0 12px 0;">
        Parametrar följer med: <span class="mono" id="q">—</span>
      </p>

      <div class="row">
        <a class="btn primary" id="goEmployees" href="./employees.html">Gå till Personal (Översikt)</a>
        <a class="btn" href="./home.html">Till Admin Home</a>
      </div>

      <p class="muted" style="margin:12px 0 0 0;">
        Om du hamnar här utan att skickas vidare: klicka på knappen ovan.
      </p>
    </div>
  </main>

  <script>
    (function(){
      "use strict";

      // Inline-kommentar: behåll query + hash (för ?empNo=...&flash=...)
      var search = String(window.location.search || "");
      var hash = String(window.location.hash || "");

      // Inline-kommentar: bygg target relativt denna mapp
      var target = "./employees.html" + search + hash;

      // UI: visa params i text (endast textContent => XSS-safe)
      var q = document.getElementById("q");
      if(q) q.textContent = (search || hash) ? (search + hash) : "—";

      // UI: uppdatera fallback-knapp så den också behåller params
      var a = document.getElementById("goEmployees");
      if(a) a.setAttribute("href", target);

      // Redirect: replace() så back-knappen inte fastnar på alias-sidan
      try{
        window.location.replace(target);
      }catch{
        // Fail-closed: gör inget. Användaren kan klicka manuellt.
      }
    })();
  </script>

  <!-- ============================================================
  Ändringslogg (≤ 8 rader)
  - v1.1: Redirect via JS (inte meta refresh) för att behålla querystring + hash
  - Fallback-knapp uppdateras med samma params (XSS-safe)
  - Fortsatt: inga storage-keys, inga dataändringar
  ============================================================ -->
</body>
</html>
