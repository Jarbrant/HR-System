<!-- ============================================================
AO-ADMIN-EMPLOYEE-ALIAS-01 (PROD v1.2) | FIL-ID: admin/employee.html
Projekt: HR-System (GitHub Pages / localStorage-first)
Syfte: Alias/redirect för gamla länkar → skickar till admin/employees.html

POLICY (LÅST):
- UI-only • Inga storage-keys • Inga kopplingar ändras
- Fail-closed: om redirect misslyckas visas tydliga knappar till rätt sida
- Behåll querystring + hash (nytt tänk) så att employees.html kan läsa ?empNo=...
- Hel-filsleverans
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Admin • Employee (Alias)</title>

  <!-- Designmall -->
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    /* Inline: bara det som inte garanterat finns i designmallen */
    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      font-size: .95rem;
    }
  </style>
</head>

<body>
<main class="container" style="max-width:980px;">
  <section class="card" role="status" aria-live="polite">
    <h1 class="tight">Employee (Admin) – Alias</h1>

    <p class="muted" style="margin-top:6px;">
      Du skickas vidare till: <strong>employees.html</strong>
    </p>

    <p class="muted" style="margin-top:8px;">
      Parametrar följer med: <span class="mono" id="q">—</span>
    </p>

    <div class="row" style="margin-top:12px;">
      <a id="goEmployees" href="./employees.html">Gå till Personal (Översikt)</a>
      <a class="secondary" href="./home.html">Till Admin Home</a>
    </div>

    <p class="muted small" style="margin-top:12px;">
      Om du hamnar här utan att skickas vidare: klicka på knappen ovan.
    </p>
  </section>
</main>

<script>
  (function(){
    "use strict";

    // Inline-kommentar: behåll query + hash (för ?empNo=...&flash=...)
    var search = String(window.location.search || "");
    var hash = String(window.location.hash || "");

    // Inline-kommentar: bygg target relativt denna mapp
    var target = "./employees.html" + search + hash;

    // UI: visa params (endast textContent => XSS-safe)
    var q = document.getElementById("q");
    if(q) q.textContent = (search || hash) ? (search + hash) : "—";

    // UI: uppdatera fallback-knapp så den också behåller params
    var a = document.getElementById("goEmployees");
    if(a) a.setAttribute("href", target);

    // Redirect: replace() så back-knappen inte fastnar på alias-sidan
    try{
      window.location.replace(target);
    }catch{
      // Fail-closed: gör inget. Användaren kan klicka manuellt.
    }
  })();
</script>

<!-- ============================================================
Ändringslogg (≤ 8 rader)
- v1.2: Designmall-first (container/card) istället för egna card-stilar
- Fortsatt: JS-redirect som behåller querystring + hash
- Fortsatt: fallback-länk uppdateras med samma params (XSS-safe)
============================================================ -->
</body>
</html>
