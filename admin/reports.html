Syfte: Admin – Felrapporter (UI-only v1)
Policy:

- Läser från sessionStorage / localStorage
- Endast admin har åtkomst
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Felrapporter</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .top-actions{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .report{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      margin-bottom:10px;
      background:#fff;
      transition: box-shadow .15s ease, transform .15s ease;
    }
    .report:hover{
      box-shadow:0 8px 22px rgba(0,0,0,.12);
      transform: translateY(-1px);
    }
    .meta{
      font-size:.85rem;
      color:var(--muted);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .empty{
      padding:20px;
      text-align:center;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:14px;
    }
  </style>
</head>

<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Admin • Felrapporter</span>
  </div>

  <div class="top-actions">
    <a class="btn secondary" href="./home.html">← Admin</a>
    <button id="btnLogout" class="secondary" type="button">Logga ut</button>
  </div>
</header>

<main class="container">

  <h1 class="tight">Felrapporter</h1>
  <p class="muted">
    Inkomna rapporter från medarbetare. UI-only v1.
  </p>

  <section id="list"></section>

</main>

<script>
/* ============================================================
AO-009 | admin/reports.html – Guard + list
============================================================ */
(function(){
  "use strict";

  const SESSION_KEY = "AO-001_LOGIN_V1";
  const REPORT_KEY  = "AO-007_REPORTS_V1"; // används av employee/report.html

  function redirectLogin(){
    location.replace("../UI/UI-01-SKELETON.html");
  }

  function getAuth(){
    try{
      const s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
      if(!s?.auth?.isAuthed) return null;
      if(s.auth.role !== "admin") return null;
      if(s.auth.expiresAt < Date.now()) return null;
      return s.auth;
    }catch{ return null; }
  }

  const auth = getAuth();
  if(!auth){
    redirectLogin();
    return;
  }

  document.getElementById("btnLogout").onclick = () => {
    sessionStorage.removeItem(SESSION_KEY);
    redirectLogin();
  };

  const listEl = document.getElementById("list");
  const reports = JSON.parse(localStorage.getItem(REPORT_KEY) || "[]");

  if(!reports.length){
    listEl.innerHTML = `
      <div class="empty">
        Inga felrapporter ännu.
      </div>
    `;
    return;
  }

  reports
    .slice().reverse()
    .forEach(r => {
      const el = document.createElement("div");
      el.className = "report";
      el.innerHTML = `
        <strong>${r.title || "Felrapport"}</strong>
        <p>${r.message || "—"}</p>
        <div class="meta">
          <span>Roll: ${r.role}</span>
          <span>Sida: ${r.page}</span>
          <span>Språk: ${r.lang}</span>
          <span>${new Date(r.createdAt).toLocaleString()}</span>
        </div>
      `;
      listEl.appendChild(el);
    });

})();
</script>

</body>
</html>
