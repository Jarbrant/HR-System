<!-- ============================================================
AO-009 | FIL-ID: admin/reports.html
Projekt: HR-System
Syfte: Admin – Felrapporter + åtgärdsplan (UI-only v1)
Kompatibilitet:
- Stödjer gamla rapportformat (page/message/createdAt) och nya (url/desc/time)
Policy:
- Ingen backend
- Endast admin
- Lagring: localStorage AO-007_REPORTS_V1
============================================================ -->
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Admin • Felrapporter</title>

  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    .top-actions{ margin-left:auto; display:flex; gap:10px; align-items:center; }
    .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin: 12px 0 6px; }

    .report{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      margin-bottom:10px;
      background:#fff;
      transition: box-shadow .15s ease, transform .15s ease, filter .15s ease;
    }
    .report:hover{ box-shadow:0 10px 28px rgba(0,0,0,.12); transform: translateY(-1px); filter: brightness(1.01); }

    .report-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .meta{ font-size:.88rem; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
    .pill2{
      border:1px solid var(--line);
      border-radius:999px;
      padding:2px 8px;
      font-size:.82rem;
      color:var(--muted);
      background:#fff;
      white-space:nowrap;
    }
    .status-open{ background:#fff6e5; }
    .status-progress{ background:#eef4ff; }
    .status-done{ background:#eef9f1; }

    .details{
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid var(--line);
      display:none;
    }
    .details.show{ display:block; }

    .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; align-items:start; }
    @media (max-width: 980px){ .grid2{ grid-template-columns: 1fr; } }

    .box{ border:1px solid var(--line); border-radius:14px; padding:12px; background:#fff; }
    .box-title{ font-weight:800; margin:0 0 8px; }

    .taskline{
      display:flex;
      gap:10px;
      align-items:center;
      padding:6px 0;
      border-bottom:1px dashed rgba(0,0,0,0.06);
    }
    .taskline:last-child{ border-bottom:none; }
    .taskline input[type="text"]{ flex:1; }

    .empty{
      padding:20px;
      text-align:center;
      color:var(--muted);
      border:1px dashed var(--line);
      border-radius:14px;
      margin-top:12px;
    }

    .actions-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; align-items:center; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace; }

    .toast{
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 60;
      background:#111;
      color:#fff;
      border-radius: 12px;
      padding: 10px 12px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      max-width: min(520px, calc(100vw - 32px));
      pointer-events:none;
    }
    .toast.show{ opacity:0.95; transform: translateY(0); }
  </style>
</head>

<body>

<header class="top">
  <div class="brand">
    <strong>HR-System</strong>
    <span class="muted">• Admin • Felrapporter</span>
  </div>

  <div class="top-actions">
    <a class="btn secondary" href="./home.html">← Admin</a>
    <button id="btnLogout" class="secondary" type="button">Logga ut</button>
  </div>
</header>

<main class="container">
  <h1 class="tight">Felrapporter</h1>
  <p class="muted">Klicka <strong>Öppna</strong> för att läsa och göra åtgärdsplan. UI-only v1.</p>

  <div class="toolbar">
    <label style="min-width:240px; flex:1;">
      Sök
      <input id="q" type="text" placeholder="Sök i rubrik/beskrivning/sida…" />
    </label>

    <label style="min-width:200px;">
      Filter
      <select id="filter">
        <option value="all">Alla</option>
        <option value="open">Öppen</option>
        <option value="progress">Pågår</option>
        <option value="done">Klar</option>
      </select>
    </label>

    <label style="min-width:200px;">
      Sortera
      <select id="sort">
        <option value="newest">Nyast först</option>
        <option value="oldest">Äldst först</option>
      </select>
    </label>
  </div>

  <section id="list"></section>
  <div id="empty" class="empty" style="display:none;">Inga felrapporter matchar.</div>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  const SESSION_KEY = "AO-001_LOGIN_V1";
  const REPORT_KEY  = "AO-007_REPORTS_V1";

  const $ = (s) => document.querySelector(s);

  function toast(text){
    const t = $("#toast");
    t.textContent = text || "";
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1500);
  }

  function redirectLogin(){ location.replace("../UI/UI-01-SKELETON.html"); }

  function getAuth(){
    try{
      const s = JSON.parse(sessionStorage.getItem(SESSION_KEY));
      if(!s?.auth?.isAuthed) return null;
      if(s.auth.role !== "admin") return null;
      if(!s.auth.expiresAt || s.auth.expiresAt < Date.now()) return null;
      return s.auth;
    }catch{ return null; }
  }

  const auth = getAuth();
  if(!auth){ redirectLogin(); return; }

  $("#btnLogout").onclick = () => {
    sessionStorage.removeItem(SESSION_KEY);
    redirectLogin();
  };

  function loadReports(){
    try{
      const data = JSON.parse(localStorage.getItem(REPORT_KEY) || "[]");
      return Array.isArray(data) ? data : [];
    }catch{ return []; }
  }

  function saveReports(arr){
    localStorage.setItem(REPORT_KEY, JSON.stringify(arr));
  }

  function uid(){
    return "r_" + Math.random().toString(36).slice(2, 10) + "_" + Date.now().toString(36);
  }

  function toTs(x){
    // Stödjer: number, ISO-string, "sv-SE" text -> fallback Date.parse
    if(!x) return null;
    if(typeof x === "number") return x;
    const t = Date.parse(String(x));
    return Number.isFinite(t) ? t : null;
  }

  function fmt(ts){
    if(!ts) return "—";
    try{
      return new Date(ts).toLocaleString("sv-SE", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
    }catch{ return "—"; }
  }

  function statusLabel(s){
    if(s === "progress") return "Pågår";
    if(s === "done") return "Klar";
    return "Öppen";
  }
  function statusClass(s){
    if(s === "progress") return "status-progress";
    if(s === "done") return "status-done";
    return "status-open";
  }

  function esc(s){
    return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function ensureCompat(r){
    // Adapter: gamla keys -> nya normaliserade fält
    if(!r.id) r.id = uid();

    // time/createdAt
    const ts = toTs(r.createdAt) || toTs(r.time) || toTs(r.timestamp) || Date.now();
    r.createdAt = ts;

    // page/url
    if(!r.url && r.page) r.url = r.page;

    // desc/message
    if(!r.desc && r.message) r.desc = r.message;

    // plan
    if(!r.adminPlan) r.adminPlan = {};
    if(!r.adminPlan.status) r.adminPlan.status = "open";
    if(!Array.isArray(r.adminPlan.actions)) r.adminPlan.actions = [];

    // defaults
    if(!r.lang) r.lang = "sv";
    if(!r.role) r.role = "employee";

    return r;
  }

  async function copyText(text){
    try{
      await navigator.clipboard.writeText(text);
      return true;
    }catch{
      try{
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        return true;
      }catch{ return false; }
    }
  }

  function buildReadable(r){
    const ap = r.adminPlan || {};
    const actions = Array.isArray(ap.actions) ? ap.actions : [];
    return [
      "=== HR-System • Felrapport ===",
      `ID: ${r.id}`,
      `Tid: ${fmt(r.createdAt)}`,
      `Roll: ${r.role}`,
      `Språk: ${r.lang}`,
      `Sida: ${r.url || "—"}`,
      "",
      `Rubrik: ${r.title || "—"}`,
      "Beskrivning:",
      r.desc || "—",
      "",
      "Steg att återskapa:",
      r.steps || "—",
      "",
      "=== Åtgärdsplan (Admin) ===",
      `Status: ${statusLabel(ap.status || "open")}`,
      `Ansvarig: ${ap.owner || "—"}`,
      `Deadline: ${ap.deadline || "—"}`,
      `Rotorsak (kort): ${ap.rootCause || "—"}`,
      "",
      "Åtgärder:",
      actions.length ? actions.map((a,i)=> `${i+1}) [${a.done ? "x":" "}] ${a.text || "—"}`).join("\n") : "—",
      "",
      "Anteckning:",
      ap.note || "—",
      "=== Slut ==="
    ].join("\n");
  }

  // Load + compat patch
  let reports = loadReports().map(ensureCompat);
  saveReports(reports); // fixar Invalid Date + undefined när det går

  const listEl = $("#list");
  const emptyEl = $("#empty");

  function filtered(){
    const q = ($("#q").value || "").trim().toLowerCase();
    const f = $("#filter").value;
    const s = $("#sort").value;

    let arr = reports.slice();

    if(f !== "all"){
      arr = arr.filter(r => (r.adminPlan?.status || "open") === f);
    }

    if(q){
      arr = arr.filter(r => {
        const blob = `${r.title||""} ${r.desc||""} ${r.url||""}`.toLowerCase();
        return blob.includes(q);
      });
    }

    arr.sort((a,b) => s === "oldest" ? (a.createdAt - b.createdAt) : (b.createdAt - a.createdAt));
    return arr;
  }

  function persist(){
    saveReports(reports);
  }

  function render(){
    const arr = filtered();
    listEl.innerHTML = "";
    emptyEl.style.display = arr.length ? "none" : "block";

    arr.forEach(r => {
      const st = r.adminPlan?.status || "open";

      const card = document.createElement("div");
      card.className = "report";
      card.innerHTML = `
        <div class="report-head">
          <div>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
              <strong>${esc(r.title || "Felrapport")}</strong>
              <span class="pill2 ${statusClass(st)}">${statusLabel(st)}</span>
            </div>
            <div class="meta">
              <span class="pill2 mono">${esc(r.id)}</span>
              <span class="pill2">${fmt(r.createdAt)}</span>
              <span class="pill2 mono">${esc(r.url || "—")}</span>
            </div>
          </div>

          <div style="display:flex; gap:10px; align-items:center;">
            <button class="secondary btnToggle" type="button">Öppna</button>
          </div>
        </div>

        <div class="details">
          <div class="grid2">
            <div class="box">
              <div class="box-title">Rapport</div>
              <p class="muted tight"><strong>Beskrivning</strong></p>
              <p>${esc(r.desc || "—")}</p>

              <p class="muted tight"><strong>Steg att återskapa</strong></p>
              <p>${esc(r.steps || "—")}</p>

              <div class="actions-row">
                <button class="secondary btnCopy" type="button">Kopiera rapport</button>
              </div>
            </div>

            <div class="box">
              <div class="box-title">Åtgärdsplan</div>

              <label>
                Status
                <select class="inpStatus">
                  <option value="open">Öppen</option>
                  <option value="progress">Pågår</option>
                  <option value="done">Klar</option>
                </select>
              </label>

              <label>
                Ansvarig
                <input class="inpOwner" type="text" placeholder="t.ex. Anders" />
              </label>

              <label>
                Deadline
                <input class="inpDeadline" type="text" placeholder="t.ex. 2026-01-10" />
              </label>

              <label>
                Rotorsak (kort)
                <input class="inpRoot" type="text" placeholder="t.ex. saknad fil / fel state / UX" />
              </label>

              <div style="margin-top:10px;">
                <div class="muted" style="margin-bottom:6px;"><strong>Åtgärder</strong></div>
                <div class="actionsList"></div>
                <button class="secondary btnAddAction" type="button" style="margin-top:8px;">+ Lägg till åtgärd</button>
              </div>

              <label style="margin-top:10px;">
                Anteckning
                <textarea class="inpNote" placeholder="Kort logg: vad som gjorts, nästa steg, beslut…"></textarea>
              </label>

              <div class="actions-row">
                <button class="btnSave" type="button">Spara åtgärdsplan</button>
                <button class="secondary btnCopyAll" type="button">Kopiera allt</button>
              </div>

              <p class="muted" style="margin-top:8px;">v1: sparas lokalt i rapporten.</p>
            </div>
          </div>
        </div>
      `;

      // Wire
      const btnToggle = card.querySelector(".btnToggle");
      const details = card.querySelector(".details");
      btnToggle.addEventListener("click", () => {
        const open = details.classList.toggle("show");
        btnToggle.textContent = open ? "Stäng" : "Öppna";
      });

      const ap = r.adminPlan || (r.adminPlan = {});
      const inpStatus = card.querySelector(".inpStatus");
      const inpOwner = card.querySelector(".inpOwner");
      const inpDeadline = card.querySelector(".inpDeadline");
      const inpRoot = card.querySelector(".inpRoot");
      const inpNote = card.querySelector(".inpNote");
      const actionsList = card.querySelector(".actionsList");

      inpStatus.value = ap.status || "open";
      inpOwner.value = ap.owner || "";
      inpDeadline.value = ap.deadline || "";
      inpRoot.value = ap.rootCause || "";
      inpNote.value = ap.note || "";

      function renderActions(){
        actionsList.innerHTML = "";
        const actions = Array.isArray(ap.actions) ? ap.actions : (ap.actions = []);
        if(!actions.length){
          const d = document.createElement("div");
          d.className = "muted";
          d.textContent = "Inga åtgärder ännu.";
          actionsList.appendChild(d);
          return;
        }
        actions.forEach((a, idx) => {
          const line = document.createElement("div");
          line.className = "taskline";
          line.innerHTML = `
            <label style="display:flex; gap:8px; align-items:center; margin:0;">
              <input class="chkDone" type="checkbox" />
              <span class="muted">Klar</span>
            </label>
            <input class="inpActionText" type="text" placeholder="Åtgärd…" />
            <button class="secondary btnDel" type="button">Ta bort</button>
          `;
          const chk = line.querySelector(".chkDone");
          const txt = line.querySelector(".inpActionText");
          const del = line.querySelector(".btnDel");

          chk.checked = !!a.done;
          txt.value = a.text || "";

          chk.addEventListener("change", () => { ap.actions[idx].done = chk.checked; });
          txt.addEventListener("input", () => { ap.actions[idx].text = txt.value; });
          del.addEventListener("click", () => { ap.actions.splice(idx, 1); renderActions(); });

          actionsList.appendChild(line);
        });
      }
      renderActions();

      card.querySelector(".btnAddAction").addEventListener("click", () => {
        ap.actions = Array.isArray(ap.actions) ? ap.actions : [];
        ap.actions.push({ text:"", done:false });
        renderActions();
      });

      card.querySelector(".btnSave").addEventListener("click", () => {
        ap.status = inpStatus.value;
        ap.owner = inpOwner.value.trim();
        ap.deadline = inpDeadline.value.trim();
        ap.rootCause = inpRoot.value.trim();
        ap.note = inpNote.value.trim();

        persist();
        toast("Sparat");
        render(); // uppdaterar status-badge direkt
      });

      card.querySelector(".btnCopy").addEventListener("click", async () => {
        const ok = await copyText(buildReadable(r));
        toast(ok ? "Kopierat" : "Kunde inte kopiera");
      });

      card.querySelector(".btnCopyAll").addEventListener("click", async () => {
        ap.status = inpStatus.value;
        ap.owner = inpOwner.value.trim();
        ap.deadline = inpDeadline.value.trim();
        ap.rootCause = inpRoot.value.trim();
        ap.note = inpNote.value.trim();
        persist();
        const ok = await copyText(buildReadable(r));
        toast(ok ? "Kopierat" : "Kunde inte kopiera");
      });

      listEl.appendChild(card);
    });
  }

  $("#q").addEventListener("input", render);
  $("#filter").addEventListener("change", render);
  $("#sort").addEventListener("change", render);

  render();

})();
</script>

</body>
</html>
