<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR-System – Medarbetare • Uppgifter</title>
  <link rel="stylesheet" href="../UI/UI-02-STYLES.css" />

  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --ink:#0f172a;
      --muted:#64748b;
      --line:rgba(15,23,42,.12);

      --okBg: rgba(217,247,214,.85);
      --warnBg: rgba(255,247,194,.85);
      --infoBg: rgba(205,234,255,.85);

      /* Chips */
      --chipBg: rgba(255,255,255,.75);
      --chipLine: rgba(15,23,42,.12);

      /* Buttons in topbar (semantic) */
      --neutralBtnBg: rgba(15,23,42,.04);
      --neutralBtnLine: rgba(15,23,42,.14);

      --logoutBg: rgba(239,68,68,.10);
      --logoutLine: rgba(239,68,68,.28);
      --logoutInk: rgba(185,28,28,.95);

      /* Focus */
      --focus: rgba(11,95,255,.18);
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    /* Topbar (MASTER DESIGN-SPEC semantics) */
    .topbar{
      position: sticky;
      top:0;
      z-index:10;
      background: rgba(246,247,251,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--line);
    }
    .nav{
      max-width:1100px;
      margin:0 auto;
      padding:10px 16px;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }
    .navLeft{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      min-width: 240px;
    }
    .navRight{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-left:auto;
    }
    .nav a{
      text-decoration:none;
      color:var(--ink);
      font-size:14px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid transparent;
    }
    .nav a:hover{ border-color:var(--line); background:#fff; }
    .nav a:focus{
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--line);
      background:#fff;
      padding:6px 10px;
      border-radius:999px;
      white-space:nowrap;
    }

    .btnLink{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid var(--neutralBtnLine);
      background: var(--neutralBtnBg);
      color: var(--ink);
      text-decoration:none;
      user-select:none;
    }
    .btnLink:hover{
      border-color: rgba(15,23,42,.20);
      box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 10px 24px rgba(0,0,0,.08);
      background: rgba(255,255,255,.85);
    }
    .btnLink:focus{
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .logout{
      border-color: var(--logoutLine);
      background: var(--logoutBg);
      color: var(--logoutInk);
      font-weight: 900;
    }
    .logout:hover{
      border-color: rgba(239,68,68,.38);
      box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 10px 24px rgba(239,68,68,.18);
      background: rgba(239,68,68,.14);
    }

    .wrap{
      max-width:1100px;
      margin:16px auto 28px;
      padding:0 16px;
    }

    .guard{
      border:1px solid rgba(239,68,68,.25);
      background:rgba(254,242,242,.9);
      color:#7f1d1d;
      padding:12px 14px;
      border-radius:14px;
      margin:14px 0;
      display:none;
      white-space:pre-wrap;
    }

    /* Header */
    .header{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:14px;
      margin-bottom:14px;
    }
    .header h1{
      margin:0 0 6px;
      font-size:16px;
      font-weight:900;
    }
    .header p{
      margin:0;
      font-size:13px;
      color:var(--muted);
      line-height:1.4;
    }

    /* Tabs */
    .tabs{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin:12px 0 10px;
    }
    .tab{
      border:1px solid var(--chipLine);
      background: var(--chipBg);
      padding:8px 10px;
      border-radius:12px;
      font-size:13px;
      cursor:pointer;
      user-select:none;
      font-weight:900;
      color: rgba(15,23,42,.88);
    }
    .tab:hover{
      border-color: rgba(15,23,42,.18);
      box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 10px 24px rgba(0,0,0,.08);
      background: rgba(255,255,255,.92);
    }
    .tab:focus{
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .tabActive{
      background: rgba(238,242,255,.95);
      border-color: rgba(99,102,241,.28);
    }

    /* Board */
    .board{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
    }
    .boardHead{
      padding:14px;
      border-bottom:1px solid var(--line);
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      background: linear-gradient(180deg, #fff, #fafafa);
      flex-wrap:wrap;
    }
    .boardHead h2{
      margin:0;
      font-size:14px;
      font-weight:950;
    }
    .hint{
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
      margin-top:2px;
    }
    .boardPills{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
      margin-left:auto;
    }
    .pill2{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--line);
      background:#fff;
      padding:6px 10px;
      border-radius:999px;
      white-space:nowrap;
    }

    /* List */
    .list{
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .card{
      border:1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,.75);
      border-radius:14px;
      padding:10px 12px;
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .card:hover{
      background: rgba(255,255,255,.92);
      box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 10px 24px rgba(0,0,0,.08);
      border-color: rgba(15,23,42,.14);
    }

    .cardMain{
      min-width:0;
      flex:1;
    }
    .t{
      font-weight:950;
      font-size:13px;
      margin:0 0 4px;
      line-height:1.2;
    }
    .s{
      font-size:12px;
      color:var(--muted);
      margin:0;
      line-height:1.25;
    }
    .meta{
      margin-top:6px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .chip{
      font-size:12px;
      border-radius:999px;
      padding:6px 10px;
      border:1px solid rgba(15,23,42,.10);
      background: rgba(255,255,255,.70);
      white-space:nowrap;
      font-weight:900;
      color: rgba(15,23,42,.88);
    }
    .chip.ok{ background: var(--okBg); border-color: rgba(16,185,129,.25); }
    .chip.warn{ background: var(--warnBg); border-color: rgba(245,158,11,.25); }
    .chip.info{ background: var(--infoBg); border-color: rgba(59,130,246,.22); }

    .actions{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .btn{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:8px 10px;
      font-size:13px;
      cursor:pointer;
      user-select:none;
      font-weight:900;
    }
    .btn:hover{
      background:#fafafa;
      box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 10px 24px rgba(0,0,0,.08);
      border-color: rgba(15,23,42,.16);
    }
    .btn:focus{
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .empty{
      border-radius:14px;
      border:1px solid rgba(15,23,42,.10);
      background: rgba(238,242,255,.65);
      padding:12px;
      color: rgba(15,23,42,.88);
    }
    .empty .t{ margin:0 0 4px; }
    .empty .s{ margin:0; }

    @media (prefers-reduced-motion: reduce){
      *{ scroll-behavior:auto !important; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="nav" aria-label="Primär navigation">
      <div class="navLeft" aria-label="Vänster navigation">
        <a href="./home.html">Hem</a>
        <a href="./tasks.html" aria-current="page">Uppgifter</a>
        <a href="./questions.html">Frågor</a>
        <a href="./schedule.html">Schema</a>
        <a href="./documents.html">Dokument</a>
        <a href="../report.html">Rapportera fel</a>
      </div>

      <div class="navRight" aria-label="Höger navigation">
        <span class="pill" id="whoPill">—</span>
        <a class="btnLink" href="./profile.html">Min sida</a>
        <a class="btnLink logout" href="#" id="logoutLink">Logga ut</a>
      </div>
    </div>
  </div>

  <main class="wrap">
    <div class="guard" id="guardBox" role="alert"></div>

    <section class="header">
      <h1>Uppgifter</h1>
      <p id="helloLine">Hej — • Anst.nr — • Roll EMPLOYEE</p>
      <div class="tabs" aria-label="Välj vy">
        <button class="tab tabActive" id="tabTasks" type="button">Gör</button>

          <h2 id="boardTitle">Gör</h2>

        </div>
        <div class="boardPills" aria-label="Status">

  <!-- AO-002 beroenden (LÅSTA): config måste laddas före app -->
  <script src="../UI/UI-04-CONFIG.js"></script>
  <script src="../UI/UI-03-APP.js"></script>

  <script>
    "use strict";

    /* ============================================================
      AO-EMP-TASKS-QA-01 (PROD) | FIL-ID: employee/tasks.html
      Syfte: Employee – “Gör” (Uppgifter + Frågor + Svara + Signera) – UI-only

      POLICY (LÅST):
      - UI-only (GitHub Pages) • Ingen backend
      - Fail-closed • sessionStorage först (session) • fallback localStorage
      - Ingen känslig persondata (endast empNo)
      - Inga nya storage-keys • Datamodell ändras inte
      - XSS-escape på all rendering (textContent, ingen osäker innerHTML)
      ============================================================ */

    /* ===========================
       Keys (LÅST)
    ============================ */
    const KEY_SESSION      = "AO-001_LOGIN_V1";
    const KEY_TASKS        = "AO-014_TASKS_V1";
    const KEY_ASSIGNMENTS  = "AO-020_ROLE_ASSIGNMENTS_V2";

    // Q/A (READ ONLY)
    const KEY_QUESTIONS    = "AO-012_QUESTIONS_V1";
    const KEY_ANSWERS      = "AO-013_ANSWERS_V1";

    /* ===========================
       DOM
    ============================ */
    const guardBox   = document.getElementById("guardBox");
    const whoPill    = document.getElementById("whoPill");
    const helloLine  = document.getElementById("helloLine");
    const scopePill  = document.getElementById("scopePill");

    const tabTasks     = document.getElementById("tabTasks");
    const tabQuestions = document.getElementById("tabQuestions");
    const tabDone      = document.getElementById("tabDone");

    const boardTitle = document.getElementById("boardTitle");
    const boardHint  = document.getElementById("boardHint");
    const countPill  = document.getElementById("countPill");

    const listBox = document.getElementById("listBox");

    const logoutLink = document.getElementById("logoutLink");

    /* ===========================
       Guard + helpers
    ============================ */
    function showGuard(msg){
      guardBox.style.display = "block";
      guardBox.textContent = String(msg || "");
    }
    function hideGuard(){
      guardBox.style.display = "none";
      guardBox.textContent = "";
    }

    function safeJsonParse(str){ try { return JSON.parse(str); } catch { return null; } }

    function readAnyStorage(key){
      try {
        const s1 = sessionStorage.getItem(key);
        if (s1) return s1;
      } catch {}
      try {
        const s2 = localStorage.getItem(key);
        if (s2) return s2;
      } catch {}
      return null;
    }

    function writeSessionPreferred(sessionObj){
      const raw = JSON.stringify(sessionObj);
      try { sessionStorage.setItem(KEY_SESSION, raw); return true; } catch {}
      try { localStorage.setItem(KEY_SESSION, raw); return true; } catch {}
      return false;
    }

    /* ===========================
       AUTH (LÅST via HRApp/core)
       - role: EMPLOYEE
       - scopeId repair via assignments
    ============================ */
    function mustAuthOrStop(){
      if (!window.HRApp || typeof window.HRApp.requireAuth !== "function") {
        showGuard("Systemfel: HRApp saknas. (UI-03-APP.js)");
        return null;
      }
      if (!window.HR_CONFIG || !window.HR_CONFIG.ROLES) {
        showGuard("Systemfel: HR_CONFIG saknas. (UI-04-CONFIG.js)");
        return null;
      }

      const sess = window.HRApp.requireAuth({ allowRoles: [ window.HR_CONFIG.ROLES.EMPLOYEE ] });
      if (!sess) return null;

      let auth = window.HRApp.getAuth(sess);
      if (!auth || auth.isAuthed !== true) {
        showGuard("Fail-closed: saknar giltig session. Logga in igen.");
        return null;
      }

      if (!String(auth.scopeId || "").trim()) {
        const empNo = String(auth.empNo || "").trim();
        const role  = String(auth.role || "").trim();

        const res = resolveScopeIdFromAssignments(empNo, role);
        if (res.scopeId) {
          const patched = patchSessionScope(sess, res.scopeId);
          if (patched) {
            auth = window.HRApp.getAuth(patched) || auth;
          } else {
            showGuard("Fail-closed: kunde inte uppdatera session med scopeId (korrupt session). Logga in igen.");
            return null;
          }
        } else {
          const lines = [];
          lines.push("Fail-closed: saknar scopeId i session.");
          lines.push("(Access/Assignments måste vara korrekt.)");
          lines.push("");
          lines.push("Debug:");
          lines.push(`- assignments hittade: ${res.debug.totalAssignments}`);
          lines.push(`- match på empNo: ${res.debug.matchedEmpNo ? "JA" : "NEJ"}`);
          lines.push(`- match på roll: ${res.debug.matchedRole ? "JA" : "NEJ/ej angivet"}`);
          lines.push(`- scope-fält hittat i match: ${res.debug.foundScopeField ? "JA" : "NEJ"}`);
          showGuard(lines.join("\n"));
          return null;
        }
      }

      return { sess, auth };
    }

    function readAssignmentsRaw(){
      const raw = readAnyStorage(KEY_ASSIGNMENTS);
      if (!raw) return null;
      return safeJsonParse(raw);
    }

    function normalizeAssignments(raw){
      if (Array.isArray(raw)) return raw;

      if (raw && typeof raw === "object") {
        if (Array.isArray(raw.assignments)) return raw.assignments;
        if (Array.isArray(raw.items)) return raw.items;
        if (Array.isArray(raw.data)) return raw.data;

        const byEmp = raw.byEmpNo || raw.byEmployee || raw.empNoMap || raw.map || null;
        if (byEmp && typeof byEmp === "object") {
          const out = [];
          for (const [k, v] of Object.entries(byEmp)) {
            if (v && typeof v === "object") out.push({ empNo: k, ...v });
          }
          return out;
        }
      }

      return [];
    }

    function readAssignments(){
      const parsed = readAssignmentsRaw();
      const list = normalizeAssignments(parsed);
      return Array.isArray(list) ? list : [];
    }

    function normalizeEmpNo(x){ return String(x ?? "").trim(); }
    function normalizeRole(x){ return String(x ?? "").trim(); }

    function pickFirstNonEmpty(obj, keys){
      for (const k of keys) {
        const v = obj?.[k];
        if (v == null) continue;
        const s = String(v).trim();
        if (s) return s;
      }
      return "";
    }

    function extractScopeFromAssignment(a){
      return pickFirstNonEmpty(a, [
        "scopeId","scopeID","scope_id",
        "scope","scopeKey","scope_key",
        "orgScopeId","orgScope","orgScopeKey",
        "nodeId","nodeID","node_id",
        "orgNodeId","orgNodeID","org_node_id",
        "unitId","unitID","unit_id",
        "orgUnitId","orgUnitID","org_unit_id",
        "teamId","teamID","team_id",
        "orgId","orgID","org_id",
        "path","scopePath","orgPath"
      ]);
    }

    function extractRoleFromAssignment(a){
      return pickFirstNonEmpty(a, ["role","roleId","roleID","role_id","roleName"]);
    }

    function extractEmpFromAssignment(a){
      return pickFirstNonEmpty(a, ["empNo","employeeNo","employeeID","employeeId","emp","id","userId"]);
    }

    function resolveScopeIdFromAssignments(empNo, role){
      const me = normalizeEmpNo(empNo);
      const r  = normalizeRole(role);

      const debug = {
        totalAssignments: 0,
        matchedEmpNo: false,
        matchedRole: false,
        foundScopeField: false
      };

      if (!me) return { scopeId:"", debug };

      const list = readAssignments();
      debug.totalAssignments = Array.isArray(list) ? list.length : 0;
      if (!Array.isArray(list) || list.length === 0) return { scopeId:"", debug };

      for (const a of list) {
        if (!a || typeof a !== "object") continue;

        const aEmp = extractEmpFromAssignment(a);
        if (!aEmp || aEmp !== me) continue;
        debug.matchedEmpNo = true;

        const aRole = extractRoleFromAssignment(a);
        if (aRole) {
          if (r && aRole !== r) continue;
          debug.matchedRole = true;
        } else {
          debug.matchedRole = true;
        }

        const scope = extractScopeFromAssignment(a);
        if (scope) {
          debug.foundScopeField = true;
          return { scopeId: scope, debug };
        }
      }

      return { scopeId:"", debug };
    }

    function patchSessionScope(sessionObj, scopeId){
      const sid = String(scopeId || "").trim();
      if (!sessionObj || typeof sessionObj !== "object" || !sid) return null;

      const out = sessionObj;
      if (out.auth && typeof out.auth === "object") out.auth.scopeId = sid;
      out.scopeId = sid;

      writeSessionPreferred(out);
      return out;
    }

    /* ===========================
       Storage readers (NO NEW KEYS)
       IMPORTANT FIX:
       - Accept array OR wrapper objects for questions/answers
    ============================ */
    function readLocalArray(key){
      // Compat: accept array OR wrapper objects (no new storage-keys, no model changes)
      try{
        const raw = localStorage.getItem(key);
        const data = safeJsonParse(raw || "");
        if (Array.isArray(data)) return data;

        if (data && typeof data === "object") {
          // Common wrappers used across pages/versions
          const candidates = [
            data.items, data.data, data.list,
            data.questions, data.answers, data.tasks,
            data.assignments, data.rows
          ];
          for (const c of candidates) {
            if (Array.isArray(c)) return c;
          }
        }
        return [];
      }catch{
        return [];
      }
    }

    function normStr(s){ return String(s ?? "").trim(); }
    function normKey(s){ return normStr(s).toLowerCase().replace(/\s+/g," ").trim(); }

    /* ===========================
       Tasks
    ============================ */
    function readTasksArray(){
      const raw = localStorage.getItem(KEY_TASKS);
      const data = safeJsonParse(raw || "");
      if(!Array.isArray(data)) return [];
      return data;
    }

    function getTaskId(t, idx){
      const raw = (t && (t.id || t.taskId || t.uuid)) ?? `task_${idx}`;
      return String(raw);
    }
    function getTaskTitle(t){ return String(t?.title ?? t?.name ?? t?.text ?? "Uppgift"); }
    function getTaskDesc(t){ return String(t?.description ?? t?.desc ?? ""); }

    function isDone(t){
      const s = String(t?.status ?? t?.state ?? "").toLowerCase();
      if(t?.done === true) return true;
      if(t?.isDone === true) return true;
      if(s === "done" || s === "klar" || s === "completed" || s === "complete") return true;
      return false;
    }

    function getAssignedTo(t){
      return t?.assignedTo ?? t?.assignee ?? t?.toEmpNo ?? t?.empNo ?? t?.targetEmpNo ?? null;
    }

    function isAssignedToMe(t, empNo){
      const a = getAssignedTo(t);
      if (a == null) return false;

      const me = String(empNo || "").trim();
      if (!me) return false;

      if (typeof a === "string" || typeof a === "number") {
        const s = String(a).trim();
        if (s === "ALL" || s === "*") return true;
        return s === me;
      }
      if (Array.isArray(a)) {
        return a.map(x => String(x).trim()).includes(me);
      }
      return false;
    }

    function hasValidScopeMatch(t, myScopeId){
      const scope = String(t?.scopeId ?? t?.scope ?? t?.scopeKey ?? t?.nodeId ?? "").trim();
      const mine  = String(myScopeId ?? "").trim();
      if (!scope || !mine) return false;

      if (window.HRApp && typeof window.HRApp.sameOrMissingScope === "function") {
        return window.HRApp.sameOrMissingScope(scope, mine);
      }
      return scope === mine;
    }

    function visibleTasksForMe(allTasks, empNo, scopeId){
      return (Array.isArray(allTasks) ? allTasks : []).filter(t => {
        if (!hasValidScopeMatch(t, scopeId)) return false;
        if (!isAssignedToMe(t, empNo)) return false;
        return true;
      });
    }

    function buildTaskItems(auth){
      const empNo = normStr(auth?.empNo ?? "");
      const scopeId = normStr(auth?.scopeId ?? "");
      const all = readTasksArray();
      const mine = visibleTasksForMe(all, empNo, scopeId);

      const todo = mine.filter(t => !isDone(t));
      const done = mine.filter(isDone);

      const todoItems = todo.map((t, i) => ({
        kind: "task",
        id: `task_${getTaskId(t, i)}`,
        title: getTaskTitle(t),
        desc: getTaskDesc(t),
        isDone: false
      }));

      const doneItems = done.map((t, i) => ({
        kind: "task",
        id: `task_${getTaskId(t, i)}_done`,
        title: getTaskTitle(t),
        desc: getTaskDesc(t) || "Färdig.",
        isDone: true
      }));

      return { todoItems, doneItems };
    }

    /* ===========================
       Questions + Answers (READ ONLY)
       Matching tolerant (id OR title)
    ============================ */
    function readQuestions(){ return readLocalArray(KEY_QUESTIONS); }
    function readAnswers(){ return readLocalArray(KEY_ANSWERS); }

    function getQuestionId(q){ return String(q?.id ?? q?.questionId ?? q?.qid ?? ""); }
    function getQuestionTitle(q){ return String(q?.title ?? q?.name ?? q?.text ?? ""); }
    function getQuestionDesc(q){ return String(q?.description ?? q?.desc ?? ""); }

    function answerEmpNo(ans){
      return String(ans?.empNo ?? ans?.employeeNo ?? ans?.employeeId ?? ans?.userId ?? "").trim();
    }

    function answerMatchesQuestion(ans, qId, qTitle, myEmpNo){
      if(!ans || typeof ans !== "object") return false;

      const aEmp = answerEmpNo(ans);
      if(aEmp && String(myEmpNo||"").trim() && aEmp !== String(myEmpNo).trim()) return false;

      const aQid = String(ans.questionId ?? ans.qid ?? ans.question_id ?? "");
      if(qId && aQid && aQid === qId) return true;

      const aTitle = String(ans.questionTitle ?? ans.title ?? ans.questionText ?? "");
      if(qTitle && aTitle && normKey(aTitle) === normKey(qTitle)) return true;

      return false;
    }

    function hasAnswerForQuestion(q, myEmpNo){
      const qId = getQuestionId(q);
      const qTitle = getQuestionTitle(q);
      if(!qId && !qTitle) return false;

      const answers = readAnswers();
      if(!Array.isArray(answers) || answers.length === 0) return false;

      return answers.some(a => answerMatchesQuestion(a, qId, qTitle, myEmpNo));
    }

    function buildQuestionItems(auth){
      const empNo = normStr(auth?.empNo ?? "");
      if(!empNo) return { todoItems: [], doneItems: [] };

      const qs = readQuestions();
      if(!Array.isArray(qs) || qs.length === 0) return { todoItems: [], doneItems: [] };

      // NOTE: vi filtrerar inte på scope här (datamodellen varierar). Fail-safe: endast empNo-match i answers.
      const todo = [];
      const done = [];

      for(let i=0; i<qs.length; i++){
        const q = qs[i];
        if(!q || typeof q !== "object") continue;

        const title = normStr(getQuestionTitle(q)) || "Fråga";
        const desc  = normStr(getQuestionDesc(q)) || "";
        const answered = hasAnswerForQuestion(q, empNo);

        const item = {
          kind: "question",
          id: `q_${getQuestionId(q) || ("idx_"+i)}`,
          title,
          desc,
          isDone: !!answered
        };

        (answered ? done : todo).push(item);
      }

      // Stabil sort: title
      todo.sort((a,b)=> String(a.title||"").localeCompare(String(b.title||""), "sv"));
      done.sort((a,b)=> String(a.title||"").localeCompare(String(b.title||""), "sv"));

      return { todoItems: todo, doneItems: done };
    }

    /* ===========================
       UI: render
    ============================ */
    let AUTH = null;
    let ACTIVE_TAB = "tasks"; // "tasks" | "questions" | "done"

    function setTab(tab){
      const t = String(tab || "").toLowerCase().trim();
      ACTIVE_TAB = (t === "questions" || t === "done") ? t : "tasks";

      tabTasks.classList.toggle("tabActive", ACTIVE_TAB === "tasks");
      tabQuestions.classList.toggle("tabActive", ACTIVE_TAB === "questions");
      tabDone.classList.toggle("tabActive", ACTIVE_TAB === "done");

      tabTasks.setAttribute("aria-pressed", String(ACTIVE_TAB === "tasks"));
      tabQuestions.setAttribute("aria-pressed", String(ACTIVE_TAB === "questions"));
      tabDone.setAttribute("aria-pressed", String(ACTIVE_TAB === "done"));

      if (AUTH) render(AUTH);
    }

    function clearList(){
      listBox.textContent = "";
    }

    function renderEmpty(title, desc){
      const box = document.createElement("div");
      box.className = "empty";
      const t = document.createElement("div");
      t.className = "t";
      t.textContent = title;
      const s = document.createElement("div");
      s.className = "s";
      s.textContent = desc;
      box.appendChild(t);
      box.appendChild(s);
      listBox.appendChild(box);
    }

    function renderItemCard(item){
      const card = document.createElement("div");
      card.className = "card";

      const main = document.createElement("div");
      main.className = "cardMain";

      const t = document.createElement("div");
      t.className = "t";
      t.textContent = String(item.title || "—");

      const s = document.createElement("div");
      s.className = "s";
      s.textContent = String(item.desc || "");

      const meta = document.createElement("div");
      meta.className = "meta";

      const kindChip = document.createElement("span");
      kindChip.className = "chip info";
      kindChip.textContent = (item.kind === "question") ? "Fråga" : "Uppgift";

      const stateChip = document.createElement("span");
      stateChip.className = "chip " + (item.isDone ? "ok" : "warn");
      stateChip.textContent = item.isDone ? "Klar" : "Öppen";

      meta.appendChild(kindChip);
      meta.appendChild(stateChip);

      main.appendChild(t);
      if (String(item.desc || "").trim()) main.appendChild(s);
      main.appendChild(meta);

      const actions = document.createElement("div");
      actions.className = "actions";

      // NOTE: vi går via respektive sida (utan att skapa nya keys).
      // - Uppgifter: tasks.html är redan här (för framtida detaljer) => inga extra actions just nu.
      // - Frågor: öppna questions.html (read/answer UI finns där idag)
      if (item.kind === "question" && item.isDone !== true){
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn";
        btn.textContent = "Svara";
        btn.addEventListener("click", () => {
          window.location.href = "./questions.html";
        });
        actions.appendChild(btn);
      } else if (item.kind === "question" && item.isDone === true){
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn";
        btn.textContent = "Läs";
        btn.addEventListener("click", () => {
          window.location.href = "./questions.html";
        });
        actions.appendChild(btn);
      }

      card.appendChild(main);
      card.appendChild(actions);
      return card;
    }

    function render(auth){
      hideGuard();

      const empNo = normStr(auth?.empNo ?? "");
      const role  = normStr(auth?.role ?? "EMPLOYEE");
      const scopeId = normStr(auth?.scopeId ?? "");

      whoPill.textContent = `${empNo || "—"} • ${role}`;
      helloLine.textContent = `Hej • Anst.nr ${empNo || "—"} • Roll ${role}`;
      scopePill.textContent = `Scope: ${scopeId ? scopeId : "—"}`;

      if (!scopeId) {
        clearList();
        countPill.textContent = "—";
        showGuard("Fail-closed: saknar scopeId i session. (Access/Assignments måste vara korrekt.)");
        return;
      }

      const taskData = buildTaskItems(auth);
      const qData = buildQuestionItems(auth);

      const tasksTodo = taskData.todoItems;
      const tasksDone = taskData.doneItems;

      const qTodo = qData.todoItems;
      const qDone = qData.doneItems;

      clearList();

      if (ACTIVE_TAB === "tasks"){
        boardTitle.textContent = "Gör";
        boardHint.textContent = "Här ser du uppgifter för dig. Frågor visas under “Svara”.";
        countPill.textContent = `${tasksTodo.length} öppna`;

        if (tasksTodo.length === 0){
          renderEmpty("Inga uppgifter just nu", "Om något dyker upp senare syns det här.");
          return;
        }
        for (const it of tasksTodo){
          listBox.appendChild(renderItemCard(it));
        }
        return;
      }

      if (ACTIVE_TAB === "questions"){
        boardTitle.textContent = "Svara";
        boardHint.textContent = "Här ser du frågor. Du kan svara eller läsa via Frågor-sidan.";
        countPill.textContent = `${qTodo.length} öppna`;

        if (qTodo.length === 0){
          renderEmpty("Inga frågor att svara på", "Om en ny fråga kommer in syns den här.");
          return;
        }
        for (const it of qTodo){
          listBox.appendChild(renderItemCard(it));
        }
        return;
      }

      // done
      boardTitle.textContent = "Klart";
      boardHint.textContent = "Det här är saker som är markerade som klara (uppgifter) eller besvarade (frågor).";
      const totalDone = tasksDone.length + qDone.length;
      countPill.textContent = `${totalDone} klart`;

      const combined = [];
      for (const t of tasksDone) combined.push(t);
      for (const q of qDone) combined.push(q);

      if (combined.length === 0){
        renderEmpty("Inget klart ännu", "När du slutför uppgifter eller svarar på frågor syns de här.");
        return;
      }

      // Sort: questions first? neutral sort by kind then title
      combined.sort((a,b)=>{
        const ka = (a.kind === "question") ? 0 : 1;
        const kb = (b.kind === "question") ? 0 : 1;
        if (ka !== kb) return ka - kb;
        return String(a.title||"").localeCompare(String(b.title||""), "sv");
      });

      for (const it of combined){
        listBox.appendChild(renderItemCard(it));
      }
    }

    /* ===========================
       Events
    ============================ */
    tabTasks.addEventListener("click", () => setTab("tasks"));
    tabQuestions.addEventListener("click", () => setTab("questions"));
    tabDone.addEventListener("click", () => setTab("done"));

    tabTasks.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); setTab("tasks"); }
    });
    tabQuestions.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); setTab("questions"); }
    });
    tabDone.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); setTab("done"); }
    });

    logoutLink.addEventListener("click", (e) => {
      e.preventDefault();
      if (window.HRApp && typeof window.HRApp.logout === "function") {
        window.HRApp.logout();
      } else {
        try { sessionStorage.removeItem(KEY_SESSION); } catch {}
        try { localStorage.removeItem(KEY_SESSION); } catch {}
        window.location.href = "../UI/UI-01-SKELETON.html?err=logout";
      }
    });

    (function init(){
      const res = mustAuthOrStop();
      if (!res) return;
      AUTH = res.auth;

      (function(){
        // Deep-link support (no storage writes): ?tab=questions
        try{
          const sp = new URLSearchParams(window.location.search || "");
          const t = String(sp.get("tab") || "").toLowerCase().trim();
          if (t === "questions" || t === "frågor" || t === "q") { setTab("questions"); return; }
        }catch{}
        setTab("tasks");
      })();
    })();
  </script>

  <!-- ============================================================
  Ändringslogg (≤ 8 rader)
  1) FIX: readLocalArray gör nu compat-läsning (array eller wrapper-objekt) för AO-012/AO-013.
  2) FIX: “Svara”-fliken kan nu visa frågor även om storage-formatet är {items:[...]}.
  3) UX: Stöd för deep-link: employee/tasks.html?tab=questions öppnar frågefliken direkt.
  4) Topbar: Semantik enligt MASTER DESIGN-SPEC (Min sida neutral, Logga ut rödtonad).
  Testnoteringar:
  - Logga in som EMPLOYEE → öppna employee/tasks.html → fliken “Svara” ska visa öppna frågor.
  - Testa employee/tasks.html?tab=questions → ska starta i “Svara”.
